<p>証明を書くのは、バトンリレーのようなもの。<strong>仮定（スタート）→ 根拠（中継）→ 結論（ゴール）</strong>と、論理をバトンのようにつないでいきます。</p>
<p>書き方の型：「△ABCと△DEFにおいて、AB = DE（仮定より）、∠B = ∠E（○○の性質より）、BC = EF（仮定より）。2組の辺とその間の角がそれぞれ等しいので、△ABC ≡ △DEF」。この<strong>型に当てはめる</strong>ことが、証明の第一歩です。</p>

<div class="tip-box"><div class="tip-title">💡 証明は「逆算」で考える</div>まず結論（何を証明したいか）を確認。合同を示したいなら「3つの合同条件のどれを使うか」を決める。そこから「必要な情報は何か」を逆算して集める。推理小説の犯人を先に知ってから読む感覚です。</div>
<h2>「なぜ？」に答えられる人は強い</h2>
<p>「なんでこのアニメが面白いかって言うとね、主人公が○○で、それに対して敵が○○だから、バトルが盛り上がるんだよ」——こうやって<strong>理由を順番に並べて説明できる人</strong>は、友達からも先生からも「話がわかりやすい」と言われます。合同の証明は、この「根拠→理由→結論」のトレーニング。<strong>「なんとなくそう思う」じゃなく「こうだからこうだ」と言い切れる力</strong>は、ずっと使える武器です。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
合同とは<strong>「まったく同じ形と大きさ」</strong>——移動や回転させるとぴったり重なる。<br>
証明とは「見た目ではなく、論理的に同じだと示すこと」。<br>
三角形の合同条件は3つ：辺辺辺・辺角辺・角辺角。
</div>

<div class="confirm-box"><div class="confirm-title">📋 三角形の合同条件3つ</div>
<table><tr><th>条件</th><th>内容</th><th>覚え方</th></tr>
<tr><td>辺辺辺（SSS）</td><td>3組の辺がすべて等しい</td><td>3本の竹ひごが決まれば三角形は1種類</td></tr>
<tr><td>辺角辺（SAS）</td><td>2組の辺とその間の角が等しい</td><td>2辺とその間の角が決まれば残りも確定</td></tr>
<tr><td>角辺角（ASA）</td><td>1組の辺とその両端の角が等しい</td><td>1辺と両端の角が決まれば残りも確定</td></tr>
</table></div>

<h2>証明の「型」を覚えよう</h2>
<p>合同の証明は毎回同じ「型」で書きます：<br>
「△ABCと△DEFにおいて」（比較する2つの三角形を宣言）<br>
「AB = DE …①」（根拠1）<br>
「∠B = ∠E …②」（根拠2）<br>
「BC = EF …③」（根拠3）<br>
「①②③より、2組の辺とその間の角がそれぞれ等しいので △ABC ≡ △DEF」<br>
<strong>この「型」に当てはめるだけで証明は完成します！</strong></p>
`},
{id:38,section:'ch4',title:'三角形の性質',desc:'二等辺三角形・正三角形の秘密',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>二等辺三角形——「2つが等しい」の連鎖</h2>
<p>2辺が等しい三角形を<strong>二等辺三角形</strong>と言います。面白いのは、2辺が等しいと<strong>底角（等しい2辺に挟まれていない角）も自動的に等しくなる</strong>こと。逆に、2つの角が等しければ、その向かいの2辺も等しい。「辺が等しい → 角が等しい」「角が等しい → 辺が等しい」——<strong>等しさが連鎖する</strong>のが二等辺三角形の美しさです。</p>
<p>東京タワーやエッフェル塔の正面の形は二等辺三角形に近いですよね。左右対称の安定感と美しさを持つ二等辺三角形は、建築やデザインでも愛されています。</p>

<h2>正三角形は「完璧な三角形」</h2>
<p>3辺すべてが等しい<strong>正三角形</strong>。3つの角はすべて60°。正三角形は二等辺三角形のさらに特別な場合であり、二等辺三角形のすべての性質を持っています。ハチの巣の六角形は、正三角形6つでできています。自然界が選んだ「最も効率的な形」なのです。</p>

<div class="callout"><div class="callout-title">📐 二等辺三角形の重要な性質</div>① 底角が等しい<br>② 頂角の二等分線は、底辺の垂直二等分線でもあり、底辺の中点を通る<br>つまり頂角の二等分線を引くと、左右対称の2つの直角三角形に分かれます。証明問題でこの性質は本当によく使います。</div>

<h2>直角三角形は「特権階級」</h2>
<p>直角三角形は90°の角を持つ特別な三角形。通常の合同条件に加えて、直角三角形だけの<strong>特別な合同条件</strong>が2つあります。「斜辺と1つの鋭角」「斜辺と他の1辺」。なぜ特別扱いされるかというと、90°がすでにわかっているぶん、必要な情報が少なくて済むからです。</p>

<div class="tip-box"><div class="tip-title">💡 「逆」を使いこなす</div>「2辺が等しい → 底角が等しい」の<strong>逆</strong>「底角が等しい → 2辺が等しい」も成り立ちます。「二等辺三角形であることを証明せよ」→ 角が等しいことを示す、という戦略が使えるのです。</div>
<h2>「特別なもの」の性質を知る価値</h2>
<p>二等辺三角形は「2辺が等しい」という<strong>たった1つの特別な条件</strong>を持つだけで、底角が等しくなり、対称軸が現れ、美しい性質がたくさん出てきます。「ちょっと特別」なだけで世界が広がる——これは数学に限った話ではありません。あなたの得意なこと（たった1つの特別な条件）が、思いもよらない可能性を広げてくれるかもしれない。二等辺三角形が教えてくれるのは、そんなことでもあります。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
二等辺三角形の特徴：<strong>2辺が等しい → 底角が等しい</strong>（逆も成り立つ）。<br>
正三角形は二等辺三角形の特別な場合——3辺すべて等しく、3角すべて60°。<br>
直角三角形には特別な合同条件がある（斜辺と1鋭角、または斜辺と他の1辺）。
</div>

<div class="confirm-box"><div class="confirm-title">📋 特別な三角形の性質まとめ</div>
<table><tr><th>三角形</th><th>辺の特徴</th><th>角の特徴</th></tr>
<tr><td>二等辺三角形</td><td>2辺が等しい</td><td>底角が等しい</td></tr>
<tr><td>正三角形</td><td>3辺すべて等しい</td><td>3角すべて60°</td></tr>
<tr><td>直角三角形</td><td>a²+b²=c²（三平方）</td><td>1つの角が90°</td></tr>
<tr><td>直角二等辺三角形</td><td>斜辺：他の辺 = √2：1</td><td>45°・45°・90°</td></tr>
</table></div>

<h2>二等辺三角形の「使える性質」</h2>
<p>二等辺三角形ABCで、AB=AC の場合：<br>
・底角が等しい：∠B = ∠C<br>
・頂角の二等分線は底辺の垂直二等分線でもある<br>
・頂角の二等分線で左右対称な2つの直角三角形に分かれる<br>
<strong>証明問題では「底角が等しい」ことを使って次の情報を引き出すことが多い</strong>です。</p>
`},
{id:39,section:'ch4',title:'四角形の性質',desc:'平行四辺形からひし形・長方形・正方形へ',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>四角形の「家系図」</h2>
<p>四角形の世界には面白い「家族関係」があります。ご先祖様は<strong>平行四辺形</strong>。ここに「角がすべて90°」という条件を加えると<strong>長方形</strong>になり、「辺がすべて等しい」を加えると<strong>ひし形</strong>になります。そして両方の条件を満たすと<strong>正方形</strong>。つまり正方形は長方形でもあり、ひし形でもある「最も条件の厳しい四角形」なのです。</p>
<p>この関係を知っていると、「正方形の対角線は等しい？」→ 「正方形は長方形だから、長方形の性質で対角線は等しい。Yes！」と論理的に判断できます。</p>

<div class="callout"><div class="callout-title">📐 平行四辺形の4つの性質</div>① 2組の対辺がそれぞれ<strong>平行</strong><br>② 2組の対辺がそれぞれ<strong>等しい</strong><br>③ 2組の対角がそれぞれ<strong>等しい</strong><br>④ 対角線がそれぞれの<strong>中点で交わる</strong><br>この4つは「平行四辺形ならば成り立つ性質」であると同時に、「どれか1つでも示せれば平行四辺形であることが証明できる」条件でもあります。</div>

<h2>身の回りの四角形たち</h2>
<p>教室のドアは<strong>長方形</strong>（角が90°）。将棋の駒は<strong>ひし形に近い形</strong>。チョコレートの板は<strong>長方形</strong>。凧（たこ）は2本の対角線が垂直に交わる四角形。<strong>四角形の性質を知ると、身の回りの形がなぜその形をしているか</strong>が見えてきます。ドアが平行四辺形（角が90°でない）だったら、まっすぐ閉まりませんよね。</p>

<div class="tip-box"><div class="tip-title">💡 「平行四辺形になる条件」は5つ</div>上の4つに加えて「<strong>1組の対辺が平行で等しい</strong>」も条件になります。証明問題では、この5つのうちどれを使うかの判断が最大のポイント。与えられた条件をよく見て、いちばん近いものを選びましょう。</div>

<h2>なぜ四角形の性質を学ぶのか</h2>
<p>建物の窓は長方形、タイルの模様には平行四辺形やひし形、道路標識には正方形。<strong>建築・デザイン・ものづくりの世界は四角形だらけ</strong>です。タイルが正確な平行四辺形でなければ隙間ができてしまう。四角形の性質を知ることは、身の回りの「なぜこの形なの？」を論理的に理解する力になります。</p>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
四角形の「家族関係」：平行四辺形 → 長方形（角が90°）またはひし形（辺が等しい）→ 正方形（両方）。<br>
平行四辺形の4つの性質を覚える。証明問題では「平行四辺形になる条件」から逆に使う。<br>
正方形は「最も多くの条件を満たす四角形」。
</div>

<div class="confirm-box"><div class="confirm-title">📋 平行四辺形から派生する四角形</div>
<table><tr><th>四角形</th><th>追加の条件</th><th>性質</th></tr>
<tr><td>平行四辺形</td><td>（基本）</td><td>対辺平行・対辺等しい・対角等しい・対角線は中点で交わる</td></tr>
<tr><td>長方形</td><td>角がすべて90°</td><td>平行四辺形の性質＋対角線が等しい</td></tr>
<tr><td>ひし形</td><td>辺がすべて等しい</td><td>平行四辺形の性質＋対角線が垂直</td></tr>
<tr><td>正方形</td><td>角が90°＋辺が等しい</td><td>長方形＋ひし形のすべての性質</td></tr>
</table></div>

<h2>「平行四辺形になる条件」を確認</h2>
<p>次のどれか1つが証明できれば「平行四辺形」と言える：<br>
① 2組の対辺がそれぞれ平行<br>
② 2組の対辺がそれぞれ等しい<br>
③ 2組の対角がそれぞれ等しい<br>
④ 対角線がそれぞれの中点で交わる<br>
⑤ 1組の対辺が平行で等しい<br>
<strong>証明問題では「どの条件を示せばいいか」を先に決めてから作業を始めよう</strong>。</p>
`},

{id:40,section:'ch4',title:'平行線・三角形と面積',desc:'等積変形の発想',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>面積が同じなのに形が違う三角形</h2>
<p>底辺が5cm、高さが3cmの三角形の面積は 5×3÷2 = 7.5cm²。ここで面白いことが起きます。底辺を固定して、<strong>頂点を底辺に平行な直線上のどこに動かしても</strong>、高さは変わらないので面積は同じまま。形はどんどん変わるのに、面積はずっと7.5cm²。これが<strong>等積変形</strong>の原理です。</p>
<p>農家が土地を分割するとき、この考え方が使われます。複雑な形の畑を、面積を変えずに測りやすい形に変える——数百年前から実用されてきた知恵です。</p>

<h2>面積比は「底辺の比」か「高さの比」</h2>
<p>高さが同じ2つの三角形があれば、面積比は底辺の比と同じ。底辺が同じなら、面積比は高さの比と同じ。<strong>面積比の問題は、必ず「共通の底辺」か「共通の高さ」を見つける</strong>ことから始まります。</p>
<p>たとえば、ピザを三角形に切り分けるとき、すべてのスライスの頂点は中心（同じ点）にあります。各スライスの面積の違いは、底辺（円周部分の長さ）の違いだけで決まるのです。</p>

<div class="callout"><div class="callout-title">📐 面積比の2大原則</div>① 高さが等しい三角形 → <strong>面積比 = 底辺の比</strong><br>② 底辺が等しい三角形 → <strong>面積比 = 高さの比</strong><br>この2つを使えば、複雑な図形の面積比もすべて求められます。</div>

<h2>等積変形は「視点を変える力」</h2>
<p>三角形ABCと三角形ABDが同じ底辺ABを共有していて、CとDが底辺に平行な直線上にあれば、面積は等しい。これを使うと「ここの面積 = あそこの面積」と言い換えて、問題を簡単にできることがあります。関数のグラフ上の三角形の面積を求めるときにも、この等積変形の発想が大きな武器になります。</p>

<div class="tip-box"><div class="tip-title">💡 面積の本質</div>面積を決めるのは「底辺 × 高さ」だけ。形がどんなに歪んでいても、この2つの数値が同じなら面積は同じ。シンプルだけど強力な原理です。</div>
<h2>「見方を変える」力を鍛える</h2>
<p>等積変形の本質は「形を変えても面積は同じ」。つまり<strong>見た目を変えても中身は同じ</strong>ということ。テストで難しそうな問題を見たとき「別の角度から見たら簡単かも？」と発想を変える。友達とケンカしたとき「相手の立場から見たらどうだろう？」と視点を変える。ゲームで行き詰まったとき「違うルートはないかな？」と攻め方を変える。<strong>「見方を変える」力は、数学でも日常でもめちゃくちゃ使えます</strong>。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
等積変形とは<strong>「形を変えても面積が同じ」</strong>という考え方。<br>
「底辺が同じ＋頂点が底辺に平行な直線上にある」→ 面積は等しい。<br>
「高さが同じ三角形の面積比 = 底辺の比」「底辺が同じなら面積比 = 高さの比」。
</div>

<div class="confirm-box"><div class="confirm-title">📋 面積比の2大原則</div>
<table><tr><th>条件</th><th>面積比</th><th>イメージ</th></tr>
<tr><td>高さが等しい2つの三角形</td><td>面積比 = 底辺の比</td><td>高さ固定、底辺が広いほど面積大</td></tr>
<tr><td>底辺が等しい2つの三角形</td><td>面積比 = 高さの比</td><td>底辺固定、高いほど面積大</td></tr>
<tr><td>底辺も高さも同じ</td><td>面積は等しい（等積変形）</td><td>形が違っても面積は同じ</td></tr>
</table></div>

<h2>等積変形の具体例</h2>
<p>三角形ABCと三角形ABDが底辺ABを共有し、CDがABに平行とする。<br>
どちらも底辺ABは同じ、高さも同じ（平行線の間の距離）。<br>
→ 面積も等しい！ △ABC = △ABD。<br>
<strong>「底辺共有＋頂点が平行な直線上」を見つけたら面積が等しい</strong>と判断できます。</p>
`},
{id:41,section:'ch4',title:'相似な図形の発見',desc:'同じ形で大きさが違う図形の秘密',tag:'history',tagLabel:'歴史',time:8,
content:`
<h2>ピラミッドの高さを影で測った男</h2>
<p>紀元前6世紀、ギリシャの哲学者<strong>タレス</strong>がエジプトを訪れたとき、巨大なピラミッドの高さを知りたくなりました。でも直接登って測ることはできません。そこでタレスは、自分の影の長さと自分の身長の比を使いました。「影が身長と同じ長さになる時刻に、ピラミッドの影の長さを測れば、それがピラミッドの高さだ」。これが<strong>相似</strong>の最初の実用例です。</p>

<h2>相似とは「拡大コピー」の関係</h2>
<p>コピー機で150%に拡大しても、写真の形は変わりません。角度はすべて同じまま、辺の長さだけが1.5倍になる。この「形が同じで大きさだけが違う」関係が<strong>相似</strong>です。スマホで写真をピンチアウト（2本指で拡大）するのも相似の操作です。</p>

<div class="callout"><div class="callout-title">📐 三角形の相似条件</div>①<strong>3組の辺の比</strong>がすべて等しい<br>②<strong>2組の辺の比</strong>が等しく、<strong>その間の角</strong>が等しい<br>③<strong>2組の角</strong>がそれぞれ等しい<br>合同条件と似ていますが、「等しい」が「比が等しい」に変わっている点に注目。③が最も使いやすく、2つの角さえ等しければ相似が証明できます。</div>

<h2>相似は世界の「スケール」をつなぐ</h2>
<p>地図は実際の地形の相似な図形（縮尺1:25000なら25000分の1）。建築模型は建物の相似な立体。プラモデルは実物の相似な模型。映画のミニチュアセットも相似。<strong>相似の考え方がなければ、「小さいもので大きいものを表す」ことができない</strong>のです。</p>
<p>さらに、フラクタル（自然界のギザギザした形）は「拡大しても同じ形が現れる」自己相似の性質を持っています。海岸線、雪の結晶、ブロッコリーの形——自然は相似で満ちています。</p>

<div class="tip-box"><div class="tip-title">💡 相似比の使い方</div>相似な2つの三角形の辺の比が 2:3 なら、片方の辺が6cmのとき、対応する辺は 6 × 3/2 = 9cm。相似比がわかれば、測れない辺の長さも計算で求められます。</div>
<h2>「スケールを超える」力</h2>
<p>模型を作れば実物を建てる前に問題点がわかる。地図があれば行ったことのない場所の様子がわかる。相似の考え方は<strong>「小さいもので大きいものを理解し、大きいもので小さいものを予測する」</strong>力。分子の構造を拡大モデルで学ぶのも、宇宙を縮小した天球儀で理解するのも相似の応用です。スケールの壁を超えて思考できる——これが相似の本当の価値です。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
相似とは<strong>「形が同じで大きさが違う」</strong>関係——コピー機の拡大・縮小。<br>
三角形の相似条件は3つ：辺辺辺（比）・辺角辺（比）・角角。<br>
地図・建築模型・縮尺——「小さいもので大きいものを表す」技術の基礎。
</div>

<div class="confirm-box"><div class="confirm-title">📋 三角形の相似条件3つ</div>
<table><tr><th>条件</th><th>内容</th><th>ポイント</th></tr>
<tr><td>3辺の比</td><td>3組の辺の比がすべて等しい</td><td>a:b:c = d:e:f</td></tr>
<tr><td>2辺の比と間の角</td><td>2組の辺の比が等しく、その間の角が等しい</td><td>合同の「辺角辺」の比版</td></tr>
<tr><td>2組の角（AA）</td><td>2組の角がそれぞれ等しい</td><td>最もよく使う！1組わかれば三角形の和から3組目も確定</td></tr>
</table></div>

<h2>「AA（2角）がわかれば相似」の理由</h2>
<p>三角形の内角の和は180°。<br>
2つの角が等しければ、残りの角も自動的に等しくなる（180°からの計算）。<br>
だから「2組の角が等しい → 3組の角がすべて等しい → 相似」。<br>
<strong>2角を示せば相似の証明が完了</strong>——これが最もよく使われる手法です。</p>
`},
{id:42,section:'ch4',title:'平行線と線分の比',desc:'平行線が作り出す比の法則',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>平行線は「比」を生み出す装置</h2>
<p>三角形の1辺に平行な直線を引くと、他の2辺を<strong>同じ比に分割</strong>します。たとえば三角形ABCで辺BCに平行な直線が辺ABをD、辺ACをEで交わると、AD:DB = AE:EC。</p>
<p>なぜこうなるか？ 平行線を引くことで小さな三角形ADEが生まれ、これは元の三角形ABCと<strong>相似</strong>。相似な図形の辺の比は等しいから、自動的に比が揃うのです。</p>

<h2>身近な例——はしごと影</h2>
<p>壁に立てかけたはしごに、地面と平行な棚板を渡す場面を想像してください。棚板の位置が壁の高さの真ん中なら、はしごの足元からの距離も真ん中になります。これが「平行線と線分の比」の原理。建築現場では、この性質を使って柱の間隔を均等に割り出します。</p>

<div class="callout"><div class="callout-title">📐 基本定理</div>△ABCで、辺BCに平行な直線が辺AB、辺ACをそれぞれD、Eで交わるとき：<br><strong>AD:DB = AE:EC</strong><br>さらに <strong>AD:AB = AE:AC = DE:BC</strong><br>小さい三角形と大きい三角形の対応する辺の比がすべて等しくなります。</div>

<h2>測量術としての歴史</h2>
<p>古代エジプトでナイル川が氾濫するたびに農地の境界線が消えてしまいました。それを測り直すために使われたのが、平行線と比の性質です。「測量（ジオメトリー）」は「ジオ（地球）+ メトリー（測る）」が語源。<strong>図形の学問は、もともと「土地を測る」実用技術から生まれた</strong>のです。</p>

<div class="tip-box"><div class="tip-title">💡 比の問題は「対応」が命</div>平行線と比の問題では、「どの辺とどの辺が対応しているか」を正確に把握することが最重要。図に平行の印（矢印）を書き込み、対応する辺に同じ色で印をつけましょう。</div>
<h2>なぜ平行線が「比」を生むのか</h2>
<p>平行線を引くと小さな三角形が現れ、それは元の三角形と<strong>相似</strong>。相似な図形の辺の比は等しいから、自動的に比が揃う——これが原理です。この仕組みがわかっていると、ただの暗記ではなく<strong>「なぜそうなるか」を理解した上で使える</strong>ようになります。</p>

<h2>影で高さがわかる！</h2>
<p>晴れた日に、自分の身長と影の長さを測る。同時に校舎の影の長さも測る。すると平行線と比の関係で<strong>校舎の高さが計算できてしまう</strong>のです。身長160cm、自分の影2m、校舎の影15m → 校舎の高さ = 160 × 15 ÷ 2 = 1200cm = 12m。こうやって、手の届かないものの大きさを「比」で求める——これが平行線と比の実力です。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
三角形の1辺に平行な線を引くと、他の2辺が<strong>同じ比に分割される</strong>（三角形と比の定理）。<br>
なぜ？ 平行線を引くと小さな相似三角形が生まれ、相似の辺の比が等しいから。<br>
「影で高さを測る」のに使える実用的な定理。
</div>

<div class="confirm-box"><div class="confirm-title">📋 三角形と比の定理まとめ</div>
<table><tr><th>定理</th><th>内容</th></tr>
<tr><td>三角形と比の定理</td><td>BC//DE なら AD:DB = AE:EC</td></tr>
<tr><td>逆の定理</td><td>AD:DB = AE:EC なら BC//DE（平行であることの証明に使える）</td></tr>
<tr><td>比の連続</td><td>AD:AB = AE:AC = DE:BC</td></tr>
</table></div>

<h2>「影で高さを測る」実践</h2>
<p>晴れた日に：自分の身長160cm、自分の影の長さ2m、校舎の影の長さ20m。<br>
自分：160cm ÷ 200cm = 0.8 （身長/影の比）<br>
この比は校舎も同じ（太陽の光が平行だから）：<br>
校舎の高さ = 0.8 × 2000cm = <strong>1600cm = 16m</strong><br>
<strong>平行線と比の性質を使えば、手の届かない高さも計算で求められます。</strong></p>
`},
{id:43,section:'ch4',title:'中点連結定理と相似の計量',desc:'中点を結ぶと何が起きる？',tag:'concept',tagLabel:'概念',time:7,
content:`

<h2>「中点」とはなにか——まず確認しよう</h2>
<p>線分ABの「中点」は、AとBのちょうど真ん中の点のこと。AとBを結ぶ線分を定規で測ったときに、その長さの半分のところにある点です。</p>
<p>たとえばAB=10cmなら、中点MはAから5cm、Bから5cmの位置にある。<strong>AM = MB = 5cm</strong>。これが「中点」の定義です。これを踏まえた上で「中点連結定理」を理解しましょう。</p>

<div class="confirm-box"><div class="confirm-title">📋 中点連結定理の確認</div>
<table><tr><th>条件</th><th>結果</th></tr>
<tr><td>MがABの中点、NがACの中点</td><td>MNはBCに平行</td></tr>
<tr><td>MNの長さ</td><td>BCの長さの半分（MN = BC/2）</td></tr>
<tr><td>逆：MNがBCに平行でMN=BC/2</td><td>MはABの中点、NはACの中点</td></tr>
</table></div>

<h2>中点連結定理を「数値で」確認しよう</h2>
<p>三角形ABCで BC=10cm とする。辺ABの中点M、辺ACの中点Nを取るとき：<br>
MNの長さは？ → BC/2 = 10/2 = <strong>5cm</strong>。<br>
MN と BC の関係は？ → <strong>平行</strong>（方向が同じ）。<br>
これを使うと、「BC の長さが分からなくても、MN が分かれば BC が求まる」という逆の使い方もできます。<strong>MN が分かったら BC = MN × 2</strong>。</p>

<h2>相似比・面積比・体積比を練習しよう</h2>
<p>相似比2:3の2つの三角形がある。<br>
面積比は？ → 2²:3² = <strong>4:9</strong>（面積は2乗）<br>
相似比1:3の2つの立体（球など）がある。<br>
体積比は？ → 1³:3³ = <strong>1:27</strong>（体積は3乗）<br>
「辺が3倍になると体積は27倍」——この爆発的な差が、巨大生物が存在できない理由です。</p>


<h2>中点連結定理——シンプルだけど強力</h2>
<p>三角形の2つの辺のちょうど真ん中の点（中点）を結ぶと、その線分は残りの辺に<strong>平行で、長さがちょうど半分</strong>になります。これが<strong>中点連結定理</strong>。</p>
<p>紙で試してみましょう。三角形を切り抜いて、2辺の中点に印をつけ、定規で結ぶ。もう1辺と平行になっていることが目で確認でき、長さを測ると半分になっているはずです。</p>

<h2>なぜ半分になるのか</h2>
<p>中点を通る線分で三角形を切ると、上の小さな三角形は元の三角形と<strong>相似比1:2の相似な三角形</strong>になります。相似比が1:2なら対応する辺は半分。だから中点を結んだ線分 = 底辺の半分。相似の性質から自然に導かれるのです。</p>

<div class="callout"><div class="callout-title">📐 相似比と面積比・体積比</div>相似比が m:n のとき：<br><strong>面積比 = m²:n²</strong>（2乗）<br><strong>体積比 = m³:n³</strong>（3乗）<br>例：相似比 2:3 → 面積比 4:9 → 体積比 8:27<br>写真を2倍に拡大すると面積は4倍。人形を2倍にすると体積（重さ）は8倍。<strong>次元が上がるほど差が爆発的に広がる</strong>のです。</div>

<h2>巨人は存在できない？</h2>
<p>もし身長が2倍の人がいたら、体積（体重）は2³=8倍。でも足の断面積は2²=4倍。体重は8倍なのに支える力は4倍——<strong>膝が持ちません</strong>。<strong>ゴジラや進撃の巨人が現実に存在できないのは、この「相似比と体積比」の関係</strong>が理由です。映画の巨大生物は数学的にはありえない——こんな雑学も、面積比・体積比を知っていればこそ楽しめます。</p>

<div class="tip-box"><div class="tip-title">💡 ピザのSとLはどちらがお得？</div>Sサイズ（直径20cm）400円とLサイズ（直径30cm）800円。大きさの比は2:3でも、面積比は4:9。<strong>Lの面積はSの2.25倍なのに値段は2倍</strong>。だからLのほうがお得。相似比と面積比を知っていると、こういう「本当のコスパ」が見えるようになります。</div>



<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
中点連結定理：三角形の2辺の中点を結ぶ線分は、残りの辺に<strong>平行で長さが半分</strong>になる。<br>
相似比m:nのとき、面積比はm²:n²（2乗）、体積比はm³:n³（3乗）。<br>
「巨大生物が現実にいない理由」を相似比と体積比で説明できる。
</div>

<div class="confirm-box"><div class="confirm-title">📋 相似比と面積比・体積比</div>
<table><tr><th>相似比</th><th>面積比</th><th>体積比</th></tr>
<tr><td>1:2</td><td>1:4</td><td>1:8</td></tr>
<tr><td>2:3</td><td>4:9</td><td>8:27</td></tr>
<tr><td>3:5</td><td>9:25</td><td>27:125</td></tr>
<tr><td>m:n</td><td>m²:n²</td><td>m³:n³</td></tr>
</table></div>

<h2>「ピザのSとL」問題をやってみよう</h2>
<p>Sサイズ：直径20cm・400円<br>
Lサイズ：直径30cm・600円<br>
大きさの比 = 20:30 = 2:3<br>
面積比 = 2²:3² = 4:9<br>
Lの面積はSの9/4 = <strong>2.25倍</strong>なのに、値段は600/400 = <strong>1.5倍</strong>。<br>
<strong>Lのほうが断然お得！</strong> 相似比と面積比を知っていると、こんな「本当のコスパ」が見抜けます。</p>
`},
{id:44,section:'ch4',title:'円周角の定理',desc:'円と角度の美しい関係',tag:'concept',tagLabel:'概念',time:8,
content:`
<h2>円の上からは「みんな同じ角度で見える」</h2>
<p>サッカーのゴール前を想像してください。ゴールの両端を結ぶ弧（円の一部）の上に立つと、<strong>どの位置からもゴールを同じ角度で見ることができます</strong>。近づいても離れても、弧の上にいる限り角度は変わらない。これが<strong>円周角の定理</strong>の直感的な意味です。</p>

<h2>円周角は中心角のちょうど半分</h2>
<p>円の中心から弧を見た角度を<strong>中心角</strong>、円周上の点から同じ弧を見た角度を<strong>円周角</strong>と呼びます。驚くべきことに、<strong>円周角は必ず中心角のちょうど半分</strong>になります。中心角が80°なら、どの円周角も40°。これは円の幾何学から厳密に証明できる定理です。</p>

<div class="callout"><div class="callout-title">📐 円周角の定理まとめ</div>① 同じ弧に対する円周角は<strong>すべて等しい</strong><br>② 円周角 = 中心角の<strong>半分</strong><br>③ 直径に対する円周角は<strong>必ず90°</strong>（半円の弧に対する角）<br>④ 円周角が等しい → 同じ弧に対する角である<br>③は特に重要。半円に内接する三角形は必ず直角三角形になるのです。</div>

<h2>なぜ直径に対する円周角が90°なのか</h2>
<p>直径は円全体の半分の弧に対応します。中心角は180°（半回転）。円周角はその半分で90°。だから<strong>直径を斜辺に持つ三角形は必ず直角三角形</strong>になります。古代ギリシャのタレスがこれを発見したとき、感激して神様に牛を捧げたという伝説があります。</p>

<h2>円に内接する四角形の秘密</h2>
<p>4つの頂点がすべて1つの円の上にある四角形を「円に内接する四角形」と言います。この四角形には驚きの性質があります——<strong>対角の和がぴったり180°</strong>。対角線が交わるこの美しい性質は、証明問題で強力な武器になります。</p>

<div class="tip-box"><div class="tip-title">💡 「同じ弧を見ている角」を探す</div>円周角の問題を解くコツは、「この角はどの弧を見ているか？」を考えること。図に弧を色分けして書き込むと、等しい角が見えてきます。</div>
<h2>「どこから見ても同じ」という驚き</h2>
<p>映画館で映画を見るとき、左端の席でも右端の席でも中央の席でも、スクリーンの「見え方」は違います。でも円の上では、どこから弧を見ても<strong>角度が同じ</strong>。これは直感に反する驚きの事実で、だからこそ「定理」として証明する価値があるのです。数学の面白さは、こうした「えっ、本当に？ でも証明できるから本当なんだ」という驚きの連続にあります。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
円周角の定理：<strong>同じ弧に対する円周角は等しい</strong>、円周角は中心角の半分。<br>
直径に対する円周角は必ず90°（半円に内接する三角形は直角三角形）。<br>
円に内接する四角形の対角の和は180°。
</div>

<div class="confirm-box"><div class="confirm-title">📋 円周角の定理まとめ</div>
<table><tr><th>定理</th><th>内容</th></tr>
<tr><td>円周角の定理</td><td>同じ弧に対する円周角はすべて等しい</td></tr>
<tr><td>円周角と中心角</td><td>円周角 = 中心角 × 1/2</td></tr>
<tr><td>直径の円周角</td><td>直径に対する円周角は常に90°</td></tr>
<tr><td>円に内接する四角形</td><td>対角の和 = 180°</td></tr>
</table></div>

<h2>「直径に対する円周角が90°」の理由</h2>
<p>直径ABを1本の弦として、円周上の点Cから見たときの角∠ACBを考える。<br>
直径が中心角180°（半回転）の弧を作る。<br>
円周角 = 中心角÷2 = 180°÷2 = <strong>90°</strong>。<br>
だから直径を斜辺とする三角形は必ず直角三角形になります。<br>
<strong>「直径と円周上の点で三角形を作ると必ず直角」——この性質は問題でよく使われます！</strong></p>
`},
{id:45,section:'ch4',title:'三平方の定理の偉大さ',desc:'ピタゴラスが発見した永遠の真理',tag:'history',tagLabel:'歴史',time:9,
content:`
<h2>a² + b² = c² ——数学で最も有名な式</h2>
<p>直角三角形の2つの短い辺をa、bとし、最も長い辺（斜辺）をcとすると、<strong>a² + b² = c²</strong> が必ず成り立ちます。これが<strong>三平方の定理（ピタゴラスの定理）</strong>。アインシュタインの E=mc² と並んで、人類史上最も有名な数式のひとつです。</p>
<p>この定理には<strong>400通り以上の証明方法</strong>が見つかっています。大統領になったジェームズ・ガーフィールドも、独自の証明を発表しました。それほど多くの人を魅了してきた定理なのです。</p>

<h2>4000年前から使われていた</h2>
<p>紀元前1800年のバビロニアの粘土板には、すでにピタゴラス数（3, 4, 5 や 5, 12, 13 など）が記録されていました。古代エジプト人は「3:4:5のロープ」で直角を作り、ピラミッドの基礎を正確に設計しました。ピタゴラスが偉大なのは「使っていた」のではなく<strong>「なぜ成り立つか」を証明した</strong>ことです。</p>

<h2>なぜ「距離を計算する基本ツール」なのか</h2>
<p>あなたの家から学校まで、東に300m、北に400m歩くとします。直線距離は？ 300² + 400² = 90000 + 160000 = 250000 → √250000 = <strong>500m</strong>。三平方の定理は「<strong>2点間の距離を計算する万能ツール</strong>」なのです。GPSがあなたの位置を計算するときも、カーナビがルートを測るときも、スマホの地図アプリが「あと500m」と表示するときも、裏側では三平方の定理が動いています。</p>

<div class="callout"><div class="callout-title">📐 暗記必須の三平方の数</div><strong>3:4:5</strong>（最も基本）／ <strong>5:12:13</strong>（よく出る）<br><strong>1:1:√2</strong>（直角二等辺三角形、45°-45°-90°）<br><strong>1:2:√3</strong>（30°-60°-90°の三角形）<br>この4つを覚えておくだけで、計算スピードが劇的に上がります。</div>

<h2>三平方の定理がない世界</h2>
<p>もしこの定理がなかったら、建物の対角線の長さがわからず耐震設計ができません。飛行機の航路計算ができず目的地に着けません。ゲームの画面上でキャラクター同士の距離を測れません。<strong>三平方の定理は、現代社会のインフラを支える「目に見えない柱」</strong>なのです。</p>

<div class="tip-box"><div class="tip-title">💡 「直角三角形を探す」のが第一歩</div>三平方の定理は直角三角形にしか使えません。図の中に直角三角形が見えないときは、「補助線を引いて直角三角形を作る」のが基本戦略です。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
三平方の定理：直角三角形で<strong>a² + b² = c²</strong>（c は斜辺）が成り立つ。<br>
4000年前から使われていた——古代エジプトでも古代バビロニアでも。<br>
GPSの位置計算、カーナビの距離測定——現代のあらゆる「距離計算」の基礎。
</div>

<div class="confirm-box"><div class="confirm-title">📋 よく使うピタゴラス数と直角三角形</div>
<table><tr><th>辺の比</th><th>例（整数）</th><th>特徴</th></tr>
<tr><td>3:4:5</td><td>3, 4, 5</td><td>最も基本的なピタゴラス数</td></tr>
<tr><td>5:12:13</td><td>5, 12, 13</td><td>テストでよく出る</td></tr>
<tr><td>1:1:√2</td><td>1, 1, √2</td><td>直角二等辺三角形（45°-45°-90°）</td></tr>
<tr><td>1:√3:2</td><td>1, √3, 2</td><td>30°-60°-90°の三角形</td></tr>
</table></div>

<h2>三平方の定理を「検算」してみよう</h2>
<p>3² + 4² = 9 + 16 = 25 = 5²　✓<br>
5² + 12² = 25 + 144 = 169 = 13²　✓<br>
1² + 1² = 2 = (√2)²　✓<br>
この「整数の組（ピタゴラス数）」を覚えておくと、計算が一気に速くなります。<br>
<strong>「この直角三角形、もしかしてピタゴラス数かも？」と最初に疑うクセをつけましょう</strong>。</p>
`},
{id:46,section:'ch4',title:'三平方の定理と平面図形',desc:'三平方で解ける平面図形の問題',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>座標平面上の「距離」</h2>
<p>点(1, 2)と点(4, 6)の距離はいくつ？ 横の差は4−1=3、縦の差は6−2=4。この2つで直角三角形を作ると、斜辺 = √(3²+4²) = √25 = <strong>5</strong>。これは三平方の定理そのもの。<strong>座標がわかれば、どんな2点間の距離も一発で計算できる</strong>のです。</p>
<p>一般的に書くと、2点(x₁, y₁)と(x₂, y₂)の距離 = √{(x₂−x₁)²+(y₂−y₁)²}。スマホの地図アプリが「現在地から目的地まで○km」と表示するのも、本質的にはこの公式を使っています。</p>

<h2>正三角形の高さと面積</h2>
<p>一辺6cmの正三角形の高さは？ 頂点から底辺に垂線を下ろすと、底辺が3cmずつに二等分されます。できた直角三角形で三平方の定理：高さ² + 3² = 6² → 高さ² = 27 → 高さ = 3√3cm。面積 = 6×3√3÷2 = <strong>9√3 cm²</strong>。</p>
<p>一般に、一辺aの正三角形の高さ = a√3/2、面積 = a²√3/4。この公式は一度導き方を理解しておけば、いつでも自分で作れます。</p>

<div class="callout"><div class="callout-title">📐 三平方の定理が活躍する平面図形の場面</div>① 座標平面上の<strong>2点間の距離</strong><br>② 正三角形の<strong>高さと面積</strong><br>③ 円の<strong>弦の長さ</strong>（中心から弦に垂線を下ろして直角三角形を作る）<br>④ 長方形やひし形の<strong>対角線の長さ</strong></div>

<h2>円と三平方の定理</h2>
<p>半径5cmの円で、中心から3cm離れた弦の長さは？ 中心から弦に垂線を下ろすと弦を二等分。直角三角形で半弦² + 3² = 5² → 半弦 = 4cm → 弦 = <strong>8cm</strong>。円の中に直角三角形を見つけるこのパターンは非常に重要です。</p>

<div class="tip-box"><div class="tip-title">💡 「直角三角形はどこだ？」ゲーム</div>問題を見たら、まず「直角三角形はどこに隠れているか？」を探しましょう。見つからなければ補助線（垂線を下ろす、対角線を引く）で作る。三平方の定理を使うための第一歩はいつも「直角三角形を見つける（作る）」ことです。</div>
<h2>「距離を測る」は生活の基本スキル</h2>
<p>「家から駅までどのくらいの距離？」をスマホの地図アプリが瞬時に計算してくれるのは、裏側で三平方の定理が動いているから。画面上の2点間の距離をピクセル単位で計算するのも、ゲームで敵キャラとの距離を計算するのも、すべてこの公式。<strong>三平方の定理は「距離を計算するすべての技術」の根っこ</strong>にあるのです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
三平方の定理は平面図形でも大活躍：<strong>2点間の距離・正三角形の高さ・弦の長さ</strong>など。<br>
「直角三角形を見つける（または作る）」ことが、すべての出発点。<br>
座標上の2点の距離 = √{(x₂−x₁)²+(y₂−y₁)²}。
</div>

<div class="confirm-box"><div class="confirm-title">📋 三平方の定理が使われる平面図形の場面</div>
<table><tr><th>場面</th><th>直角三角形の作り方</th></tr>
<tr><td>2点間の距離</td><td>2点の差でx方向・y方向の辺を作る</td></tr>
<tr><td>正三角形の高さ</td><td>頂点から底辺に垂線を下ろす（底辺を二等分）</td></tr>
<tr><td>弦の長さ</td><td>中心から弦に垂線を下ろす（弦を二等分）</td></tr>
<tr><td>長方形の対角線</td><td>対角線が2辺と直角三角形を作る</td></tr>
</table></div>

<h2>「2点間の距離」を練習しよう</h2>
<p>点A(1,1)と点B(4,5)の距離は？<br>
横の差：4−1 = 3<br>
縦の差：5−1 = 4<br>
距離 = √(3²+4²) = √(9+16) = √25 = <strong>5</strong><br>
あ、これは3:4:5のピタゴラス数！<br>
<strong>「ピタゴラス数に気づく」だけで√の計算が省けてスピードアップできます</strong>。</p>
`},
{id:47,section:'ch4',title:'三平方の定理と空間図形',desc:'立体の中の距離を求める',tag:'concept',tagLabel:'概念',time:8,
content:`
<h2>空間でも三平方は最強の武器</h2>
<p>直方体の部屋（たて3m、よこ4m、高さ5m）の対角線——部屋の隅から対角の隅までの距離は？ まず底面の対角線：√(3²+4²) = 5m。次にその対角線と高さで三平方の定理をもう1回：√(5²+5²) = √50 = 5√2m ≒ <strong>7.07m</strong>。<strong>三平方の定理を「2回使う」</strong>のが空間図形の基本パターンです。</p>
<p>一般に、たてa、よこb、高さcの直方体の対角線 = √(a²+b²+c²)。これは3次元に拡張された距離の公式で、3Dゲームのプログラミングでキャラクター間の距離を計算するときにまさに使われています。</p>

<h2>円錐の高さと母線</h2>
<p>円錐では、母線（側面のナナメの線）、底面の半径、高さの3つが直角三角形を作ります。アイスクリームのコーンの高さを知りたいとき、母線の長さと底面の半径がわかれば三平方の定理で計算できます。母線² = 半径² + 高さ² です。</p>

<h2>「断面を切る」テクニック</h2>
<p>空間図形の問題で「距離を求めよ」と言われたとき、最も強力な戦略は<strong>「うまく断面を切って、平面の問題にする」</strong>ことです。立体をナイフで切ったとき現れる断面に、直角三角形が見えれば三平方の定理が使えます。</p>
<p>お豆腐を斜めに切ったとき、断面に三角形が見えますよね。それと同じ発想で、立体の中に隠れた平面を見つけ出すのです。</p>

<div class="callout"><div class="callout-title">📐 空間での三平方の使いどころ</div>① 直方体の<strong>対角線</strong> = √(a²+b²+c²)<br>② 円錐：<strong>母線²</strong> = 半径² + 高さ²<br>③ 正四面体の<strong>高さ</strong>：底面の重心から頂点までの距離<br>④ 角錐の<strong>高さ</strong>：頂点から底面に垂線を下ろして求める</div>

<div class="tip-box"><div class="tip-title">💡 空間図形が苦手な人へ</div>空間図形の問題は「立体のまま考えない」のがコツ。必要な部分だけを取り出して平面図（断面図）を描き、平面の問題として解く。<strong>空間の問題の9割は、うまく断面を取れば平面の問題に化ける</strong>のです。</div>
<h2>空間図形を「平面に落とす」という知恵</h2>
<p>3次元の問題を3次元のまま考えるのは大変。でも<strong>うまく断面を切れば、見慣れた平面の問題に変わります</strong>。お豆腐を斜めに切ったとき断面に三角形が見えるように、立体の中にも直角三角形が隠れている。「難しい問題を、自分が解ける問題に変換する」——この戦略は、数学に限らずあらゆる難題に立ち向かうときの最強の武器です。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
空間図形でも三平方の定理が使える——<strong>「断面を切って平面の問題に変換する」</strong>のが基本戦略。<br>
直方体の対角線 = √(a²+b²+c²)（三平方の定理を2回使う）。<br>
立体の問題も、うまく切れば平面の問題に化ける。
</div>

<div class="confirm-box"><div class="confirm-title">📋 空間図形での三平方の定理の使いどころ</div>
<table><tr><th>場面</th><th>手順</th></tr>
<tr><td>直方体の対角線</td><td>①底面の対角線を求める →②その対角線と高さで再び三平方</td></tr>
<tr><td>円錐の高さ</td><td>母線²=半径²+高さ² から高さを求める</td></tr>
<tr><td>角錐の高さ</td><td>頂点から底面に垂線を下ろし、直角三角形を作る</td></tr>
</table></div>

<h2>直方体の対角線を練習しよう</h2>
<p>たて3、よこ4、高さ5の直方体の対角線は？<br>
①底面の対角線 = √(3²+4²) = √(9+16) = √25 = <strong>5</strong>（3:4:5！）<br>
②対角線と高さで三平方：√(5²+5²) = √(25+25) = √50 = 5√2 ≈ <strong>7.07</strong><br>
「三平方を2回使う」のが空間図形の基本パターンです。最初の一回で使った辺を「次の直角三角形の一辺」として使います。</p>
`},

{id:48,section:'ch5',title:'データの分析とは',desc:'数字の山から「意味」を掘り出す',tag:'realworld',tagLabel:'実用',time:7,
content:`
<h2>データは「加工」しないとただの数字</h2>
<p>あなたのクラス40人のテストの点数がズラッと並んでいます。「72, 85, 43, 91, 67, 58…」。この数字の羅列を見て、クラスの成績の傾向がわかりますか？ たぶん無理ですよね。データは<strong>分析して初めて意味を持つ</strong>のです。料理の材料が冷蔵庫にあるだけでは夕食にならないのと同じです。</p>

<h2>代表値の「三兄弟」</h2>
<p><strong>平均値</strong>：全部足して個数で割る。最もポピュラーだけど弱点がある。年収の平均が「600万円」でも、一部のお金持ちが平均を引き上げているかもしれません。</p>
<p><strong>中央値（メジアン）</strong>：データを小さい順に並べたとき、ちょうど真ん中に来る値。年収の「中央値」は約440万円。平均値より現実的な「普通の人」の感覚に近い数字です。外れ値（極端な値）に<strong>振り回されにくい</strong>のが強み。</p>
<p><strong>最頻値（モード）</strong>：最も多く出現する値。靴屋さんが仕入れる靴のサイズを決めるときは、最頻値が最も役立ちます。「最も売れるサイズは何か」を知りたいわけですから。</p>

<div class="callout"><div class="callout-title">📐 代表値の使い分け</div><strong>平均値</strong>：データがバランスよく散らばっているとき有効。外れ値に弱い。<br><strong>中央値</strong>：外れ値がありそうなとき。年収や住宅価格でよく使われる。<br><strong>最頻値</strong>：「最も典型的」を知りたいとき。服のサイズ、人気商品の分析に。<br>3つの代表値を比べることで、データの「偏り方」も見えてきます。</div>

<h2>散らばりを見る——「範囲」</h2>
<p>平均点70点のクラスが2つ。でもAクラスは「60〜80点に集中」、Bクラスは「30〜100点にバラバラ」。同じ平均でもまったく違う状況です。<strong>最大値−最小値＝範囲</strong>で、データの広がり具合がわかります。散らばりの情報がなければ、平均だけでは本当の姿は見えません。</p>

<div class="tip-box"><div class="tip-title">💡 ヒストグラムは「データの顔写真」</div>度数分布表を棒グラフにしたヒストグラムは、データの全体像を一目で見せてくれます。「山がどこにあるか」「左右対称か」「裾が長いか」——グラフの形だけで多くのことがわかります。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
データを分析するには<strong>「代表値（平均・中央値・最頻値）」と「散らばり（範囲）」</strong>の両方を見る。<br>
平均値は外れ値に弱い。中央値は外れ値に強い。最頻値は「一番よくある値」。<br>
データは加工して初めて意味を持つ——数字の羅列を「見える化」するのが統計の力。
</div>

<div class="confirm-box"><div class="confirm-title">📋 代表値の使い分け</div>
<table><tr><th>代表値</th><th>求め方</th><th>向いている場面</th><th>弱点</th></tr>
<tr><td>平均値</td><td>全部足して個数で割る</td><td>データがバランスよく分布</td><td>極端な値に影響される</td></tr>
<tr><td>中央値</td><td>並び替えて真ん中の値</td><td>年収など外れ値が多い場面</td><td>極端な値は無視される</td></tr>
<tr><td>最頻値</td><td>最も多く出現する値</td><td>靴のサイズ、人気商品</td><td>最も多い1つの値だけ</td></tr>
</table></div>

<h2>「平均」だけ見ると間違えることがある</h2>
<p>あるクラス5人のテスト（30, 40, 50, 60, 120点）<br>
平均：300÷5 = <strong>60点</strong><br>
中央値：並び替えると 30, 40, <strong>50</strong>, 60, 120 → 真ん中は50点<br>
120点という「飛び抜けた値」が平均を10点引き上げている。<strong>「平均60点だから普通」ではなく、中央値50点のほうが実態に近い</strong>。これが「代表値の使い分け」が大事な理由です。</p>
`},
{id:49,section:'ch5',title:'四分位数と箱ひげ図',desc:'データの「広がり方」を見える化する',tag:'realworld',tagLabel:'実用',time:7,
content:`
<h2>データを4等分する「四分位数」</h2>
<p>テストの点数を低い順に並べて、4等分する境界を<strong>四分位数</strong>と呼びます。下位25%の境界が<strong>第1四分位数（Q1）</strong>、ちょうど真ん中が<strong>第2四分位数（Q2）= 中央値</strong>、上位25%の境界が<strong>第3四分位数（Q3）</strong>。</p>
<p>身近な例でいうと、マラソン大会で「上位25%に入れたら表彰」と言われたとき、あなたのタイムがQ3より速ければ表彰対象です。Q1より遅ければ下位25%。四分位数は「自分がデータの中でどのあたりにいるか」を教えてくれるのです。</p>

<h2>箱ひげ図——5つの数字で全体像を描く</h2>
<p><strong>最小値、Q1、中央値、Q3、最大値</strong>——たった5つの数字で、データの分布を1本の図に表したのが<strong>箱ひげ図</strong>です。箱（Q1〜Q3）の中に全体の50%のデータが入っていて、ひげ（箱の外側の線）が残りの範囲を示します。</p>

<div class="callout"><div class="callout-title">📐 箱ひげ図の読み方</div>最小値 ──[Q1 ─── 中央値 ─── Q3]── 最大値<br><strong>箱が狭い</strong> → データが集中している（バラつきが小さい）<br><strong>箱が広い</strong> → データが散らばっている（バラつきが大きい）<br><strong>四分位範囲（Q3−Q1）</strong>がデータの散らばりの指標になります。</div>

<h2>箱ひげ図の真価は「比較」にある</h2>
<p>1組と2組のテスト結果を比べたいとき、箱ひげ図を並べると一目瞭然。「2組のほうが中央値は高いけど、1組のほうがバラつきが小さい（箱が狭い）」——このような<strong>複数のデータの比較が、箱ひげ図の最大の武器</strong>です。</p>
<p>スポーツの世界でも使われています。チームAとチームBの選手の身長分布を箱ひげ図で比較すれば、平均だけではわからない「チームの体格のバラつき」が見えてきます。医療の世界では、薬Aと薬Bの治療効果を箱ひげ図で比較して、どちらがより安定した効果を持つかを判断します。</p>

<div class="tip-box"><div class="tip-title">💡 四分位範囲と範囲の違い</div><strong>範囲</strong>（最大−最小）は極端な値（外れ値）に影響される。<strong>四分位範囲</strong>（Q3−Q1）は真ん中50%のデータだけを見るので、外れ値の影響を受けにくい。だから統計では四分位範囲のほうが「信頼できる散らばりの指標」としてよく使われます。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
四分位数とは<strong>データを4等分する境界値</strong>（Q1, Q2, Q3）。<br>
箱ひげ図とは<strong>5つの数字（最小値・Q1・中央値・Q3・最大値）でデータを1本の図に表したもの</strong>。<br>
箱ひげ図の最大の力は「複数のデータを並べて比較すること」にある。
</div>

<div class="confirm-box"><div class="confirm-title">📋 四分位数の求め方（例：データが9個）</div>
<table><tr><th>ステップ</th><th>操作</th></tr>
<tr><td>①</td><td>データを小さい順に並べる</td></tr>
<tr><td>②</td><td>真ん中（5番目）がQ2（中央値）</td></tr>
<tr><td>③</td><td>下半分（1〜4番目）の真ん中がQ1</td></tr>
<tr><td>④</td><td>上半分（6〜9番目）の真ん中がQ3</td></tr>
</table></div>

<h2>箱ひげ図を読んでみよう</h2>
<p>最小値15、Q1=30、中央値=50、Q3=70、最大値=90 の箱ひげ図：<br>
• 箱の幅（Q3−Q1）= 70−30 = 40 → データの中央50%の範囲<br>
• 箱が広い → データがバラバラ（バラつきが大きい）<br>
• 箱が狭い → データが集中（バラつきが小さい）<br>
<strong>「箱の広さ」を比べると、2つのクラスの「成績のバラつき方」の違いが一目でわかります。</strong></p>
`},
{id:50,section:'ch5',title:'確率の考え方',desc:'「偶然」を数で支配する方法',tag:'history',tagLabel:'歴史',time:8,
content:`
<h2>確率はギャンブルから生まれた</h2>
<p>17世紀フランス。ギャンブル好きの貴族<strong>シュヴァリエ・ド・メレ</strong>が、天才数学者<strong>パスカル</strong>にこんな相談をしました。「賭けの途中で中断したら、賞金はどう分けるのが公平？」。パスカルはもう一人の天才<strong>フェルマー</strong>と手紙をやり取りしてこの問題を解決。これが<strong>確率論の誕生</strong>です。「偶然を数学で扱える」という革命的な発見でした。</p>

<h2>確率の基本——場合の数を数える</h2>
<p>確率 = （その事象が起きる場合の数）÷（すべての場合の数）。サイコロで1が出る確率 = 1/6。コインで表が出る確率 = 1/2。<strong>大切なのは「すべての場合を漏れなくダブりなく数える」</strong>こと。これが確率計算の土台です。</p>
<p>「漏れなくダブりなく」は意外と難しい。たとえばコイン2枚を投げたとき、「2枚とも表」「1枚が表」「2枚とも裏」の3通り？ いいえ、「1枚が表」は「1枚目が表で2枚目が裏」と「1枚目が裏で2枚目が表」の2通りあるので、全部で4通り。「2枚とも表」の確率は1/4です。</p>

<div class="callout"><div class="callout-title">📐 確率の基本ルール</div>① 確率は<strong>0以上1以下</strong>（0% ≤ 確率 ≤ 100%）<br>② 「必ず起きる」事象の確率 = <strong>1</strong><br>③ 「絶対起きない」事象の確率 = <strong>0</strong><br>④ ある事象が「起きない」確率 = <strong>1 − 起きる確率</strong></div>

<h2>確率がなかったら現代社会は動かない</h2>
<p>天気予報の「降水確率40%」は「同じ条件の日が10回あれば4回雨が降る」という意味。保険会社は事故の確率から保険料を計算。医者はがん検診の「偽陽性の確率」を考慮して診断。AIの音声認識は「この音が"こんにちは"である確率は93%」と判断。<strong>確率は現代社会のあらゆる判断の基盤</strong>です。</p>
<p>確率を理解できると、ニュースの「○○のリスクが2倍」が冷静に判断でき、ギャンブルの広告に騙されにくくなり、データに基づいた賢い判断ができるようになります。</p>

<div class="tip-box"><div class="tip-title">💡 「直感」と確率のズレ</div>宝くじの1等が当たる確率は約1000万分の1。でも「誰かは当たる」から買いたくなる。一方、飛行機事故に遭う確率は数百万分の1なのに怖がる。人間の直感は確率を正しく感じ取れないことが多い。だからこそ、確率を「計算で理解する力」が大切なのです。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
確率とは<strong>「偶然を数で表す方法」</strong>。0（絶対起きない）〜1（必ず起きる）の数で表す。<br>
確率 = （その事象の場合の数）÷（すべての場合の数）。<br>
確率を正しく理解すると、ニュースやデータに騙されにくくなる。
</div>

<div class="confirm-box"><div class="confirm-title">📋 確率のルールまとめ</div>
<table><tr><th>ルール</th><th>内容</th><th>例</th></tr>
<tr><td>範囲</td><td>0 ≤ 確率 ≤ 1</td><td>−0.2や1.5は確率ではない</td></tr>
<tr><td>必ず起きる</td><td>確率 = 1</td><td>サイコロで1〜6のどれかが出る</td></tr>
<tr><td>絶対起きない</td><td>確率 = 0</td><td>サイコロで7が出る</td></tr>
<tr><td>余事象</td><td>1−（起きる確率）</td><td>「表が出ない確率」=1−1/2=1/2</td></tr>
</table></div>

<h2>「確率がわかると騙されない」例</h2>
<p>「この宝くじ、当選者が100人出た！」というCMを見たとします。<br>
でも総発行枚数が100万枚なら、当選確率は100/1000000 = <strong>0.01%（1万分の1）</strong>。<br>
「当選者100人」という数字だけを見ると多く感じるが、確率で見ると非常に低い。<br>
<strong>確率を知ると「数字の見え方」がガラッと変わります。</strong></p>
`},
{id:51,section:'ch5',title:'いろいろな確率の求め方',desc:'樹形図・表・計算で確率マスター',tag:'realworld',tagLabel:'実用',time:7,
content:`
<h2>「漏れなくダブりなく」を実現する3つの道具</h2>
<p>確率の計算で最も大切なのは、すべての場合を正確に数えること。そのための道具が<strong>樹形図</strong>と<strong>表</strong>、そして<strong>余事象</strong>です。</p>

<h2>樹形図——枝分かれで全パターンを見る</h2>
<p>コインを3回投げるとき、何通りの結果がある？ 1回目は「表 or 裏」の2通り。2回目もそれぞれ2通り。3回目もそれぞれ2通り。木の枝のように分岐させていくと、全部で 2×2×2 = <strong>8通り</strong>が一目でわかります。</p>
<p>樹形図のいいところは「見落としが起きにくい」こと。頭の中で数えるとミスしやすいですが、<strong>書き出せば確実</strong>。急がば回れで、樹形図を描く時間は惜しまないほうが結果的に速く正確に解けます。</p>

<h2>表——2つの組み合わせを一覧する</h2>
<p>サイコロ2個の問題は、6×6の表を描くのが最強。横軸に1個目の目、縦軸に2個目の目を書いて、<strong>36マスの表</strong>を作ります。「和が7になる」組み合わせは？ 表を見れば(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)の6通り。確率は6/36 = 1/6。表を作れば、数え間違いの心配がなくなります。</p>

<div class="callout"><div class="callout-title">📐 道具の使い分け</div><strong>樹形図</strong>：順番がある問題（コイン、カードを引く順番）<br><strong>表</strong>：2つのものの組み合わせ（サイコロ2個、2人の出す手）<br><strong>余事象</strong>：「少なくとも〜」の問題</div>

<h2>余事象——「逆から攻める」知恵</h2>
<p>「サイコロを3回投げて、少なくとも1回は6が出る確率」を直接求めるのは大変（6が1回、2回、3回の場合を全部足す）。でも<strong>「1回も6が出ない確率」を求めて1から引く</strong>ほうがずっと簡単。1回も6が出ない確率 = (5/6)³ = 125/216。少なくとも1回出る確率 = 1 − 125/216 = <strong>91/216</strong>。</p>

<h2>全数調査 vs 標本調査</h2>
<p><strong>全数調査</strong>は全部調べること。日本では5年に1度の国勢調査がその例。正確だけど、莫大な時間とお金がかかります。工場の品質検査で「全部のお菓子を食べて確認」したら売るものがなくなりますよね。</p>

<h2>偏りのない選び方が命</h2>

<script>
const sections={ch1:'ch1Chapters',ch2:'ch2Chapters',ch3:'ch3Chapters',ch4:'ch4Chapters',ch5:'ch5Chapters'};
function renderChapterList(){
  Object.values(sections).forEach(id=>document.getElementById(id).innerHTML='');
  let delay=0;
  chapters.forEach(ch=>{
    const c=document.getElementById(sections[ch.section]);if(!c)return;
    const d=document.createElement('div');d.className='chapter-card';d.dataset.id=ch.id;
    d.style.animationDelay=delay*0.05+'s';delay++;
    d.onclick=()=>openChapter(ch.id);
    d.innerHTML='<div class="chapter-num">'+ch.id+'</div><div class="chapter-info"><div class="chapter-title">'+ch.title+'</div><div class="chapter-desc">'+ch.desc+'</div></div><span class="chapter-tag tag-'+ch.tag+'">'+ch.tagLabel+'</span>';
    c.appendChild(d);
  });
  document.getElementById('totalCount').textContent=chapters.length;
}
function filterChapters(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.chapter-card').forEach(c=>{
    const ch=chapters.find(x=>x.id==c.dataset.id);if(!ch)return;
    const m=!q||ch.title.toLowerCase().includes(q)||ch.desc.toLowerCase().includes(q)||ch.tagLabel.includes(q);
    c.style.display=m?'flex':'none';
  });
  Object.keys(sections).forEach(s=>{
    const list=document.getElementById(sections[s]),label=document.getElementById('label-'+s);
    label.style.display=[...list.children].some(c=>c.style.display!=='none')?'block':'none';
  });
}
function openChapter(id){
  const ch=chapters.find(c=>c.id===id);if(!ch)return;
  document.getElementById('topPage').style.display='none';
  document.getElementById('readingPage').style.display='block';
  document.getElementById('readingTitle').textContent=ch.title;
  document.getElementById('readingMeta').textContent=ch.tagLabel+' ・ 約'+ch.time+'分 ・ '+ch.id+' / '+chapters.length;
  document.getElementById('readingBody').innerHTML=ch.content+renderNav(ch.id);
  document.getElementById('progressFill').style.width=(ch.id/chapters.length*100)+'%';
  window.scrollTo(0,0);
}
function renderNav(id){
  const p=chapters.find(c=>c.id===id-1),n=chapters.find(c=>c.id===id+1);
  let h='<div class="chapter-nav">';
  h+=p?'<button class="nav-btn" onclick="openChapter('+p.id+')">← '+p.title+'</button>':'<button class="nav-btn" disabled>最初の章</button>';
  h+=n?'<button class="nav-btn" onclick="openChapter('+n.id+')">'+n.title+' →</button>':'<button class="nav-btn" disabled>最後の章</button>';
  return h+'</div>';
}
function goBack(){document.getElementById('readingPage').style.display='none';document.getElementById('topPage').style.display='block';window.scrollTo(0,0);}
window.addEventListener('scroll',()=>{document.getElementById('scrollTopBtn').style.display=window.scrollY>400?'flex':'none'});
renderChapterList();
renderTagFilters();

function renderTagFilters(){
  const tags=[
    {key:'all',label:'すべて'},
    {key:'history',label:'🌍 歴史'},
    {key:'concept',label:'💡 概念'},
    {key:'realworld',label:'🔧 実用'}
  ];
  const c=document.getElementById('tagFilters');
  tags.forEach(t=>{
    const b=document.createElement('button');
    b.className='tag-filter'+(t.key==='all'?' active':'');
    b.textContent=t.label;
    b.dataset.tag=t.key;
    b.onclick=()=>filterByTag(t.key);
    c.appendChild(b);
  });
}
function filterByTag(tag){
  document.querySelectorAll('.tag-filter').forEach(b=>b.classList.toggle('active',b.dataset.tag===tag));
  document.querySelectorAll('.chapter-card').forEach(c=>{
    const ch=chapters.find(x=>x.id==c.dataset.id);
    if(!ch)return;
    c.style.display=(tag==='all'||ch.tag===tag)?'flex':'none';
  });
  Object.keys(sections).forEach(s=>{
    const list=document.getElementById(sections[s]),label=document.getElementById('label-'+s);
    const vis=[...list.children].some(c=>c.style.display!=='none');
    label.style.display=vis?'block':'none';
  });
  document.getElementById('searchInput').value='';
}
</script>
