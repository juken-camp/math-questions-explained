{id:1,section:'ch1',title:'正負の数はなぜ必要？',desc:'マイナスがないと世界が止まる',tag:'realworld',tagLabel:'実用',time:8,
content:`
<h2>もしマイナスがなかったら？</h2>
<p>ゲームでHPが0以下になったらゲームオーバー。エレベーターの「B1」は地下1階。銀行口座の残高がマイナスになったら引き落としが止まる。天気予報で「マイナス5度」。サッカーの得失点差が「−3」。——これ、全部<strong>マイナスの数</strong>がなかったら表現できません。</p>
<p>「3個のりんごから5個食べるなんて無理じゃん」。そう思うのは当然です。実際、古代ギリシャの天才たちも「マイナスの数なんてありえない」と拒否していました。ところが、中国では紀元前2世紀にはすでにマイナスの数が使われていたのです。理由はシンプル——<strong>「借金」を計算するため</strong>。100万円持っていて200万円使ったら？ 残りは−100万円。「ない状態をさらに超えた量」を表す必要があったのです。</p>

<h2>温度で考えると一瞬でわかる</h2>
<p>あなたも実はマイナスの数を毎日使っています。「明日の札幌はマイナス5度」と聞いて、誰も「マイナスって何？」とは思わない。0度を基準にして、そこより寒いか暖かいかを表しているだけ。正負の数の正体は<strong>「基準を決めて、そこからどっち方向にどれだけ離れているか」</strong>を表す道具なのです。</p>

<div class="callout"><div class="callout-title">📐 なぜ「マイナス×マイナス＝プラス」？</div>3万円の借金（−3万円）が2回なくなった（×(−2)）とします。借金が消えるということは、お金が戻ってくるということ。(−3)×(−2)＝+6。つまり<strong>「反対の反対は元通り」</strong>。後ろ向きに歩いている人がUターンしたら、前に進んでるのと同じです。</div>

<h2>ヨーロッパの天才もつまずいた</h2>
<p>ヨーロッパでマイナスの数が受け入れられたのは、なんと17世紀。ほんの400年前まで「−3って何？意味不明」と天才数学者ですら言っていたのです。あなたが違和感を感じるのは<strong>超自然</strong>なこと。でもその壁を超えたら、人類が何千年もかけて磨いてきた「現実を正確に表す道具」が手に入ります。ATMもゲームもエレベーターも動くようになる。それくらい大切な発明なのです。</p>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
「正の数」は0より大きい数。「負の数」は0より小さい数。<br>
マイナスがあるから「借金」「地下」「零下の気温」が表現できる。<br>
<strong>0を基準にして、どっちの方向にどれだけ離れているか</strong>——それが正負の数の本質です。
</div>

<h2>もう一度確認しよう——正負の数の使われ方</h2>
<p>下の表を見てください。マイナスがないとこれらが全部表現できなくなります。</p>
<div class="confirm-box"><div class="confirm-title">📋 正負の数が使われている身近な場面</div>
<table><tr><th>場面</th><th>正の数</th><th>負の数</th></tr>
<tr><td>気温</td><td>25度（暑い）</td><td>−5度（氷点下）</td></tr>
<tr><td>お金</td><td>+3万円（貯金）</td><td>−2万円（借金）</td></tr>
<tr><td>エレベーター</td><td>3F（3階）</td><td>B2F（地下2階）</td></tr>
<tr><td>サッカー</td><td>+3（得点超過）</td><td>−2（失点超過）</td></tr>
<tr><td>海抜</td><td>+100m（山）</td><td>−10m（海面下）</td></tr>
</table></div>

<h2>「マイナス×マイナス」を別の例でも確認しよう</h2>
<p>「後ろ向きに歩く」（マイナス方向に進む）を「さらに逆にする」（またマイナスをかける）と、「前向きに進む」（プラス）になる。<strong>反対の反対は元通り</strong>——これが「マイナス×マイナス＝プラス」の直感的な説明です。</p>
<p>もうひとつの例。「借金（マイナス）を3回なくす（×(−3)）」→「お金が戻ってくる（プラス）」。わかりますか？ どの言い方でもOK、自分が一番「なるほど！」と思える説明を覚えておきましょう。</p>
`},

{id:2,section:'ch1',title:'なぜ計算にルールがあるの？',desc:'もしルールがなかったら買い物すらできない',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>「かけ算が先」のルール、誰が決めた？</h2>
<p>「2 + 3 × 4」の答えは？ 20じゃなくて<strong>14</strong>。かけ算を先に計算するから。でも「なんで左から順番にやっちゃダメなの？」って思いますよね。</p>
<p>じゃあ、こんな場面を考えてみてください。コンビニで100円のおにぎりを3個と、150円のお茶を1本買いました。レジの計算は「100 × 3 + 150」で<strong>450円</strong>。正解。</p>
<p>でも同じ買い物を「150 + 100 × 3」と書いたらどうなる？ 左から順に計算すると 150 + 100 = 250、250 × 3 = 750円。<strong>同じ買い物なのに750円取られる</strong>。おかしいですよね。</p>

<h2>全員が同じ答えになるための「約束」</h2>
<p>計算順序のルールは、数学者が「こうしないと世の中がメチャクチャになる」と気づいて作った<strong>世界共通の約束</strong>です。日本でもアメリカでもブラジルでも、このルールは同じ。だから世界中の人が同じ式を見て同じ答えを出せる。</p>
<p>スマホの計算アプリ、銀行のシステム、ゲームのダメージ計算——全部このルールに従っています。もしルールがバラバラだったら、あなたのスマホとお母さんのスマホで計算結果が違う、なんてことが起きかねません。</p>

<div class="callout"><div class="callout-title">📐 優先順位は「強い操作から」</div>①<strong>カッコの中</strong>：最優先。「ここを先にやって！」のサイン。<br>②<strong>累乗</strong>（2乗、3乗など）：数を一番大きく変える。<br>③<strong>かけ算・わり算</strong>：数をそこそこ変える。<br>④<strong>たし算・ひき算</strong>：数をちょっと変える。<br>「影響力が大きい操作から先に確定させる」と覚えるとスッキリします。</div>

<div class="tip-box"><div class="tip-title">💡 プログラミングも同じルール</div>PythonやJavaScriptでも「2 + 3 * 4」は14を返します。コンピュータの世界でも計算順序は数学と同じ。プログラマーは毎日このルールを使って仕事をしています。</div>
<h2>このルールがあるから世界は動く</h2>
<p>LINEで友達に「2 + 3 × 4 っていくつ？」と聞いてみてください。数学を習った人なら全員「14」と答えるはず。世界中のどこでも、どんな言語でも同じ答えになる。<strong>計算順序のルールは、人類が「誤解なく情報を伝え合うために」整えた、数学という言語の文法</strong>なのです。文法がなければ言葉が通じないように、計算ルールがなければ数式は意味をなさないのです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
「計算順序のルール」＝<strong>世界中の人が同じ答えを出せるようにするための約束</strong>。<br>
カッコ → 累乗 → かけ算・わり算 → たし算・ひき算の順で計算する。<br>
このルールがないと、同じ式でも人によって違う答えが出てしまいます。
</div>

<div class="confirm-box"><div class="confirm-title">📋 計算順序のまとめ表</div>
<table><tr><th>優先度</th><th>操作</th><th>例</th></tr>
<tr><td>① 最優先</td><td>カッコの中</td><td>(2+3)×4 = 5×4 = 20</td></tr>
<tr><td>② 2番目</td><td>累乗（2乗・3乗）</td><td>2³+1 = 8+1 = 9</td></tr>
<tr><td>③ 3番目</td><td>かけ算・わり算</td><td>2+3×4 = 2+12 = 14</td></tr>
<tr><td>④ 最後</td><td>たし算・ひき算</td><td>10−2+3 = 11</td></tr>
</table>
<p style="margin-top:8px;font-size:13px;color:#666">※ カッコがあれば中を先に。なければ「かける・わる」が「たす・ひく」より先。</p>
</div>

<h2>練習してみよう</h2>
<p>次の計算、順序を考えて解いてみてください。<br>
① 3 + 2 × 5 = ?（答え：13）<br>
② (3 + 2) × 5 = ?（答え：25）<br>
① と ② はカッコがあるかどうかの違いだけ。でも答えがぜんぜん違いますよね。<strong>カッコはすごく大事</strong>なのです。</p>
`},

{id:3,section:'ch1',title:'文字式ってなんの意味がある？',desc:'xを使えば何万通りの問題が1行で片づく',tag:'history',tagLabel:'歴史',time:8,
content:`
<h2>「x って何？ 意味わかんない」</h2>
<p>数学が嫌いになる最大のきっかけが「文字式」。「なんで数字じゃなくて x なんか使うの？」——わかります。でも実は、<strong>x を使い始めたおかげで人類の生活は激変した</strong>のです。</p>

<h2>文字を使わなかった時代の地獄</h2>
<p>古代エジプトの数学者は、問題を全部<strong>言葉で</strong>書いていました。「ある数の2倍に3を足すと11になる。その数を求めよ」。今なら<strong>2x + 3 = 11</strong>と1行で書けます。でも昔はこの1問を書くだけで巻物1枚使っていたのです。</p>
<p>9世紀ペルシャの天才<strong>アル＝フワーリズミー</strong>が方程式を体系的にまとめた本を書きました。この本のタイトル『アル・ジャブル』から<strong>algebra（代数）</strong>という言葉が生まれています。数学の教科書に載ってる「代数」は、もともとペルシャ語だったのです。</p>

<h2>x は「フリーサイズの数字」</h2>
<p>長方形の面積は「たて × よこ」。でもこれを100種類の長方形それぞれについて書くのは大変。<strong>S = ab</strong> と書けば、どんなサイズの長方形にもフィットする。文字式の正体は<strong>「何万通りもの具体例を、たった1つの式で表す」</strong>道具なのです。</p>
<p>服に「フリーサイズ」ってありますよね。x はまさに数のフリーサイズ。「x に3を代入する」とは、フリーサイズの服をSサイズの人に着せるようなもの。あなた専用に数を当てはめるだけです。</p>

<div class="callout"><div class="callout-title">📐 文字式は世界を動かしている</div>アインシュタインの E = mc²（エネルギーの式）。ゲームの score = score + 10（スコアに10点加算）。SNSのフォロワー数の増加を表すグラフ式。<strong>文字式＝プログラミングの「変数」</strong>そのもの。あなたが毎日使っているスマホアプリの中身は、全部文字式でできています。</div>

<div class="tip-box"><div class="tip-title">💡 同類項はフルーツで考える</div>3a + 2b はまとめられない。りんご3個とみかん2個を「果物5個」とまとめることはできても、「りんごみかん5個」とは言えないのと同じ。<strong>同じ文字（同じ種類のフルーツ）だけがまとめられる</strong>のです。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
x（エックス）などの文字は<strong>「どんな数にもなれるフリーサイズの数字」</strong>。<br>
文字を使うと「どんな場合でも使える式」が1行で書ける。<br>
文字がなかった時代、数学者たちは問題を全部言葉で書いていた——それは超大変だった。
</div>

<div class="confirm-box"><div class="confirm-title">📋 文字を使うとこんなに変わる</div>
<table><tr><th></th><th>文字を使わない書き方</th><th>文字式</th></tr>
<tr><td>長方形の面積</td><td>たて×よこ（でも数が決まらない）</td><td>S = ab</td></tr>
<tr><td>体重×身長</td><td>それぞれ数を書き出す</td><td>y = ax</td></tr>
<tr><td>方程式</td><td>「ある数を2倍して3を足すと11」</td><td>2x+3=11</td></tr>
<tr><td>スコア計算</td><td>その都度書き直し</td><td>score = score + 10</td></tr>
</table></div>

<h2>「同類項」をもう一度確認しよう</h2>
<p>3a + 2a = 5a　→　OK！（aというりんごが3個と2個で合わせて5個）<br>
3a + 2b = ?　→　まとめられない！（りんご3個とみかん2個は別々のまま）</p>
<p><strong>「同じ文字がついているもの同士だけまとめられる」</strong>、これを必ず覚えておきましょう。文字の種類が違ったら、たし算してひとつにはできません。</p>
`},

{id:4,section:'ch1',title:'式の計算、なぜ式変形が必要？',desc:'散らかった部屋を片づけるのと同じ',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>「整理しなさい」って何のため？</h2>
<p>テストで「次の式を整理しなさい」を見て「なんでわざわざ形を変えるの？ 意味あるの？」と思ったことありませんか？</p>
<p>あなたの部屋で考えてみてください。床に服、机に教科書と漫画とお菓子、ベッドの上にカバン。この状態で「明日の体育で使うジャージどこ？」と聞かれても、すぐ見つかりませんよね。でも「服はクローゼット、教科書は本棚、お菓子はキッチン」と片づければ一瞬で見つかる。</p>
<p><strong>式の整理も同じ</strong>。バラバラな項を種類ごとにまとめてシンプルにすれば、式が「何を言っているか」がクリアに見えてきます。</p>

<h2>式変形は「翻訳」でもある</h2>
<p>3(2a + 4b) − 2(a − b) を整理すると 4a + 14b。やっていることは<strong>「同じ意味を、もっとわかりやすく言い直した」</strong>だけ。「私のお母さんの息子」→「私の兄」。意味は同じだけど、後者のほうがずっとスッキリ。式の整理もこれと同じです。</p>

<div class="callout"><div class="callout-title">📐 式変形の3つの武器</div>①<strong>分配法則</strong>：カッコを開く。3(a + b) = 3a + 3b。<br>②<strong>同類項をまとめる</strong>：同じ文字の仲間を集める。<br>③<strong>約分・通分</strong>：分数をスッキリさせる。<br>この3つだけで中学の式の計算はほぼ全部いけます。</div>

<h2>式変形ができると「見えなかったもの」が見える</h2>
<p>散らかった部屋を片づけたら、なくしたと思っていたイヤホンが見つかった——そんな経験ありませんか。式の整理も同じで、シンプルにしたら「あ、これ因数分解できるじゃん」「あ、xが消えるじゃん」と<strong>次の一手が見えてくる</strong>のです。</p>

<div class="tip-box"><div class="tip-title">💡 計算ミスを減らす最強の方法</div>「一度に全部やろうとしない」。まずカッコを開く → 次に同類項をまとめる → 最後に確認。<strong>一行ずつ丁寧に進む</strong>のが、結局いちばん速い方法です。料理でも、一気に全部入れるとぐちゃぐちゃになるでしょ？</div>
<h2>「整理する力」はどこでも使える</h2>
<p>テスト前に「やること多すぎて何からやればいいかわからない！」となったことはありませんか？ でも「まず漢字、次に計算、最後に暗記」と整理すれば動ける。友達にゲームの攻略法を教えるとき、「つまりこういうことだよ」とまとめられる人はわかりやすい。<strong>「ごちゃごちゃしたものをスッキリさせる力」は、勉強でも遊びでも部活でも最強</strong>。式の整理は、その力のトレーニングです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
式の整理とは<strong>「ゴチャゴチャしたものをスッキリさせること」</strong>。<br>
整理すると次の一手が見えてくる。整理されていない式は、答えが出せない。<br>
整理の手順：① カッコを開く → ② 同じ文字の項をまとめる → ③ 確認。
</div>

<div class="confirm-box"><div class="confirm-title">📋 式の整理の流れを確認</div>
<table><tr><th>ステップ</th><th>やること</th><th>例</th></tr>
<tr><td>①</td><td>カッコを分配法則で開く</td><td>3(2a+b) → 6a+3b</td></tr>
<tr><td>②</td><td>同類項を集める</td><td>6a+3b−2a → 4a+3b</td></tr>
<tr><td>③</td><td>答えを確認（符号ミスに注意）</td><td>4a+3b ← これが答え</td></tr>
</table></div>

<h2>なぜ「スッキリさせる」必要があるの？</h2>
<p>整理されていない式は、<strong>何を言っているかわからない</strong>。整理した式は、次に何をすればいいかが見える。これは部屋の片づけとまったく同じです。散らかった部屋では「あの本どこ？」となる。片づいた部屋では「本棚の右上」とすぐわかる。<strong>式を整理することは「自分のための片づけ」</strong>でもあります。</p>
`},

{id:5,section:'ch1',title:'式の展開って何のため？',desc:'カッコを開くと「中身」が見えてくる',tag:'concept',tagLabel:'概念',time:8,
content:`
<h2>プレゼントの包みを開けるイメージ</h2>
<p>(a + b)(c + d) のカッコを開く「展開」。難しそうに見えますが、やっていることは<strong>プレゼントの包装紙を開けて中身を確認する</strong>のと同じです。包みのままだと何が入ってるかわからない。開けたら「あ、こういうものが入ってたんだ」とわかる。</p>

<h2>面積で考えると一発で理解できる</h2>
<p>たて(a + b)cm、よこ(c + d)cmの長方形があります。この面積は(a + b)(c + d)。でもこの長方形を線で区切ると、4つの小さな長方形に分けられて、面積は ac + ad + bc + bd。<strong>大きな長方形の面積 = 小さな4つの面積の合計</strong>。これが展開の正体です。目に見える形で確認できるのです。</p>

<div class="callout"><div class="callout-title">📐 展開公式は暗記じゃなく「発見」</div>(a + b)² = a² + 2ab + b²。これは正方形の面積を分解しただけ。<br>(a + b)(a − b) = a² − b²。大きい正方形から小さい正方形を引いた面積。<br>図を描いてみると<strong>「そうなるに決まってる！」</strong>と納得できます。</div>

<h2>暗算の達人は展開公式を使っている</h2>
<p>102 × 98 を暗算できますか？ 展開公式を知っていれば一瞬です。102 × 98 = (100+2)(100−2) = 100² − 2² = 10000 − 4 = <strong>9996</strong>。買い物のお釣りの計算が速い人は、無意識にこういう「式の分解」をやっていたりします。</p>

<div class="tip-box"><div class="tip-title">💡 展開は「全員と握手」</div>(a + b)(c + d) で漏れなく展開するコツ：前のカッコの a が後ろの c と d の両方と「握手」。次に b が c と d の両方と「握手」。合計4回の握手 = 4つの項ができる。パーティーで全員と挨拶するイメージです。</div>

<h2>展開が使えると何が嬉しい？</h2>
<p>展開ができると、複雑な式の中身が見えるようになります。そして次の章で学ぶ「因数分解」——これは展開の逆操作で、方程式を解くための<strong>最強の鍵</strong>になります。展開なしに因数分解はできない。因数分解なしに2次方程式は解けない。つまり<strong>展開は数学の先に進むための入場券</strong>なのです。</p>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
展開とは<strong>「カッコを開いて中身を全部出すこと」</strong>。<br>
前のカッコの各項と、後ろのカッコの各項を「全員と握手させる」のがコツ。<br>
展開できると、その先の因数分解・方程式へとつながっていく。
</div>

<div class="confirm-box"><div class="confirm-title">📋 展開公式まとめ</div>
<table><tr><th>公式</th><th>意味</th><th>例</th></tr>
<tr><td>(a+b)(c+d) = ac+ad+bc+bd</td><td>全員と握手</td><td>(x+2)(x+3) = x²+5x+6</td></tr>
<tr><td>(a+b)² = a²+2ab+b²</td><td>同じカッコを2回かける</td><td>(x+3)² = x²+6x+9</td></tr>
<tr><td>(a-b)² = a²-2ab+b²</td><td>マイナス版</td><td>(x-2)² = x²-4x+4</td></tr>
<tr><td>(a+b)(a-b) = a²-b²</td><td>和と差の積</td><td>(x+5)(x-5) = x²-25</td></tr>
</table></div>

<h2>「握手の確認」をしてみよう</h2>
<p>(x+2)(x+3) を展開してみます。<br>
x と x → x × x = x²<br>
x と 3 → x × 3 = 3x<br>
2 と x → 2 × x = 2x<br>
2 と 3 → 2 × 3 = 6<br>
全部集めると x² + 3x + 2x + 6 = <strong>x² + 5x + 6</strong>。全部で4回の「握手」で完成です。</p>
`},

{id:6,section:'ch1',title:'因数分解は「逆再生」の技術',desc:'複雑なものを分解して本質を見抜く',tag:'concept',tagLabel:'概念',time:8,
content:`
<h2>因数分解＝「レシピを見抜く力」</h2>
<p>展開が「材料を混ぜて料理を作る」なら、因数分解は<strong>「完成した料理を食べて、材料を当てる」</strong>こと。カレーを食べて「たまねぎの甘み、スパイスの辛み、鶏肉のコクでできてるな」と分析できる人は、自分でもカレーを再現できます。</p>
<p>x² + 5x + 6 を (x+2)(x+3) に戻す。「なんでわざわざカッコに戻すの？」と思いますよね。でもこれが方程式を解くときの<strong>最大の武器</strong>になるのです。</p>

<h2>方程式を解く「魔法の鍵」</h2>
<p>x² + 5x + 6 = 0 を解きたい。このままだと手が止まりますが、因数分解すると (x+2)(x+3) = 0。ここで大事な原則：<strong>「2つの数をかけて0になるなら、どっちかが0」</strong>。だから x+2=0 または x+3=0。つまり x=−2 か x=−3。因数分解したおかげで、答えが一瞬で出たのです。</p>
<p>因数分解ができないと、2次方程式はまるごと解けなくなります。つまり因数分解は<strong>「この先の数学のドアを開ける鍵」</strong>なのです。</p>

<div class="callout"><div class="callout-title">📐 因数分解の4つの型</div>① <strong>共通因数をくくる</strong>：6x + 9 = 3(2x + 3)<br>② <strong>和と積の型</strong>：x² + 5x + 6 = (x+2)(x+3)　←かけて6、たして5になる2数を探す<br>③ <strong>完全平方</strong>：x² + 6x + 9 = (x+3)²<br>④ <strong>差の積</strong>：x² − 9 = (x+3)(x−3)<br>この4パターンで中学の因数分解はほぼ全部カバーできます。</div>

<h2>「分解する力」は一生使える</h2>
<p>因数分解の考え方は数学だけの話じゃありません。「なんで今月お金がない？」→ 支出を分解すると「コンビニのちょこちょこ買い」が原因だとわかる。「なんで試合に負けた？」→ プレーを分解すると改善点が見える。<strong>複雑なものを要素に分解して原因を見つける</strong>——これが因数分解の本質で、勉強でも日常生活でもずっと使える考え方です。</p>

<div class="tip-box"><div class="tip-title">💡 「かけて○、たして△」の感覚を鍛える</div>x² + 7x + 12 → かけて12、たして7になる2つの数は？ 3と4！ だから(x+3)(x+4)。この「かけて○、たして△」を見つける感覚を鍛えると、因数分解がスラスラできるようになります。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
因数分解とは展開の<strong>「逆操作」</strong>。カッコを開いた（展開）状態から、元のカッコの形に戻すこと。<br>
「かけて○、たして△」になる2つの数を探す——これが基本の考え方。<br>
方程式を解くための「鍵」として使う。
</div>

<div class="confirm-box"><div class="confirm-title">📋 因数分解4パターン早見表</div>
<table><tr><th>パターン</th><th>形</th><th>例</th></tr>
<tr><td>① 共通因数</td><td>ma+mb = m(a+b)</td><td>6x+9 = 3(2x+3)</td></tr>
<tr><td>② 和と積</td><td>x²+(a+b)x+ab = (x+a)(x+b)</td><td>x²+5x+6 = (x+2)(x+3)</td></tr>
<tr><td>③ 完全平方</td><td>a²+2ab+b² = (a+b)²</td><td>x²+6x+9 = (x+3)²</td></tr>
<tr><td>④ 差の積</td><td>a²-b² = (a+b)(a-b)</td><td>x²-9 = (x+3)(x-3)</td></tr>
</table></div>

<h2>「かけて○、たして△」の練習</h2>
<p>x² + 7x + 12 を因数分解しよう。<br>
かけて <strong>12</strong>、たして <strong>7</strong> になる2つの整数は？<br>
1×12=12（1+12=13）→ ダメ<br>
2×6=12（2+6=8）→ ダメ<br>
3×4=12（3+4=7）→ <strong>これ！</strong><br>
答え：(x+3)(x+4)。この「かけて・たして」感覚が身につけば因数分解はスラスラできます。</p>
`},

{id:7,section:'ch1',title:'素因数分解と「数の原子」',desc:'あなたのスマホを守っている数学',tag:'realworld',tagLabel:'実用',time:8,
content:`
<h2>物質に原子があるように、数にも「原子」がある</h2>
<p>水は水素と酸素に分解できる。でも水素はもう分解できない。それが「原子」。実は<strong>数にも同じことが言えます</strong>。12 = 2 × 2 × 3。2と3は何で割っても分解できない。このような「これ以上分けられない数」を<strong>素数</strong>と呼びます。2, 3, 5, 7, 11, 13…と無限に続きます。</p>
<p>すべての数は素数のかけ算で作れる。12 = 2² × 3 は「12の設計図」のようなもの。これを<strong>素因数分解</strong>と言います。</p>

<h2>2300年前に証明された「素数は無限にある」</h2>
<p>古代ギリシャの<strong>ユークリッド</strong>は紀元前300年ごろ、素数が無限にあることを証明しました。さらに「どんな数でも、素数の組み合わせはただ一通り」（素因数分解の一意性）も示しました。12は必ず 2²×3 であって、他の組み合わせにはならない。これは数の世界のDNAみたいなものです。</p>

<h2>あなたのスマホを守っているのは素数</h2>
<p>LINEの会話やネットショッピングの暗号（RSA暗号）は、<strong>「大きな数の素因数分解は、スーパーコンピュータでも何百年もかかる」</strong>ことを利用しています。2つの素数をかけるのは一瞬でも、その積を素因数分解するのは超大変。この「非対称性」があなたの個人情報を守っているのです。素数はスマホのボディガードなのです。</p>

<div class="callout"><div class="callout-title">📐 素因数分解のやり方</div>小さい素数から順番に割る。<br>60 ÷ 2 = 30 → 30 ÷ 2 = 15 → 15 ÷ 3 = 5 → 5は素数でストップ。<br>よって 60 = 2² × 3 × 5。<strong>「2で割れるだけ割る → 3で割る → 5で…」と進むだけ</strong>。</div>

<div class="tip-box"><div class="tip-title">💡 最大公約数・最小公倍数が一瞬で求まる</div>12 = 2² × 3、18 = 2 × 3²。<br>最大公約数 = 共通する因数の小さいほう = 2¹ × 3¹ = <strong>6</strong><br>最小公倍数 = すべての因数の大きいほう = 2² × 3² = <strong>36</strong><br>素因数分解さえできれば、ややこしい最大公約数・最小公倍数も楽勝です。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
素因数分解とは数を<strong>「素数だけのかけ算」</strong>に分解すること。<br>
素数＝「1と自分自身でしか割れない数」（2, 3, 5, 7, 11, 13…）。<br>
あなたのスマホの暗号は「大きな数の素因数分解が難しい」ことで守られている。
</div>

<div class="confirm-box"><div class="confirm-title">📋 素因数分解の手順（60を例に）</div>
<table><tr><th>ステップ</th><th>計算</th><th>確認</th></tr>
<tr><td>①</td><td>60 ÷ 2 = 30</td><td>2で割れた</td></tr>
<tr><td>②</td><td>30 ÷ 2 = 15</td><td>2で割れた</td></tr>
<tr><td>③</td><td>15 ÷ 3 = 5</td><td>3で割れた</td></tr>
<tr><td>④</td><td>5は素数！</td><td>ここでストップ</td></tr>
<tr><td>完成</td><td>60 = 2² × 3 × 5</td><td>これが60の「設計図」</td></tr>
</table></div>

<h2>最大公約数・最小公倍数も素因数分解で求まる</h2>
<p>12 = 2² × 3、18 = 2 × 3²<br>
最大公約数（GCD）：共通する素数の<strong>小さいほう</strong>の指数でかけ算 → 2¹ × 3¹ = <strong>6</strong><br>
最小公倍数（LCM）：共通する素数の<strong>大きいほう</strong>の指数でかけ算 → 2² × 3² = <strong>36</strong></p>
<p>「共通因数の小さいほう・大きいほう」と覚えれば、最大公約数も最小公倍数もスッキリ求まります。</p>
`},

{id:8,section:'ch1',title:'式の計算の応用で何ができる？',desc:'「いつでも成り立つ」を証明する力',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>100万回試しても「証明」にならない</h2>
<p>「連続する2つの奇数をかけて1を足すと、4の倍数になる」——本当？ 3×5+1=16（4の倍数）。5×7+1=36（4の倍数）。7×9+1=64（4の倍数）。100回やっても1000回やっても成り立つ。でも、<strong>数学では「たまたまかもしれない」が許されない</strong>。1億回成功しても、次で失敗するかもしれない。</p>
<p>そこで文字式の出番。2つの連続する奇数を 2n−1 と 2n+1 とおくと、(2n−1)(2n+1)+1 = 4n²−1+1 = 4n²。nがどんな数でも<strong>4×（整数）の形</strong>になる。つまり4の倍数。<strong>永遠にすべてのケースで成り立つ</strong>ことが、たった1行で証明できた。</p>

<h2>「偶数＋奇数＝？」を2秒で証明</h2>
<p>偶数を2m、奇数を2n+1とおくと、2m+(2n+1) = 2(m+n)+1。これは「2×整数+1」の形だから奇数。終わり。<strong>何億パターンあっても、文字で書けば1行で片がつく</strong>。これが「式の計算の応用」の威力です。</p>

<div class="callout"><div class="callout-title">📐 証明でよく使う「数の表し方」</div>偶数 = 2n ／ 奇数 = 2n+1 ／ 連続する整数 = n, n+1, n+2 ／ 3の倍数 = 3n ／ 2桁の自然数 = 10a + b（aが十の位、bが一の位）</div>

<h2>証明は「論理的に話す力」のトレーニング</h2>
<p>「なんでそう思うの？」「理由は？」——友達と議論するとき、親に「スマホ買って」とお願いするとき、先生に質問するとき。<strong>「こうだから、こうで、だからこうなる」と順番に説明する力</strong>は超大事。証明の練習は、まさにこの「相手を納得させる力」のトレーニングなのです。</p>

<div class="tip-box"><div class="tip-title">💡 証明問題の3ステップ</div>①<strong>文字でおく</strong>：「連続する3つの整数を n, n+1, n+2 とする」<br>②<strong>式を立てて変形する</strong>：n+(n+1)+(n+2) = 3n+3 = 3(n+1)<br>③<strong>結論を書く</strong>：「3×整数の形なので3の倍数である」<br>この型に当てはめるだけで、かなりの証明問題が解けます。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
文字式を使うと「どんな数でも成り立つ」ことを<strong>1行で証明できる</strong>。<br>
100万回試しても「証明」にはならない。文字で表して変形する——これが数学の証明。<br>
証明の手順：① 文字でおく → ② 式を変形する → ③ 結論を書く。
</div>

<div class="confirm-box"><div class="confirm-title">📋 数を文字で表す方法まとめ</div>
<table><tr><th>数の種類</th><th>文字式での表し方</th><th>例</th></tr>
<tr><td>偶数</td><td>2n</td><td>2, 4, 6, 8 …</td></tr>
<tr><td>奇数</td><td>2n+1</td><td>1, 3, 5, 7 …</td></tr>
<tr><td>連続する整数</td><td>n, n+1, n+2</td><td>5, 6, 7</td></tr>
<tr><td>3の倍数</td><td>3n</td><td>3, 6, 9, 12 …</td></tr>
<tr><td>2桁の数</td><td>10a+b</td><td>35 = 10×3+5</td></tr>
</table></div>

<h2>証明を実際にやってみよう</h2>
<p>「連続する3つの整数の和は、3の倍数である」ことを証明する。<br>
連続する3つの整数を n, n+1, n+2 とおく。<br>
その和 = n + (n+1) + (n+2) = 3n + 3 = <strong>3(n+1)</strong><br>
3×（整数）の形なので、これは3の倍数。証明完了！<br>
具体的な例：5+6+7=18=3×6 ✓　7+8+9=24=3×8 ✓</p>
`},

{id:9,section:'ch1',title:'平方根って何者？',desc:'√がないと正確な建物が建てられない',tag:'history',tagLabel:'歴史',time:9,
content:`
<h2>面積2cm²の正方形の一辺は何cm？</h2>
<p>面積1cm²の正方形 → 一辺1cm。面積4cm² → 一辺2cm。では<strong>面積2cm²</strong>の正方形の一辺は？ 1.4かな？ 1.4² = 1.96。惜しい。1.41² = 1.9881。近いけどまだ足りない。1.414² = 1.999396。どこまで計算しても<strong>ぴったり2にはならない</strong>。この「永遠に割り切れない数」を表すのが<strong>√2（ルート2）</strong>です。</p>

<h2>古代ギリシャ人を絶望させた数</h2>
<p>ピタゴラス学派は「この世のすべては分数で表せる」と信じていました。でも弟子のひとりが「√2は分数で表せない」ことを証明してしまった。分数にできない数がある——これは彼らにとって<strong>世界観が崩壊するほどの衝撃</strong>でした。伝説によると、この発見をした弟子は船から海に投げ込まれたとか…。</p>
<p>√2 = 1.41421356…（覚え方：<strong>ひとよひとよにひとみごろ</strong>）。永遠に続き、パターンも繰り返さない。だから√という記号で「まるごと」表現するのです。</p>

<h2>√がないと建物が建てられない</h2>
<p>建築現場で直角を確認するとき、三平方の定理で√を使います。ビルの対角線の長さを計算するのに√は必須。NASAのロケット軌道計算、スマホのGPSの位置計算、橋の設計——すべてに√が登場します。<strong>√がなかったら「だいたいこのくらい」でしか設計できない</strong>。ビルが傾くかもしれない。橋が崩落するかもしれない。√は正確さの命綱なのです。</p>

<div class="callout"><div class="callout-title">📐 平方根の基本</div>√a は「2乗すると a になる正の数」。<br>√4 = 2（2²=4）、√9 = 3（3²=9）、√16 = 4、√25 = 5<br>→ これらは「完全平方数」で√がきれいに外れる。<br>√2、√3、√5 などは小数で表すと無限に続く「無理数」。</div>

<div class="tip-box"><div class="tip-title">💡 √の計算3つの鉄則</div>① √a × √b = √(ab)　例：√2 × √3 = √6<br>② √a ÷ √b = √(a/b)　例：√6 ÷ √2 = √3<br>③ √の中を簡単に：√12 = √(4×3) = 2√3<br>この3つでほぼすべての計算ができます。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
√（ルート）は<strong>「2乗するとこの数になる正の数」</strong>を表す記号。<br>
√4=2（2²=4）、√9=3（3²=9）、でも√2や√3は割り切れない無限小数。<br>
√がないと建物の対角線や橋の長さを「正確に」計算できない。
</div>

<div class="confirm-box"><div class="confirm-title">📋 平方根の一覧（完全平方数）</div>
<table><tr><th>数</th><th>平方根</th><th>確認（2乗）</th></tr>
<tr><td>√1</td><td>1</td><td>1² = 1 ✓</td></tr>
<tr><td>√4</td><td>2</td><td>2² = 4 ✓</td></tr>
<tr><td>√9</td><td>3</td><td>3² = 9 ✓</td></tr>
<tr><td>√16</td><td>4</td><td>4² = 16 ✓</td></tr>
<tr><td>√25</td><td>5</td><td>5² = 25 ✓</td></tr>
<tr><td>√36</td><td>6</td><td>6² = 36 ✓</td></tr>
</table></div>

<h2>√2、√3はどのくらいの大きさ？</h2>
<p>√2 ≈ 1.41421356…（「ひとよひとよにひとみごろ」）<br>
√3 ≈ 1.7320508…（「ひとなみにおごれや」）<br>
√5 ≈ 2.2360679…（「ふじさんろくにおうむなく」）<br>
これらは語呂合わせで覚えておくと便利です。特に√2は一番よく出てきます。</p>
`},

{id:10,section:'ch1',title:'平方根の計算ルールの秘密',desc:'√のたし算とかけ算はなぜルールが違う？',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>√2 × √3 = √6 なのに、√2 + √3 ≠ √5？</h2>
<p>ここでつまずく人がめちゃくちゃ多い。「かけ算は中身をかけていいのに、たし算はなぜダメ？」。理由は<strong>「面積」と「長さ」の違い</strong>です。</p>
<p>√2 × √3 は「たて√2cm、よこ√3cm の長方形の面積」= √6cm²。面積は確かに√6。でも√2 + √3 は「√2cm の棒と √3cm の棒をつなげた長さ」。2本の棒の合計が√5cm になる理由は何もない。実際、√2≒1.41、√3≒1.73 で合計は約3.14。√5≒2.24なので全然違います。</p>

<h2>りんごとみかんで考える</h2>
<p><strong>3√2 + 2√2 = 5√2</strong>。これはOK。りんご3個 + りんご2個 = りんご5個と同じ。√2という「同じ種類のもの」だから足せる。</p>
<p>でも<strong>3√2 + 2√3 はまとめられない</strong>。りんご3個 + みかん2個 = 「りんご3個とみかん2個」としか言えない。<strong>種類が違うものは足してまとめられない</strong>。これが√の足し算のルールです。</p>

<div class="callout"><div class="callout-title">📐 √を簡単にすると「仲間」が見つかる</div>√12 + √27 = ？<br>√12 = 2√3、√27 = 3√3<br>→ 2√3 + 3√3 = <strong>5√3</strong><br>最初はバラバラに見えても、√の中を簡単にしたら<strong>同じ√3の仲間</strong>だった！ だからまとめられるのです。</div>

<h2>分母の有理化——なぜわざわざ√を消す？</h2>
<p>1/√2 を √2/2 に変える「有理化」。なぜ？ 理由はシンプルで<strong>比べやすくなるから</strong>。1/√2 と 1/√3、どっちが大きい？ パッと見わからない。でも √2/2 と √3/3 に変えると比較しやすくなります。分子と分母に同じものをかけるだけ——値は変わっていません。</p>

<div class="tip-box"><div class="tip-title">💡 答えに√が分母にあったら「まだ終わってない」</div>有理化を忘れるのは、テストで最もよくあるミス。答えを書いたら「分母に√はないか？」と最終チェック。これだけで失点を防げます。</div>
<h2>√のルールが使えると何が変わる？</h2>
<p>√の計算は「面倒くさい」と思うかもしれません。でもこのルールを使えるようになると、建物の対角線の長さや、画面のサイズ計算（テレビの「32インチ」は対角線の長さで、実際の横幅は√で求めます）など、<strong>実生活で「正確な長さ」が必要な場面で力を発揮します</strong>。「だいたい」ではなく「正確に」計算できる——それが√のルールを学ぶ意味です。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
√のかけ算・わり算は<strong>中身をかけたり割ったりできる</strong>（√2×√3=√6）。<br>
でも√のたし算は<strong>中身をたしてはいけない</strong>（√2+√3≠√5）。<br>
「同じ種類の√」だけがまとめられる（3√2+2√2=5√2）。
</div>

<div class="confirm-box"><div class="confirm-title">📋 √の計算ルール早見表</div>
<table><tr><th>操作</th><th>ルール</th><th>例</th><th>注意</th></tr>
<tr><td>かけ算</td><td>√a×√b=√(ab)</td><td>√2×√3=√6</td><td>OK</td></tr>
<tr><td>わり算</td><td>√a÷√b=√(a/b)</td><td>√6÷√2=√3</td><td>OK</td></tr>
<tr><td>簡単にする</td><td>√(a²b)=a√b</td><td>√12=2√3</td><td>OK</td></tr>
<tr><td>同じ種類を足す</td><td>a√c+b√c=(a+b)√c</td><td>3√2+2√2=5√2</td><td>OK</td></tr>
<tr><td>違う種類を足す</td><td>まとめられない</td><td>√2+√3=√2+√3のまま</td><td>NG！</td></tr>
</table></div>

<h2>分母の有理化——なぜ必要か、もう一度確認</h2>
<p>1/√2 → √2/2 に変える操作。<br>
「分子と分母に同じ√2をかける」だけ：1/√2 × √2/√2 = √2/2。<br>
<strong>値は変わっていない！</strong> ただ見た目を「分母に√がない形」に変えているだけ。<br>
テストでは「分母に√がある形は未完成」とみなされます。答えを書いたら必ずチェックしましょう。</p>
`},

{id:11,section:'ch1',title:'もっと深い√の計算へ',desc:'展開公式と√が出会うと魔法が起きる',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>√が消える魔法</h2>
<p>(√3 + √2)(√3 − √2) = (√3)² − (√2)² = 3 − 2 = <strong>1</strong>。あれだけ厄介だった√が、きれいさっぱり消えた。展開公式 (a+b)(a−b) = a²−b² と√が出会うと、<strong>複雑そうな式が整数に化ける</strong>ことがあるのです。</p>
<p>これは偶然じゃなく必然。2乗すると√が消えるのは√の定義そのもの。だから展開公式で2乗の形を作り出せば√を消せる。道具の使い方を知っていれば、難しそうな問題もスルッと解けるのです。</p>

<h2>「式の値」問題——直接代入は罠</h2>
<p>x = √5 + √3、y = √5 − √3 のとき x² + y² は？<br>直接代入すると (√5+√3)² + (√5−√3)² = (5+2√15+3)+(5−2√15+3) = 8+2√15+8−2√15 = <strong>16</strong>。</p>
<p>でも、もっとスマートな方法がある。x+y = 2√5、xy = (√5)²−(√3)² = 2。そして x²+y² = (x+y)²−2xy = 20−4 = <strong>16</strong>。<strong>式を変形してから数を入れると、計算がグッと楽になる</strong>。これが「式の値」問題の鉄則です。</p>

<div class="callout"><div class="callout-title">📐 よく使う組み合わせ</div>(√a + √b)(√a − √b) = a − b（√が全部消える！）<br>(√a + b)² = a + 2b√a + b²</div>


<h2>そもそも「√が邪魔」ってどういうこと？</h2>
<p>√3 + √2 のような答えが出たとき「もっとスッキリした数字にならないの？」と思いませんか。多くの場合、√は計算の途中に現れる「まだ整理が終わっていない形」です。<strong>展開公式を使うと√が消えてスッキリした整数になる</strong>ことがある——この魔法を紹介します。</p>

<div class="confirm-box"><div class="confirm-title">📋 √が消えるパターン</div>
<table><tr><th>計算</th><th>結果</th><th>なぜ消えるか</th></tr>
<tr><td>(√3+√2)(√3−√2)</td><td>3−2 = 1</td><td>(a+b)(a−b)=a²−b² の公式で2乗になるから</td></tr>
<tr><td>(√5+√3)(√5−√3)</td><td>5−3 = 2</td><td>同じ仕組み</td></tr>
<tr><td>(√7+2)(√7−2)</td><td>7−4 = 3</td><td>同じ仕組み</td></tr>
</table>
<p style="margin-top:8px;font-size:13px;">ポイント：<strong>「足す形」と「引く形」のセットを見つけたら、和と差の積の公式を使う</strong>と√が消える！</p>
</div>

<h2>「式の値」問題——ステップを細かく確認</h2>
<p>「x=√5+2 のとき、x²−4x+4 の値は？」という問題を例に考えます。</p>
<p><strong>まずいきなり代入してみる（ダメな方法）</strong><br>
(√5+2)² − 4(√5+2) + 4<br>
= (5 + 4√5 + 4) − (4√5 + 8) + 4<br>
= 9 + 4√5 − 4√5 − 8 + 4 = 5。<br>
計算できたけどすごく時間がかかった……</p>
<p><strong>先に式を変形する（良い方法）</strong><br>
x² − 4x + 4 = (x−2)²　（完全平方に因数分解できる！）<br>
x = √5+2 なので x−2 = √5<br>
(x−2)² = (√5)² = <strong>5</strong>。10秒で終わった！</p>
<p>「<strong>代入する前に、式をできるだけシンプルな形に変形する</strong>」——これが「式の値」問題の鉄則です。</p>

<h2>x+y と xy から x²+y² を求めるテクニック</h2>
<p>x+y と xy がわかれば、x²+y² は公式一発で求まります。<br>
<strong>x²+y² = (x+y)² − 2xy</strong><br>
たとえば x+y=3、xy=1 なら x²+y² = 3²−2×1 = 9−2 = <strong>7</strong>。<br>
x と y を別々に求めて2乗してから足す必要がない——<strong>この公式を知っているだけで計算が劇的に速くなります</strong>。</p>


<h2>ここまでの知識が全部つながる瞬間</h2>
<p>この章で使っているのは「展開公式」「因数分解」「同類項」「√の性質」——つまり第1章で学んだ知識の<strong>総合格闘技</strong>。1つ1つの道具は単純でも、組み合わせると複雑な問題が解ける。レゴのブロック1個は単純でも、組み合わせれば城が作れるのと同じです。</p>

<div class="tip-box"><div class="tip-title">💡 「変形してから代入」を習慣にしよう</div>式の値を求めるとき、いきなり数を入れるのではなく「もっと簡単な式に変形できないか？」と考えるクセをつけましょう。料理でも、下ごしらえをしてから調理するほうがうまくいきますよね。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
展開公式と√を組み合わせると<strong>√が消える魔法が使える</strong>。<br>
(√a+√b)(√a−√b) = a−b（√が全部消える！）<br>
「式の値」問題は、直接代入より<strong>先に式を変形してから代入</strong>するほうが速い。
</div>

<div class="confirm-box"><div class="confirm-title">📋 √が消える組み合わせ</div>
<table><tr><th>式</th><th>計算後</th><th>ポイント</th></tr>
<tr><td>(√3+√2)(√3−√2)</td><td>3−2=1</td><td>√が全部消える</td></tr>
<tr><td>(√5+1)(√5−1)</td><td>5−1=4</td><td>√が全部消える</td></tr>
<tr><td>(√7+2)(√7−2)</td><td>7−4=3</td><td>√が全部消える</td></tr>
</table></div>

<h2>「式の値」問題のコツ</h2>
<p>x=√5+2 のとき、x²−4x+4 の値は？<br>
<strong>直接代入する方法</strong>：(√5+2)²−4(√5+2)+4 = (5+4√5+4)−(4√5+8)+4 = 5（計算大変…）<br>
<strong>先に変形する方法</strong>：x²−4x+4 = (x−2)² = (√5+2−2)² = (√5)² = <strong>5</strong>（一瞬！）<br>
「変形してから代入」がいかに楽かわかりますね。</p>
`},

{id:12,section:'ch1',title:'近似値と有効数字の話',desc:'「だいたい」を正確に扱うプロの技術',tag:'realworld',tagLabel:'実用',time:7,
content:`
<h2>NASAでさえ「だいたい」で計算している</h2>
<p>円周率π = 3.14159265358979…は永遠に続きます。じゃあNASAのロケット計算では何桁使ってる？ 答えは<strong>15桁</strong>。たった15桁で、宇宙の果てまでの計算でも原子1個分以下の誤差しか出ません。<strong>完璧を目指す必要はなく、「十分な精度」でいい</strong>のです。</p>

<h2>「52.3kg」の本当の意味</h2>
<p>体重計に乗って「52.3kg」と表示された。これは「ぴったり52.3000000kg」ではなく、「52.25〜52.35kgのどこかだろう」という意味。確実に信用できるのは「5, 2, 3」の3つの数字だけ。これを<strong>有効数字3桁</strong>と言います。</p>
<p>なぜこんな考え方が必要？ たとえば料理で「塩3.0g」と「塩3.00g」は違うのです。3.0gは「2.95〜3.05gのあたり」で家庭の計量スプーンでOK。3.00gは「2.995〜3.005gのあたり」で精密なはかりが必要。<strong>どこまで正確かを正直に示す</strong>のが有効数字の役割です。</p>

<div class="callout"><div class="callout-title">📐 有効数字の見分け方</div>0でない数字はすべて有効。間の0は有効。先頭の0は有効でない。<br>例：0.0042 → 有効数字は「4と2」の<strong>2桁</strong>（先頭の0はただの位取り）<br>52.30 → 有効数字は<strong>4桁</strong>（末尾の0は「ここまで測りました」の意味）</div>

<h2>a × 10ⁿ の形——巨大な数も極小な数も楽々</h2>
<p>地球と太陽の距離は約150,000,000km。ゼロが多すぎて目がチカチカしますよね。1.5 × 10⁸km と書けばスッキリ。逆に、水素原子の直径は約0.00000000012m → 1.2 × 10⁻¹⁰m。<strong>非常に大きい数も小さい数も、有効数字とセットでコンパクトに表現できる</strong>のです。</p>

<div class="tip-box"><div class="tip-title">💡 「完璧主義」をやめる勇気</div>近似値の考え方は人生にも通じます。テスト勉強で100点を目指して時間切れになるより、80点分を確実にとるほうが賢い。<strong>「必要十分な精度で判断する」</strong>のは、テスト勉強でも、日常の判断でも、とても大事な考え方です。</div>


<h2>有効数字が「実生活でどう使われるか」</h2>
<p>たとえばスーパーの商品ラベルに「100g当たり230kcal」と書いてあります。これは「230.0000kcal」ではなく「225〜235kcalのどこか」という意味。食品のカロリー計算は「3桁の有効数字で十分」とされています。</p>
<p>逆に薬の調合では有効数字が非常に重要です。「薬を0.5g」と「0.50g」では意味が違う。前者は「0.45〜0.55gあたり」、後者は「0.495〜0.505gあたり」。どちらかを間違えると薬の効果や安全性に影響します。<strong>有効数字は「どこまで信用できるか」を正直に示す道具</strong>なのです。</p>

<div class="confirm-box"><div class="confirm-title">📋 a×10ⁿ の読み方・書き方</div>
<table><tr><th>元の数</th><th>a×10ⁿ の形</th><th>読み方のコツ</th></tr>
<tr><td>3500</td><td>3.5×10³</td><td>3.5を10で3回かける</td></tr>
<tr><td>0.0042</td><td>4.2×10⁻³</td><td>4.2を10で3回割る（マイナス乗）</td></tr>
<tr><td>地球と太陽の距離</td><td>1.5×10⁸km</td><td>1.5億km</td></tr>
<tr><td>水素原子の直径</td><td>1.2×10⁻¹⁰m</td><td>0.00000000012m</td></tr>
</table>
<p style="margin-top:8px;font-size:13px;">ポイント：<strong>1≤a＜10 になるように小数点を動かして、動かした分だけ10のn乗で補う</strong>。</p>
</div>

<h2>「だいたいいくつ？」を素早く出す力</h2>
<p>テストや日常で「だいたいいくつ？」と聞かれたとき、ぴったりの計算ができなくても<strong>近似値で「これくらい」と答えられる力</strong>はとても大事です。たとえば「√50 はだいたいいくつ？」→ √49=7 だから<strong>7よりちょっと大きい</strong>と即答できる。「3×π はだいたいいくつ？」→ 3×3.14≒9.4 と素早く出せる。有効数字と近似値の感覚は、<strong>「どこまで精度が必要か」を判断する力</strong>でもあります。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
近似値とは<strong>「だいたいの値」</strong>のこと。有効数字とは<strong>「信用できる桁の数」</strong>。<br>
NASAも「だいたい」を使っている——15桁の精度で宇宙の計算が十分できる。<br>
「完璧な正確さ」より「必要十分な正確さ」が大事。
</div>

<div class="confirm-box"><div class="confirm-title">📋 有効数字の見分け方</div>
<table><tr><th>数</th><th>有効数字</th><th>理由</th></tr>
<tr><td>52.3</td><td>3桁</td><td>5, 2, 3 すべて有効</td></tr>
<tr><td>0.0042</td><td>2桁</td><td>4, 2 だけ有効（先頭の0は位取り）</td></tr>
<tr><td>52.30</td><td>4桁</td><td>末尾の0は「測りました」の証拠</td></tr>
<tr><td>1.5×10⁸</td><td>2桁</td><td>1, 5 だけ有効</td></tr>
</table></div>

<h2>「十分な精度」という発想</h2>
<p>「完璧を目指す」と時間がかかりすぎることがある。テストで60点狙いなら基礎だけ固める。90点狙いなら応用問題もやる。100点狙いなら細かい部分まで完璧にする——<strong>目的に合った「十分な精度」を見極める力</strong>は、近似値の考え方から学べる大事な思考法です。</p>
`},

{id:13,section:'ch2',title:'方程式は「犯人探し」',desc:'わからないものを見つけ出す推理ゲーム',tag:'history',tagLabel:'歴史',time:8,
content:`
<h2>あなたはすでに方程式を使っている</h2>
<p>「1000円持ってコンビニに行って、お釣りが350円だった。何円使った？」——あなたの頭の中では 1000 − □ = 350 という計算が一瞬で動いています。この□を探すのが<strong>方程式</strong>。つまり方程式は「わからない数を見つける推理ゲーム」なのです。</p>
<p>古代メソポタミアの人々は4000年前からこの「推理」をしていました。「ある数の2倍に3を足すと11になる」。今の書き方で 2x + 3 = 11。これが方程式の原型です。</p>

<h2>天秤（てんびん）で考えると全部わかる</h2>
<p>方程式は<strong>天秤</strong>。左と右が釣り合っている状態。天秤の両方の皿に同じ重さのおもりを足しても、同じおもりを引いても、天秤は釣り合ったまま。これが方程式を解くたった1つのルールです。</p>
<p>2x + 3 = 11。両方から3を引く → 2x = 8。両方を2で割る → x = 4。<strong>常に「両方に同じ操作」</strong>をすれば答えにたどり着ける。それだけ。</p>

<div class="callout"><div class="callout-title">📐 「移項」の正体</div>「+3を右辺に移項すると−3になる」——これは魔法じゃなく、<strong>両辺から3を引いた</strong>だけ。左辺の+3が消え、右辺に−3が現れたように見える。「移項」は「両辺から引く」の別の言い方です。</div>

<h2>方程式は毎日使っている</h2>
<p>「1000円で120円のパンは何個買える？」→ 120x ≤ 1000。「何時に出れば9時に間に合う？」→ 出発時刻 + 移動時間 = 9時。「あと何点取れば平均70になる？」→ (合計 + x) ÷ 5 = 70。<strong>「わからないことを、わかっていることから推理する」</strong>——私たちは毎日これをやっています。方程式は、それを正確にやるための道具なのです。</p>

<div class="tip-box"><div class="tip-title">💡 検算で「犯人確認」</div>x = 4 が出たら、元の式に戻して確認。2(4)+3 = 11。ピッタリ。答えを元の式に代入して左辺＝右辺になるか確認する習慣をつけると、ミスが激減します。</div>
<h2>方程式は「考える型」を教えてくれる</h2>
<p>「わからないものを x とおいて、わかっていることから式を立て、x を求める」。この考え方はいろんな場面で使えます。テストで「この問題、何を求めればいいんだろう？」と考えるとき。推理マンガで「犯人は誰だ？」とヒントから絞り込むとき。「あと何日で夏休みの宿題が終わるか」を逆算するとき。<strong>方程式を解く練習は、この「考え方の型」を体に覚えさせるトレーニング</strong>なのです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
方程式とは<strong>「わからない数（x）を、わかっていることから求める」</strong>道具。<br>
「天秤の両方に同じ操作をする」——これが方程式を解くたった一つのルール。<br>
移項とは「両辺から同じ数を引いた結果」が「符号が逆になって反対側に移る」ように見えること。
</div>

<div class="confirm-box"><div class="confirm-title">📋 方程式を解く手順（2x+3=11）</div>
<table><tr><th>ステップ</th><th>操作</th><th>式の変化</th></tr>
<tr><td>①</td><td>両辺から3を引く</td><td>2x+3−3 = 11−3 → 2x=8</td></tr>
<tr><td>②</td><td>両辺を2で割る</td><td>2x÷2 = 8÷2 → x=4</td></tr>
<tr><td>③ 検算</td><td>x=4を元に戻す</td><td>2×4+3=11 ✓</td></tr>
</table></div>

<h2>「検算」は絶対にやろう</h2>
<p>x=4 を求めたら、元の式に代入して確認。2×4+3 = 8+3 = 11。左辺と右辺が一致した！ <strong>検算を習慣にするだけで、ミスが半分以下になります</strong>。特にテストでは「計算できたけど答えが違った」というミスが多い。答えを求めたら必ず戻って確認しましょう。</p>
`},

{id:14,section:'ch2',title:'方程式のテクニック集',desc:'分数・小数・カッコ——「邪魔者」を消す技術',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>分数が出た瞬間「ムリ」と思うあなたへ</h2>
<p>方程式に分数や小数が入ると急に難しく見える。でも実は<strong>「最初に邪魔者を消す」</strong>という戦略を知っていれば、全部同じように解けます。</p>

<h2>分数は「消せる」</h2>
<p>x/3 + x/4 = 7。分母の3と4の最小公倍数は12。両辺に12をかけると、分数が全部消えて<strong>4x + 3x = 84</strong>。あとは 7x = 84 → x = 12。やったことは「分母を消すために両辺に同じ数をかけた」だけ。天秤の両方に同じ操作をしているのでOK。</p>

<h2>小数も「消せる」</h2>
<p>0.3x + 1.2 = 2.7。小数は10倍すれば整数になる。両辺に10をかけて<strong>3x + 12 = 27</strong>。3x = 15 → x = 5。<strong>小数の消し方も分数と発想は同じ</strong>。「邪魔なものを消して、シンプルにしてから解く」。</p>

<div class="callout"><div class="callout-title">📐 カッコは分配法則で開く</div>3(x − 2) = 12 → 3x − 6 = 12 → 3x = 18 → x = 6。<br>カッコがあったら<strong>まず分配法則で開く</strong>。それが下準備の第一歩。</div>

<h2>結局、戦略は1つだけ</h2>
<p>どんなに複雑に見える方程式も、やることは<strong>①邪魔者を消す（分数・小数・カッコ）→ ②移項して整理 → ③xの値を求める</strong>。この3ステップの繰り返し。見た目に惑わされず「まず何を消すか」を考えれば、どんな方程式も怖くありません。料理と同じで、下ごしらえ（邪魔者を消す）さえしっかりやれば、あとは簡単なのです。</p>

<div class="tip-box"><div class="tip-title">💡 「見た瞬間に手が動く」を目指す</div>分数を見たら → 分母の最小公倍数を両辺にかける。小数を見たら → 10や100をかける。カッコを見たら → 分配法則。この「反射神経」を身につけると、テストでも焦りません。</div>
<h2>「邪魔者を消す」発想は人生でも使える</h2>
<p>分数を見たら最小公倍数をかけて消す。小数を見たら10倍して消す。カッコを見たら分配法則で開く。<strong>「問題を難しくしている原因を特定して、先に取り除く」</strong>——この戦略は、勉強だけでなく日常の問題解決にも使えます。部屋が散らかっていたら、まず一番大きなゴミ（邪魔者）を捨てる。それだけで一気にスッキリしますよね。方程式もまったく同じです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
分数・小数・カッコがある方程式の戦略は<strong>「まず邪魔者を消す」</strong>。<br>
分数→両辺に分母の最小公倍数をかける。小数→両辺に10や100をかける。カッコ→分配法則で開く。<br>
邪魔を取り除いてから解く——これで「どんな方程式も同じ手順で解ける」。
</div>

<div class="confirm-box"><div class="confirm-title">📋 邪魔者の消し方まとめ</div>
<table><tr><th>邪魔者</th><th>消し方</th><th>例</th></tr>
<tr><td>分数</td><td>両辺に分母の最小公倍数をかける</td><td>x/3+x/4=7 → 両辺×12 → 4x+3x=84</td></tr>
<tr><td>小数</td><td>両辺に10（または100）をかける</td><td>0.3x+1.2=2.7 → 両辺×10 → 3x+12=27</td></tr>
<tr><td>カッコ</td><td>分配法則で開く</td><td>3(x−2)=12 → 3x−6=12</td></tr>
</table></div>

<h2>一つずつ練習してみよう</h2>
<p><strong>分数の場合</strong>：x/2 = 3 → 両辺×2 → x = 6。簡単な例から。<br>
<strong>小数の場合</strong>：0.5x = 2 → 両辺×10 → 5x = 20 → x = 4。<br>
<strong>カッコの場合</strong>：2(x+1) = 8 → 2x+2 = 8 → 2x = 6 → x = 3。<br>
どれも「邪魔を消す→移項→割る」の3ステップです。</p>
`},

{id:15,section:'ch2',title:'連立方程式の発想',desc:'手がかりが2つあれば犯人は1人に絞れる',tag:'concept',tagLabel:'概念',time:8,
content:`
<h2>1つの式だけでは答えは決まらない</h2>
<p>「x + y = 10」——これだけだと答えは無限。x=1,y=9 でもいいし、x=5,y=5 でもいい。でも「x − y = 4」という条件がもう1つあったら？ 両方を同時に満たすのは<strong>x=7, y=3の1つだけ</strong>。手がかりが2つあれば、犯人は1人に絞れるのです。</p>

<h2>未知数が2つ → 式が2つ必要</h2>
<p>コンビニでおにぎりとお茶を買いました。「合わせて5個で、合計金額は620円。おにぎり120円、お茶100円」。おにぎりをx個、お茶をy個とすると：x + y = 5（合計5個）、120x + 100y = 620（合計金額）。この2つの式を同時に解くとx=3, y=2。おにぎり3個、お茶2個。</p>

<div class="callout"><div class="callout-title">📐 2つの解法</div><strong>加減法</strong>：2つの式を足したり引いたりして1つの文字を消す。<br>2x + y = 10 …①、x − y = 2 …②<br>①+② → 3x = 12 → x = 4 → y = 2<br><strong>代入法</strong>：片方の式を y = … の形にして、もう片方に代入。<br>どちらも目的は同じ——<strong>「2つの未知数を1つに減らす」</strong>こと。</div>

<h2>連立方程式は社会で大活躍</h2>
<p>学園祭の模擬店で「焼きそば+ジュースのセットA 500円」「焼きそば+アイスのセットB 450円」「ジュース+アイスのセットC 400円」。焼きそば・ジュース・アイスそれぞれの値段は？ 連立方程式で一発です。<strong>「いくつかのヒントを組み合わせて答えを出す」</strong>のが連立方程式の面白さ。クイズ番組で「ヒント1とヒント2を合わせると答えがわかる！」のと同じ発想です。</p>

<div class="tip-box"><div class="tip-title">💡 「何をxに、何をyにするか」が最初の一歩</div>文章題では、まず「求めたいもの」をx, yとおく。次に「等しい関係」を2つ見つけて式にする。<strong>日本語から数式への翻訳</strong>ができれば、あとは計算するだけです。</div>
<h2>「条件を整理して答えを出す」力</h2>
<p>「部活の練習もしたいし、テスト勉強もしないといけない。でも睡眠時間は削りたくない」——こんな状況で限られた時間をどう使うか。これは連立方程式の発想そのもの。<strong>「いくつかの条件を整理して、全部を満たす答えを見つける力」</strong>は、スケジュール管理、お小遣いのやりくり、友達との予定調整で毎日のように使います。連立方程式は、その力のトレーニングなのです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
連立方程式とは<strong>「2つの式を同時に満たすxとyを見つける」</strong>こと。<br>
加減法：2つの式を足し引きして、片方の文字を消す。<br>
代入法：一方の式をy=…にして、もう一方に代入して文字を消す。
</div>

<div class="confirm-box"><div class="confirm-title">📋 加減法と代入法の比較</div>
<table><tr><th></th><th>加減法</th><th>代入法</th></tr>
<tr><td>やり方</td><td>2式を足すか引いて1つの文字を消す</td><td>y=…の形にして代入</td></tr>
<tr><td>向いている場面</td><td>xかyの係数が同じとき</td><td>x=やy=の形にしやすいとき</td></tr>
<tr><td>例</td><td>x+y=5, x−y=1 → 足す</td><td>y=2x, x+y=6 → 代入</td></tr>
</table></div>

<h2>実際に解いてみよう（加減法）</h2>
<p>x + y = 5 … ①<br>
x − y = 1 … ②<br>
①＋②：2x = 6 → x = 3<br>
x=3を①に代入：3+y=5 → y=2<br>
答え：x=3, y=2。確認：3+2=5 ✓、3−2=1 ✓。<strong>2つの式を両方確認するのが大切です</strong>。</p>
`},

{id:16,section:'ch2',title:'2次方程式の世界へ',desc:'答えが2つ出てくる不思議な方程式',tag:'history',tagLabel:'歴史',time:8,
content:`
<h2>答えが「2つ」ってどういうこと？</h2>
<p>x² = 9 の答えは？ x = 3。でも x = −3 も正解。(−3)² = 9 だから。<strong>2次方程式は答えが2つ出る</strong>のが最大の特徴です。</p>
<p>「答えが1つじゃないなんてモヤモヤする」と思いますか？ でもこれは現実の世界でも起こることです。ボールを上に投げたとき、高さが10mになる瞬間は<strong>2回</strong>あります——上がっていくときと、落ちてくるとき。2つの答えは「行きと帰り」のようなものなのです。</p>

<h2>4000年前から解かれていた</h2>
<p>古代バビロニアの粘土板（紀元前1800年）には、すでに2次方程式を解く手順が書かれていました。当時は公式ではなく、具体的な手順（アルゴリズム）として伝えられていたのです。人類は4000年前から「答えが2つある問題」と格闘してきました。</p>

<div class="callout"><div class="callout-title">📐 2次方程式を解く3つの方法</div>①<strong>因数分解</strong>：x²+5x+6=0 → (x+2)(x+3)=0 → x=−2, −3<br>②<strong>平方根</strong>：(x−3)²=5 → x=3±√5<br>③<strong>解の公式</strong>：x = (−b ± √(b²−4ac)) / 2a<br>まず①を試し、できなければ③を使う、というのが基本の流れ。</div>

<h2>2次方程式が使われる身近な場面</h2>
<p>バスケでシュートしたボールの軌道は放物線。その軌道を式にすると2次式になります。「ボールが地面に落ちるのは何秒後？」は2次方程式で解ける。スマホのゲームでキャラクターがジャンプするとき、ゲーム内部では2次方程式が計算されています。建築家が橋のアーチを設計するときも、2次方程式が必要です。</p>

<div class="tip-box"><div class="tip-title">💡 「答えを2つ書く」を忘れない</div>2次方程式で最もよくあるミスは、答えの片方を忘れること。x²=9 で x=3 だけ書いて×をもらう人がたくさんいます。<strong>2次方程式を解いたら必ず「答えは2つあるか？」とセルフチェック</strong>しましょう。</div>
<h2>「答えが複数ある」ことに慣れよう</h2>
<p>人生の選択肢も、たいてい1つじゃありません。「理系に進むか文系に進むか」「沖縄に残るか県外に出るか」——どちらも「正解」になりうる。2次方程式の「答えが2つ」は、<strong>「正解は1つとは限らない」</strong>という大事な感覚を教えてくれます。大切なのは両方の答えを出した上で、どちらが自分の状況に合うかを考えること。これが「解の吟味」の本質です。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
2次方程式は<strong>「答えが2つ出る」</strong>方程式（例外で1つや0個のこともある）。<br>
解き方は3種類：① 因数分解、② 平方根、③ 解の公式。<br>
まず①を試す。できなければ③を使う——これが基本の流れ。
</div>

<div class="confirm-box"><div class="confirm-title">📋 2次方程式の解き方3種類</div>
<table><tr><th>方法</th><th>使う場面</th><th>例</th></tr>
<tr><td>① 因数分解</td><td>因数分解できるとき（まず試す）</td><td>x²+5x+6=0 → (x+2)(x+3)=0</td></tr>
<tr><td>② 平方根</td><td>x²=（数）の形のとき</td><td>x²=9 → x=±3</td></tr>
<tr><td>③ 解の公式</td><td>どんな場合でも使える万能</td><td>ax²+bx+c=0 に a,b,c を代入</td></tr>
</table></div>

<h2>「答えが2つ」の意味を確認しよう</h2>
<p>x²=9 の答え：x=3 と x=−3 の<strong>両方</strong>。<br>
なぜ？ 3² = 9 ✓、(−3)² = 9 ✓ → どちらも正しい！<br>
「テストでよくあるミス」：x=3しか書かない → 半分しか合ってないことになる。<br>
<strong>2次方程式を解いたら必ず2つの答えを確認しましょう</strong>。</p>
`},

{id:17,section:'ch2',title:'2次方程式をもっと深く',desc:'解の公式——万能の「答え製造機」',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>どんな2次方程式でも解ける「万能公式」</h2>
<p>因数分解できない2次方程式もある。そんなとき登場するのが<strong>解の公式</strong>。</p>
<p>x = (−b ± √(b²−4ac)) / 2a</p>
<p>ax² + bx + c = 0 の a, b, c を当てはめるだけで、<strong>どんな2次方程式の答えも100%出せる</strong>。たった3つの数字（a, b, c）がわかれば、答えが製造される。まさに「答え製造マシン」です。</p>

<h2>解の前に答えの数がわかる——判別式</h2>
<p>解の公式の中にある<strong>b²−4ac</strong>という部分を「判別式」と呼びます。この値を見るだけで、計算する前に答えの個数がわかるのです。</p>
<p>b²−4ac > 0 → 答えは<strong>2つ</strong>。b²−4ac = 0 → 答えは<strong>1つ</strong>（同じ値が2つ→重解）。b²−4ac < 0 → √の中がマイナスなので<strong>答えなし</strong>（中学の範囲では）。答えがあるかないかを、解く前に判定できる。これってすごいことだと思いませんか？</p>

<div class="callout"><div class="callout-title">📐 解の公式を使う手順</div>① ax²+bx+c=0 の形にする<br>② a, b, c の値を書き出す（符号に注意！）<br>③ b²−4ac を計算<br>④ 公式に代入<br>⑤ できたら約分チェック</div>

<h2>暗記ではなく「理解」する公式</h2>
<p>解の公式は長くて覚えにくいと思うかもしれません。でも実は、ax²+bx+c=0 を「平方完成」という操作で変形していくと、自然にこの公式が導き出されます。つまり<strong>公式は「覚えるもの」ではなく「導けるもの」</strong>。原理を理解していれば、忘れても自分で作り直せる。それが数学の強さです。</p>

<div class="tip-box"><div class="tip-title">💡 符号ミスに最大の注意を</div>解の公式で最もよくある間違いは、b の符号を間違えること。「−b」の部分で、b がもともとマイナスのとき −(−3) = +3 になるのを忘れがち。<strong>a, b, c を書き出すとき、符号ごと丁寧に</strong>書きましょう。</div>
<h2>「公式を使いこなす」とは</h2>
<p>解の公式は「a, b, c の3つの情報を入れたら答えが出てくるマシン」。料理でいえば、材料を入れたら自動で調理してくれるホットクック。大事なのは<strong>正しい材料（a, b, c の値と符号）を正しく入れること</strong>。「使いこなす」とは公式を暗記することではなく、正しい情報を正しく入力できる力のことなのです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
解の公式は<strong>「どんな2次方程式も解ける万能公式」</strong>。<br>
x = (−b ± √(b²−4ac)) / 2a に a, b, c を代入するだけ。<br>
判別式（b²−4ac）を先に計算すると、答えが何個あるかがわかる。
</div>

<div class="confirm-box"><div class="confirm-title">📋 判別式（b²−4ac）と答えの個数</div>
<table><tr><th>判別式の値</th><th>答えの個数</th><th>イメージ</th></tr>
<tr><td>b²−4ac > 0</td><td>2個（異なる2つ）</td><td>放物線がx軸を2点で交わる</td></tr>
<tr><td>b²−4ac = 0</td><td>1個（重解）</td><td>放物線がx軸に接する</td></tr>
<tr><td>b²−4ac < 0</td><td>0個（なし）</td><td>放物線がx軸と交わらない</td></tr>
</table></div>

<h2>解の公式の使い方を練習しよう</h2>
<p>x² − 5x + 6 = 0 を解の公式で解く。<br>
a=1, b=−5, c=6 → b²−4ac = 25−24 = 1<br>
x = (5 ± √1) / 2 = (5 ± 1) / 2<br>
x = 3 または x = 2。<br>
因数分解で確認：(x−2)(x−3)=0 → x=2, x=3 ✓<strong>同じ答えが出た！</strong></p>
`},

{id:18,section:'ch2',title:'文章題は「翻訳」の技術',desc:'日本語を数式に変換できれば勝ち',tag:'concept',tagLabel:'概念',time:8,
content:`
<h2>文章題が嫌われる本当の理由</h2>
<p>計算はできるのに文章題になるとフリーズする。それは「計算力がない」のではなく、<strong>「日本語を数式に翻訳する」力が足りない</strong>だけ。英語の長文読解と同じで、必要なのは「読み取る力」なのです。</p>

<h2>翻訳の3ステップ</h2>
<p><strong>Step 1</strong>：求めたいものをxとおく。「りんごの数をxとする」。<br><strong>Step 2</strong>：等しい関係を見つける。「合計は」「差が」「○倍」がキーワード。<br><strong>Step 3</strong>：式にして解く。</p>
<p>たとえば「姉と弟のお小遣いの合計は5000円で、姉は弟より1000円多い」。弟のお小遣いをx円とすると、姉はx+1000円。x + (x+1000) = 5000 → 2x = 4000 → x = 2000。弟は2000円、姉は3000円。</p>

<div class="callout"><div class="callout-title">📐 翻訳辞書——日本語と数式の対応</div>「AとBの合計がC」→ A + B = C<br>「AはBよりC多い」→ A = B + C<br>「AはBの3倍」→ A = 3B<br>「AはBより20%高い」→ A = 1.2B<br>これらが<strong>日本語→数式の変換表</strong>です。</div>

<h2>図や表を描くだけで式が「見える」</h2>
<p>文章題が得意な人は、実は絵をたくさん描いています。「兄と弟が同時に出発して…」と聞いたら、道のりの図を描く。「3種類のジュースを混ぜて…」と聞いたら、表を書く。<strong>「頭の中でやろうとしない」のが最大のコツ</strong>。図に描けば、「あ、ここが等しいんだ」と気づけます。</p>

<h2>よく出る3つのパターン</h2>
<p>文章題は種類が限られています。<strong>①個数と金額</strong>（おにぎりとお茶の問題）。<strong>②速さ・時間・距離</strong>（追いかけっこの問題）。<strong>③割合・濃度</strong>（食塩水の問題）。この3パターンを練習すれば、文章題の大部分はカバーできます。</p>

<div class="tip-box"><div class="tip-title">💡 答えが出たら「意味」を確認</div>x = −5 が出たけど、xは「人数」だった場合、マイナスはおかしい。方程式を正しく解けていても、<strong>答えが問題の意味に合っているか</strong>の最終確認を忘れずに。</div>
<h2>「読む力」と「数学力」は表裏一体</h2>
<p>文章題は「数学の問題」であると同時に「日本語の読解問題」。実は数学が得意な人は国語の文章読解も得意なことが多いのです。どちらも<strong>「文章の中から大事な情報を抜き出し、構造を見抜く力」</strong>が問われるから。文章題の練習は、知らず知らずのうちにあなたの「読む力」も鍛えています。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
文章題が難しいのは「計算力がない」からではなく<strong>「日本語を数式に翻訳する力が足りない」</strong>から。<br>
求めたいものをxにおく → 等しい関係を式にする → 解く——この3ステップ。<br>
「翻訳辞書」を覚えれば、あとは計算するだけ。
</div>

<div class="confirm-box"><div class="confirm-title">📋 日本語→数式の翻訳辞書</div>
<table><tr><th>日本語</th><th>数式</th></tr>
<tr><td>AとBの合計がC</td><td>A + B = C</td></tr>
<tr><td>AはBよりC多い</td><td>A = B + C</td></tr>
<tr><td>AはBより小さい</td><td>A < B</td></tr>
<tr><td>AはBの○倍</td><td>A = ○B</td></tr>
<tr><td>割引後の価格</td><td>定価×（1−割引率）</td></tr>
<tr><td>速さ×時間</td><td>道のり（距離）</td></tr>
</table></div>

<h2>翻訳の練習をしよう</h2>
<p>「姉と弟の持っているお金の合計は1200円で、姉は弟の2倍持っている」<br>
弟をxとすると：姉は2x<br>
合計：x + 2x = 1200 → 3x = 1200 → x = 400<br>
弟400円、姉800円。確認：400+800=1200 ✓、800=2×400 ✓</p>
`},

{id:19,section:'ch2',title:'応用文章題のコツ',desc:'パターンを知れば文章題は怖くない',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>連立方程式の文章題——条件が2つあれば2つの式</h2>
<p>「大人と子どもで合計30人。大人は1200円、子どもは700円で、合計金額は28000円」。大人x人、子どもy人として：x + y = 30（人数）、1200x + 700y = 28000（金額）。条件が2つあるから式も2つ。<strong>条件の数 = 式の数</strong>と覚えましょう。</p>

<h2>2次方程式の文章題——面積が鍵</h2>
<p>「正方形の庭の一辺をxm伸ばしたら面積が32m²増えた」のように、面積が絡む問題で2次方程式が登場します。一辺がam の正方形を各辺xm伸ばすと、新しい面積 = (a+x)² = a² + 2ax + x²。増えた面積 = 2ax + x²。ここにx²が出てくるから2次方程式になるのです。</p>

<div class="callout"><div class="callout-title">📐 よく出る文章題パターン</div>①<strong>個数と金額</strong>：りんごx個+みかんy個＝合計、単価×個数＝合計金額<br>②<strong>速さと時間</strong>：道のり＝速さ×時間。「行きと帰りの合計時間」がよく出る<br>③<strong>面積の増減</strong>：一辺をx伸ばしたときの面積変化<br>④<strong>食塩水の濃度</strong>：食塩の量/食塩水の量×100</div>

<h2>答えの「吟味」を忘れない</h2>
<p>2次方程式で x = 3 と x = −5 が出たとき、「長さ」の問題ならマイナスは使えません。x = 3 だけが答え。これを<strong>解の吟味</strong>と言います。<strong>「数学的に正しい」と「問題の意味に合っている」は別の話</strong>。年齢がマイナスになったり、人数が小数になったりしたら、その答えは捨てます。</p>

<div class="tip-box"><div class="tip-title">💡 式が立てられなくても書けるものは書く</div>「わからない…」と白紙で出すのはもったいない。「xとyをこうおいた」「こういう関係がある」だけでも書いてみましょう。式を立てる過程を書くこと自体が、頭を整理する力になります。</div>
<h2>「慣れ」が最大の武器</h2>
<p>文章題は「難しい」のではなく「慣れていないだけ」です。自転車に初めて乗ったときのことを思い出してください。最初はフラフラだったけど、何度も練習したら無意識に乗れるようになった。文章題も同じ。パターンを5問、10問と解くうちに、<strong>「あ、これは前と同じパターンだ」と見抜ける目</strong>が育ちます。最初は時間がかかっても大丈夫。やった分だけ必ず楽になります。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
文章題は<strong>「パターンの種類が限られている」</strong>——慣れれば必ず解けるようになる。<br>
解の吟味を忘れずに：数学的に正しい答えでも、問題の意味に合わないものは捨てる。<br>
「わからなくても、わかることだけ書く」ことが大事。
</div>

<div class="confirm-box"><div class="confirm-title">📋 文章題の頻出パターン</div>
<table><tr><th>パターン</th><th>キーワード</th><th>立式のコツ</th></tr>
<tr><td>個数と金額</td><td>「○個で○円」</td><td>個数×単価=合計</td></tr>
<tr><td>速さと時間</td><td>「時速○km、○時間後に出会う」</td><td>道のり=速さ×時間</td></tr>
<tr><td>割合・濃度</td><td>「○%の食塩水」</td><td>食塩の量=食塩水×濃度÷100</td></tr>
<tr><td>面積の増減</td><td>「一辺を○cm伸ばした」</td><td>新面積−旧面積=増加分</td></tr>
</table></div>

<h2>解の吟味——「数学的な答え」と「現実の答え」</h2>
<p>2次方程式で x=5 と x=−2 が出た。「長さ」の問題ならマイナスは不適。答えは x=5 だけ。<br>
「人数」の問題で x=3.5 が出たら？ 人数が小数はおかしい → この問題の解き方か立式に間違いがある。<br>
<strong>答えが出たら必ず「この答えは問題の意味に合っているか？」と確認しましょう。</strong></p>
`},

{id:20,section:'ch3',title:'座標はどこから来た？',desc:'天井のハエから生まれた大発明',tag:'history',tagLabel:'歴史',time:8,
content:`
<h2>ハエが数学の歴史を変えた</h2>
<p>17世紀フランスの哲学者<strong>ルネ・デカルト</strong>。病弱だった彼はベッドで過ごす時間が長く、ある日、天井を歩くハエの位置を「壁からの横の距離」と「壁からの縦の距離」の<strong>2つの数の組</strong>で表せることに気づきました。これが<strong>座標平面</strong>の誕生。「場所」を「数」で表すというシンプルなアイデアが、数学の歴史を永遠に変えたのです。</p>

<h2>スマホの地図も座標</h2>
<p>あなたのスマホの地図アプリ。「現在地：北緯26.3°、東経127.7°」。これは地球上の位置を2つの数で表した座標そのもの。ゲームのキャラクターが画面上で動くとき、その位置は(x, y)の座標で管理されています。LINEで送る位置情報も、Uberの配車も、ポケモンGOの出現場所も、<strong>すべて座標で動いています</strong>。</p>

<div class="callout"><div class="callout-title">📐 座標平面の基本</div>横がx軸、縦がy軸。交わる点が原点O(0,0)。<br>右上が第1象限（x>0, y>0）、左上が第2象限（x<0, y>0）<br>左下が第3象限（x<0, y<0）、右下が第4象限（x>0, y<0）<br>座標は必ず（<strong>横, 縦</strong>）の順。エレベーターに乗る前にまず廊下を歩くイメージ。</div>

<h2>座標があるから「図形」と「式」がつながる</h2>
<p>座標の最大の功績は、<strong>「図形の問題を計算で解ける」</strong>ようにしたこと。直線のグラフは式で表せるし、式からグラフが描ける。デカルトの発明以前は、図形は図形、計算は計算で、別の世界でした。座標がこの2つの世界を<strong>1つに統合した</strong>のです。</p>

<div class="tip-box"><div class="tip-title">💡 座標を打つ練習</div>方眼紙に(3, 2)、(−1, 4)、(−2, −3)などの点を打つ練習をしてみましょう。「横に動いて、縦に動く」——この感覚が身につけば、関数のグラフも図形の問題も格段に楽になります。</div>
<h2>「数で場所を表す」は400年前の発明</h2>
<p>デカルトの発明のすごさは、<strong>「目に見える場所」と「目に見えない数式」を結びつけた</strong>こと。400年前のこのアイデアが、今あなたのスマホの地図を動かし、ゲームのキャラクターを走らせ、ドローンを飛ばしている。座標を理解することは、現代テクノロジーの「土台」を理解することなのです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
座標とは<strong>「場所を2つの数で表す方法」</strong>。デカルトが天井のハエを見て発明した。<br>
「横（x軸）に何マス、縦（y軸）に何マス」の2つの数で、平面上のどんな点も表せる。<br>
スマホの地図、ゲームのキャラクター、ドローンの位置——すべて座標で動いている。
</div>

<div class="confirm-box"><div class="confirm-title">📋 座標平面の基本</div>
<table><tr><th>名前</th><th>説明</th><th>例</th></tr>
<tr><td>x軸</td><td>横方向の数直線</td><td>右が+、左が−</td></tr>
<tr><td>y軸</td><td>縦方向の数直線</td><td>上が+、下が−</td></tr>
<tr><td>原点</td><td>x軸とy軸が交わる点</td><td>座標は(0, 0)</td></tr>
<tr><td>点の表し方</td><td>(x座標, y座標)の順</td><td>(3, 2)は右に3、上に2</td></tr>
</table></div>

<h2>座標を打つ練習をしよう</h2>
<p>(3, 2)：まず右に3マス → 上に2マス → そこに点を打つ。<br>
(−2, 4)：まず左に2マス → 上に4マス → そこに点を打つ。<br>
(0, −3)：x軸上（横に動かない）→ 下に3マス → そこに点を打つ。<br>
<strong>「横（x）を先に動かして、次に縦（y）を動かす」</strong>——この順番を守りましょう。</p>
`},

{id:21,section:'ch3',title:'比例・反比例は世界の法則',desc:'「2倍にしたら2倍になる」は意外と大事',tag:'realworld',tagLabel:'実用',time:8,
content:`
<h2>バイトの給料は比例</h2>
<p>時給1000円のバイト。1時間で1000円、3時間で3000円、5時間で5000円。<strong>働く時間が2倍になれば、もらえるお金も2倍</strong>。これが<strong>比例</strong>（y = ax）。グラフは原点を通るまっすぐな直線。「一定のルールで増え続ける」シンプルで正直な関係です。</p>
<p>ガソリン1Lで15km走る車。2Lなら30km、3Lなら45km。距離 = 15 × ガソリン量。携帯の通信量と料金（従量制プラン）も比例です。</p>

<h2>反比例は「限られたリソースの分け方」</h2>
<p>100kmの道のりを移動するとき、時速50kmなら2時間、時速100kmなら1時間。速さを上げれば時間は減る。y = 100/x。これが<strong>反比例</strong>。グラフは原点を通らない曲線（双曲線）。</p>
<p>もっと身近な例。ピザ1枚を4人で分ければ1/4ずつ。8人で分ければ1/8ずつ。人数が増えると1人あたりの量は減る。<strong>「限られたものをどう分配するか」が反比例の本質</strong>。お小遣いの使い方、時間の使い方、テスト勉強の配分——すべて反比例的な思考です。</p>

<div class="callout"><div class="callout-title">📐 比例と反比例の比較</div><strong>比例 y = ax</strong>：原点を通る直線。aは「傾き＝変化の速さ」。<br><strong>反比例 y = a/x</strong>：原点を通らない曲線。xy = a（常にかけ算が一定）。<br>比例は「片方が増えるともう片方も増える」。反比例は「片方が増えるともう片方は減る」。</div>

<h2>日常は比例と反比例の組み合わせ</h2>
<p>「テスト勉強を2倍したら点数も2倍になる？」——残念ながらこれは比例ではありません。60点を70点にするのは比較的簡単でも、90点を100点にするのは超大変。<strong>現実の多くは「完全な比例」ではない</strong>。だからこそ比例と反比例を理解しておくと、「この関係は比例的か、それとも違うか？」と判断する目が養われるのです。</p>
<div class="tip-box"><div class="tip-title">💡 「比例的かどうか」を見抜く目</div>「友達が2倍になったら楽しさも2倍？」「勉強時間を2倍にしたら点数も2倍？」——答えはどちらもNoですよね。世の中には比例するものと比例しないものがある。<strong>「この関係は比例？ 反比例？ それともどちらでもない？」と判断できる力</strong>こそが、比例・反比例を学ぶ本当の価値です。</div>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
比例（y=ax）：一方が2倍になれば、もう一方も2倍になる関係。<br>
反比例（y=a/x）：一方が2倍になれば、もう一方は1/2になる関係。<br>
「比例的かどうかを見抜く目」が、日常の判断力を高める。
</div>

<div class="confirm-box"><div class="confirm-title">📋 比例と反比例の違いまとめ</div>
<table><tr><th></th><th>比例 y=ax</th><th>反比例 y=a/x</th></tr>
<tr><td>グラフの形</td><td>原点を通る直線</td><td>原点を通らない曲線（双曲線）</td></tr>
<tr><td>x×y</td><td>一定ではない（x×y=ax²）</td><td>常に一定（x×y=a）</td></tr>
<tr><td>身近な例</td><td>バイト料金、ガソリンと走行距離</td><td>速さと時間、人数と1人あたりの量</td></tr>
</table></div>

<h2>「比例？ 反比例？」を見分けるコツ</h2>
<p>① xが2倍になったとき、yも2倍 → 比例<br>
② xが2倍になったとき、yが1/2 → 反比例<br>
③ xが増えてもyは変わらない → 比例でも反比例でもない<br>
例：「速さ60km/hで走るとき、時間と距離の関係は？」<br>
距離=速さ×時間 = 60×時間 → 時間が2倍なら距離も2倍 → <strong>比例</strong>！</p>
`},

{id:22,section:'ch3',title:'1次関数は「予測マシン」',desc:'今の状態から未来を予測する道具',tag:'realworld',tagLabel:'実用',time:8,
content:`
<h2>「このまま行くとどうなる？」に答える</h2>
<p>お風呂に毎分5Lずつお湯が溜まっています。今すでに20L入っている。10分後には？ y = 5x + 20 に x=10 を入れると y=70L。<strong>1次関数は「今の状態」と「変化のスピード」がわかれば未来を予測できる</strong>道具です。</p>
<p>銀行に10万円あって毎月2万円ずつ貯金する。y = 2x + 10。半年後（x=6）には22万円。スマホの充電が80%で、1時間に5%ずつ減る。y = −5x + 80。何時間後にバッテリー切れ？ −5x + 80 = 0 → x = 16時間後。</p>

<h2>y = ax + b の正体</h2>
<p><strong>a（傾き）</strong>＝変化のスピード。毎分何L増えるか、毎月何円貯まるか。傾きが大きいほどグラフが急。<br><strong>b（y切片）</strong>＝スタート地点。最初から入っている水の量、最初の貯金額。<br>つまり<strong>y = ax + b は「スタート地点 + 変化の速さ × 時間」</strong>です。</p>

<div class="callout"><div class="callout-title">📐 グラフを描く3ステップ</div>① y切片(0, b)に点を打つ（スタート地点）<br>② 傾きaに従ってもう1点打つ（右に1、上にa）<br>③ 2点を直線で結ぶ<br>たった3手で完成。</div>

<h2>「どっちが得？」を1次関数で判断する</h2>
<p>ゲームの課金プラン。「無料プレイ＋1回100円のガチャ」と「月額980円の使い放題」。月にガチャを引く回数をxとすると、無料プランの支出は y=100x、課金プランは y=980。x=10で同じ金額になる。<strong>月10回以上ガチャするなら課金プランのほうが得</strong>——この判断は1次関数の比較そのもの。携帯の料金プラン選びにも使えます。</p>

<div class="tip-box"><div class="tip-title">💡 傾きのイメージ</div>傾き a > 0 なら右上がり（増えていく）。a < 0 なら右下がり（減っていく）。a = 0 なら水平（変化なし）。<strong>傾きは「グラフの急さ」であり「変化の激しさ」</strong>です。</div>
<h2>「このペースだとどうなる？」がわかる</h2>
<p>「毎日5ページずつ宿題をやれば、あと何日で終わる？」「毎月500円ずつ貯金したら、年末にはいくら貯まる？」「スマホのギガを毎日0.3GB使ってると、月末に足りなくなるのは何日目？」——これ全部、1次関数で計算できます。<strong>「今のペースでいくとどうなるか」を予測する力</strong>は、テスト勉強の計画から日常のやりくりまで、めちゃくちゃ使えます。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
1次関数（y=ax+b）は<strong>「スタート地点（b）と変化の速さ（a）がわかれば未来を予測できる」</strong>道具。<br>
a（傾き）＝変化のスピード。b（y切片）＝スタート地点。<br>
グラフを描く手順：① y切片に点 → ② 傾きで次の点 → ③ 直線で結ぶ。
</div>

<div class="confirm-box"><div class="confirm-title">📋 y=ax+b の意味を整理</div>
<table><tr><th>記号</th><th>名前</th><th>意味</th><th>グラフへの影響</th></tr>
<tr><td>a</td><td>傾き</td><td>xが1増えるとyがa増える</td><td>正なら右上がり、負なら右下がり</td></tr>
<tr><td>b</td><td>y切片</td><td>x=0のときのyの値（スタート地点）</td><td>グラフがy軸と交わる点</td></tr>
</table></div>

<h2>身近な1次関数を見つけよう</h2>
<p>スマホのバッテリーが今80%で、1時間ごとに5%ずつ減る。<br>
y = −5x + 80（y=バッテリー%、x=時間）<br>
何時間後に0%になる？ −5x+80=0 → 5x=80 → x=16時間後。<br>
「今のペースだとバッテリーが切れるのは16時間後」——これが予測の力です！</p>
`},

{id:23,section:'ch3',title:'直線の式を求める技術',desc:'2つの手がかりから全体像を推理する',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>2つの情報があれば直線は1本に決まる</h2>
<p>y = ax + b には未知の数が2つ（aとb）。だから<strong>2つの情報</strong>があれば式が決まります。「傾きと1点」でも「2点」でもOK。推理小説で手がかりが2つあれば犯人が特定できるのと同じです。</p>

<h2>2点から式を求める手順</h2>
<p>点(1, 3)と(4, 9)を通る直線の式は？<br>①<strong>傾きを求める</strong>：a = (9−3)/(4−1) = 6/3 = 2<br>②<strong>bを求める</strong>：y = 2x + b に(1,3)を代入 → 3 = 2+b → b = 1<br>③<strong>答え</strong>：y = 2x + 1。2つの点から、直線全体が復元できました。</p>

<div class="callout"><div class="callout-title">📐 傾きの公式</div>a = (y₂ − y₁) / (x₂ − x₁)<br>= 「yの増加量 ÷ xの増加量」<br>= 「どれだけ進んだらどれだけ上がったか」<br>坂道の急さを測るのと同じ考え方です。</div>

<h2>平行な直線は「同じ傾き」</h2>
<p>y = 2x + 1 と y = 2x + 5。傾き（a=2）が同じで、切片だけが違う。グラフを描くと<strong>2本の線はどこまでいっても交わらない——平行</strong>です。電車のレールのように、同じ傾きで走り続ける。逆に傾きが違えば、いつか必ず交わります。</p>

<h2>この技術は「少ない手がかりから推理する」力</h2>
<p>理科の実験で2回の測定データがあれば、グラフに直線を引いて次の結果を予測できる。テストの点数が2回分わかれば、「このペースで伸びたら次は何点取れそうか」が見える。<strong>「少ない情報から全体像を推理する」</strong>——これが直線の式を求める技術の本質です。</p>

<div class="tip-box"><div class="tip-title">💡 10秒でできるまで練習を</div>2点を通る直線の式を求めるのは、慣れれば10秒でできます。「傾き → 代入してb」の2手。この操作が瞬時にできると、関数の大問全体の見通しがグッとよくなります。</div>
<h2>少ない情報から全体を読む力</h2>
<p>推理マンガで手がかり2つから犯人がわかるように、点が2つあれば直線全体がわかる。テストの第1回と第2回の点数から、「このペースなら第3回は何点くらい取れそうか」が予測できる。<strong>「少ない手がかりから全体を読む」——この推理力こそが、直線の式を求める技術の本質</strong>。数学だけでなく、いろんなところで使える考え方です。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
「2点を通る直線の式」は<strong>傾きを求めてからbを求める</strong>、2ステップで完成。<br>
傾き a = (yの増加量) ÷ (xの増加量)。<br>
平行な直線は「同じ傾き」を持ち、絶対に交わらない。
</div>

<div class="confirm-box"><div class="confirm-title">📋 直線の式を求める3パターン</div>
<table><tr><th>与えられた情報</th><th>求め方</th></tr>
<tr><td>傾きaとy切片b</td><td>そのまま y=ax+b に代入</td></tr>
<tr><td>傾きaと1点(x₁,y₁)</td><td>y₁=ax₁+b に代入してbを求める</td></tr>
<tr><td>2点(x₁,y₁)(x₂,y₂)</td><td>まず傾きa=(y₂−y₁)÷(x₂−x₁)を求め、次にbを求める</td></tr>
</table></div>

<h2>傾きの公式を「坂道」でイメージしよう</h2>
<p>傾き = 「縦の変化量 ÷ 横の変化量」<br>
点(0, 0)と点(3, 6)を通る直線の傾き = (6−0) ÷ (3−0) = 6÷3 = 2<br>
これは「右に3進むと上に6上がる坂道」＝「傾き2の坂」。<br>
<strong>傾きが大きい → 急な坂、傾きが小さい → ゆるやかな坂</strong>と覚えましょう。</p>
`},

{id:24,section:'ch3',title:'方程式とグラフの関係',desc:'式を「見える化」すると世界が変わる',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>式はグラフに、グラフは式になる</h2>
<p>y = 2x + 1 と聞いてもピンとこないかもしれません。でもグラフに描くと「あ、右上がりの直線で、y軸を1のところで横切るんだ」と一目でわかる。逆にグラフを見れば「傾きが2で切片が1だから y = 2x + 1 だ」と式がわかる。<strong>式とグラフは「同じものを別の角度から見た姿」</strong>なのです。</p>

<h2>連立方程式を解く＝交点を見つける</h2>
<p>y = 2x + 1 と y = −x + 7。この連立方程式を解くと x=2, y=5。グラフに描くと2本の直線が(2, 5)で<strong>交わっている</strong>。つまり<strong>「連立方程式を解くこと」と「2直線の交点を求めること」は完全に同じ</strong>なのです。</p>
<p>式で解いても答えは出ます。でもグラフで見ると「あ、この2本はここで交わるんだ」と直感的にわかる。<strong>式（計算）とグラフ（視覚）の両方の武器を持つ</strong>ことが、数学を強くする秘訣です。</p>

<div class="callout"><div class="callout-title">📐 ax + by = c のグラフの描き方</div>2x + 3y = 6 のグラフは？<br>x=0を代入 → y=2 → 点(0, 2)<br>y=0を代入 → x=3 → 点(3, 0)<br>この2点を結べば完成。どんな形の方程式も、この方法で描けます。</div>

<h2>「目に見える」と一気にわかりやすくなる</h2>
<p>自分のテストの点数を5回分グラフにすれば「あ、だんだん上がってる」「ここで下がったのはサボった時期だ」と一目でわかる。毎日の勉強時間をグラフにすれば「先週は頑張ったな」が見える。<strong>数字の羅列をグラフにするだけで、気づけなかったことが見えてくる</strong>。式とグラフを行き来する力は、数学以外でもずっと役に立ちます。</p>

<div class="tip-box"><div class="tip-title">💡 交点の求め方は「連立方程式」</div>2つのグラフの交点を求めたいとき、2つの式を連立方程式として解く。「グラフの問題なのに計算で解ける」のが座標のすごさです。</div>
<h2>2つの武器を持つと強くなる</h2>
<p>ゲームで「攻撃しかできないキャラ」と「攻撃も回復もできるキャラ」、どっちが強い？ 数学も同じ。<strong>式（計算）とグラフ（目で見る）の両方を使える人は、片方だけの人より圧倒的に強い</strong>のです。「この問題、計算よりグラフで見たほうが早いな」と切り替えられる柔軟さが、数学が得意になるコツです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
方程式（数式）とグラフ（絵）は<strong>「同じものを別の角度から見た姿」</strong>。<br>
連立方程式を解く＝2つのグラフの交点を求めること——全く同じ操作。<br>
「計算で解く」と「グラフで見る」の両方を使えると、数学が圧倒的に強くなる。
</div>

<div class="confirm-box"><div class="confirm-title">📋 方程式とグラフの対応</div>
<table><tr><th>方程式（数式）</th><th>グラフ（絵）</th></tr>
<tr><td>y = 2x + 1</td><td>傾き2、y切片1の右上がり直線</td></tr>
<tr><td>連立方程式の解</td><td>2直線の交点の座標</td></tr>
<tr><td>方程式の解なし</td><td>2直線が平行（交わらない）</td></tr>
<tr><td>方程式の解が無数</td><td>2直線が完全に一致</td></tr>
</table></div>

<h2>グラフで交点を確認しよう</h2>
<p>y=x+1 と y=−x+5 の交点は？<br>
計算：x+1=−x+5 → 2x=4 → x=2, y=3<br>
グラフ：(2,3)でちょうど交わっている。<br>
<strong>「計算の答えとグラフが一致する」体験が、数学の理解を深める</strong>のです。</p>
`},

{id:25,section:'ch3',title:'関数 y=ax² の世界',desc:'現実は「直線」じゃなく「曲線」で動いている',tag:'concept',tagLabel:'概念',time:8,
content:`
<h2>直線では表せない現象がある</h2>
<p>1次関数のグラフは直線。「毎月2万円ずつ貯金」のように一定のペースで変化するもの。でも現実の多くの現象は、こんなにお行儀よくありません。ボールを投げた軌道、車のブレーキ距離、落下する物体——これらは<strong>直線ではなく曲線（放物線）</strong>で表されます。</p>

<h2>ブレーキ距離で実感する「2乗の怖さ」</h2>
<p>車のブレーキ距離は速度の<strong>2乗に比例</strong>します。時速30kmでブレーキ距離は約9m。時速60km（2倍の速度）なら約36m（<strong>4倍</strong>）。時速90km（3倍の速度）なら約81m（<strong>9倍</strong>）。速度が2倍になるとブレーキ距離は4倍。3倍になると9倍。<strong>「ちょっとスピードを出しすぎただけ」が命取りになる理由</strong>が、数学で説明できるのです。</p>

<div class="callout"><div class="callout-title">📐 y = ax² のグラフの特徴</div>・グラフは原点を頂点とする<strong>放物線</strong>（U字型または∩字型）<br>・a > 0 なら下に凸（U字型）、a < 0 なら上に凸（∩字型）<br>・y軸について<strong>左右対称</strong><br>・|a|が大きいほどグラフは狭く（急に）、小さいほど広い（ゆるやかに）</div>

<h2>1次関数との違い——「変化の速さ」が変わる</h2>
<p>1次関数は傾きが一定。坂道でいうと「ずっと同じ急さの坂」。でも y=ax² は、xが大きくなるほど変化が急になる。<strong>坂がどんどん急になっていく</strong>イメージ。これが放物線の特徴であり、「加速」の正体です。車のアクセルを踏み続けると、最初はゆっくり、でもどんどんスピードが増していく——これが2乗に比例する変化です。</p>

<div class="tip-box"><div class="tip-title">💡 「変化の割合」に注目</div>y=x² で、xが1→3に変わるとき、変化の割合 = (9−1)/(3−1) = 4。xが3→5に変わるとき、変化の割合 = (25−9)/(5−3) = 8。xの範囲が違うと変化の割合も変わる。<strong>これが1次関数（常に一定）との最大の違い</strong>です。</div>
<h2>「2乗の世界」を知ると見え方が変わる</h2>
<p>SNSのフォロワーが10人のとき影響力は小さいけど、100人になると影響力は10倍じゃなく<strong>もっと急激に</strong>増える。人口が2倍の都市は、経済規模が2倍以上になることが多い。このように<strong>「2乗的に増える現象」は世の中にあふれています</strong>。y=ax²を理解していると、「ちょっとの変化が大きな結果を生む」ことが数字で実感でき、リスクの判断や計画立案に役立つのです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
y=ax² は<strong>放物線（U字型の曲線）</strong>を描く関数。1次関数（直線）とは違い「どんどん変化が急になる」。<br>
ブレーキ距離、落下距離、面積——2乗が関係する現象を表す。<br>
a>0 なら下に凸（U字）、a<0 なら上に凸（∩字型）。
</div>

<div class="confirm-box"><div class="confirm-title">📋 y=ax² の特徴まとめ</div>
<table><tr><th>項目</th><th>内容</th></tr>
<tr><td>グラフの形</td><td>放物線（U字型または∩字型）</td></tr>
<tr><td>頂点</td><td>原点(0, 0)を通る</td></tr>
<tr><td>対称軸</td><td>y軸（左右対称）</td></tr>
<tr><td>aの大小</td><td>|a|が大きい→グラフが急（細い）、小さい→ゆるやか（広い）</td></tr>
<tr><td>aの正負</td><td>a>0→下に凸、a<0→上に凸</td></tr>
</table></div>

<h2>1次関数との「変化の割合」の違いを確認</h2>
<p>y=2x では x: 1→2（+1）のとき y: 2→4（+2）——変化の割合は常に2（一定）。<br>
y=x² では x: 1→2 のとき y: 1→4（+3）、x: 2→3 のとき y: 4→9（+5）——変化の割合がどんどん増えていく！<br>
<strong>「変化の割合が一定」＝直線、「変化の割合が変わる」＝曲線</strong>です。</p>
`},

{id:26,section:'ch3',title:'関数の応用①',desc:'グラフの中に隠れた三角形を見つける',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>関数と図形が出会うとき</h2>
<p>放物線と直線をグラフに描くと、交わった部分に三角形や四角形が現れます。その面積を求める問題は、関数の応用問題の王道です。ここでは「座標」「連立方程式」「面積の公式」という<strong>今まで学んできたすべてが合体</strong>します。</p>

<h2>手順はシンプル</h2>
<p>放物線 y = x² と直線 y = x + 2 が交わる点を求める。x² = x + 2 → x²−x−2 = 0 → (x−2)(x+1) = 0 → x=2, x=−1。対応するyは y=4, y=1。交点は(2, 4)と(−1, 1)。この2点とy切片(0, 2)で三角形ができて、面積が計算できます。</p>

<div class="callout"><div class="callout-title">📐 面積を求める3ステップ</div>①<strong>交点の座標を求める</strong>（2つの式を連立方程式で解く）<br>②<strong>底辺と高さを決める</strong>（x軸やy軸に平行な辺を底辺にすると楽）<br>③<strong>S = 底辺 × 高さ ÷ 2</strong>で計算</div>

<div class="tip-box"><div class="tip-title">💡 等積変形のテクニック</div>底辺が同じで、頂点が底辺に平行な直線上を動いても、三角形の面積は変わらない。この「等積変形」の発想が、複雑な面積問題を解くカギになることがあります。形を変えても面積は同じ——この柔軟な発想は、日常の「視点を変える力」にもつながります。</div>

<h2>この問題が解けると何が嬉しい？</h2>
<p>グラフの面積問題は「座標の読み取り」「方程式を解く力」「図形の面積の知識」を<strong>全部同時にテストする総合問題</strong>。1つの問題に複数の単元が詰まっている。逆に言えば、解けなくてもどこでつまずいたかがわかれば、弱点を発見できます。自分の実力の「健康診断」のような問題なのです。</p>
<h2>「座標＋方程式＋図形」が合体する瞬間</h2>
<p>この融合問題では、デカルトが発明した座標、方程式を解く力、三角形の面積の知識——バラバラに学んできたものが<strong>1つの問題の中で合体</strong>します。パズルのピースがカチッとはまるように、「あ、全部つながってたんだ」と実感できる瞬間。それこそが数学の一番気持ちいい瞬間であり、「学んできた意味があった」と思える瞬間なのです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
放物線と直線を1つのグラフに描くと、<strong>三角形や四角形が現れる</strong>。<br>
その面積を求めるには：① 交点の座標を求める → ② 底辺と高さを決める → ③ 公式で計算。<br>
座標・方程式・面積の知識が一度に合体する「総合問題」。
</div>

<div class="confirm-box"><div class="confirm-title">📋 面積を求める手順まとめ</div>
<table><tr><th>ステップ</th><th>やること</th></tr>
<tr><td>①</td><td>2つの式を連立方程式で解いて交点の座標を求める</td></tr>
<tr><td>②</td><td>図を描いて三角形や四角形の形を確認する</td></tr>
<tr><td>③</td><td>x軸やy軸と平行な辺を底辺にして高さを求める</td></tr>
<tr><td>④</td><td>S = 底辺 × 高さ ÷ 2（三角形）で計算</td></tr>
</table></div>

<h2>等積変形——形を変えても面積は同じ</h2>
<p>「底辺が同じで、頂点が底辺に平行な直線上にある三角形」は面積が等しい。<br>
なぜ？ 面積 = 底辺×高さ÷2。頂点が平行線上にあれば高さは変わらない。だから面積も変わらない。<br>
<strong>「形が変わっても面積が同じ」という等積変形の発想は、難しい面積問題を簡単にするコツ</strong>です。</p>
`},

{id:27,section:'ch3',title:'関数の応用②',desc:'動く点を式で追いかける',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>「点が動く」問題——何が変わって何が変わらない？</h2>
<p>「点Pが辺AB上をAからBまで毎秒1cmで動くとき、三角形APCの面積はどう変化するか」——この「動点問題」は一見難しそうですが、考え方はシンプル。<strong>動いている部分をxで表して、面積を式にする</strong>だけです。</p>
<p>x秒後にAPの長さはxcm。底辺をAPとすると、高さは固定（Cから辺ABへの垂直距離）。面積 = x × h ÷ 2。x が変われば面積も変わる。これが<strong>面積を x の関数で表す</strong>ということです。</p>

<h2>変域——「ここからここまで」の範囲</h2>
<p>点PがAからBまで動くなら、0 ≤ x ≤ AB。この「xが取りうる範囲」を<strong>変域</strong>と言います。グラフを描くときも、変域の範囲だけを太い線で描きます。スマホの音量が0〜100の範囲で変えられるように、<strong>xにも「動ける範囲」がある</strong>のです。変域を意識しないと「点が辺からはみ出す」ようなあり得ない答えが出てしまいます。</p>

<div class="callout"><div class="callout-title">📐 場面分けのコツ</div>点Pが辺ABにいるとき、辺BCに移ったとき、辺CDにいるとき——場面ごとに底辺や高さの式が変わることがあります。「どこで式が切り替わるか」を見極めるのが動点問題の最大のポイント。</div>

<h2>動点問題は「変化を式で捉える」総合演習</h2>
<p>動いているものをxで表し、変化する量を関数として式にし、変域を考慮してグラフを描く。今まで学んだ「文字式」「関数」「図形の面積」のすべてが合流する問題です。難しく感じるかもしれませんが、<strong>「何をxにするか」「どの式が使えるか」「変域はどこか」</strong>の3点を順番に考えればOK。</p>

<div class="tip-box"><div class="tip-title">💡 まず具体的に計算してみる</div>x=1のとき面積いくら？ x=2のときは？ と具体的な数字で計算してから式を立てると、パターンが見えてきます。「具体→抽象」の順番で考えるのが、数学のコツです。</div>
<h2>「変化を追いかける力」はめちゃくちゃ使える</h2>
<p>スマホのバッテリーが時間とともに減っていく。貯金が毎月のお小遣いで増えていく。夏休みの宿題の残りが日ごとに減っていく。<strong>「変わっていくものを数字で追いかけて、先を読む」</strong>——これが関数の力です。「このペースだとバッテリーは3時間後に切れるな」「このペースだと8月25日に宿題が終わるな」と予測できるようになる。動点問題は、その力の総仕上げです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
動点問題とは<strong>「動いている点をxで表して、面積を式にする」</strong>問題。<br>
変域とは「xが取りうる範囲」。変域を超えた答えは意味がない。<br>
まず「x=1のとき」「x=2のとき」と具体的に試してから、式を立てるのがコツ。
</div>

<div class="confirm-box"><div class="confirm-title">📋 動点問題を解く手順</div>
<table><tr><th>ステップ</th><th>内容</th></tr>
<tr><td>①</td><td>何をxにするか決める（例：点が動いた距離、経過時間）</td></tr>
<tr><td>②</td><td>変域を確認する（点がどこからどこまで動くか）</td></tr>
<tr><td>③</td><td>面積を底辺×高さ÷2 でxの式にする</td></tr>
<tr><td>④</td><td>具体的な数字で確認する（x=1, x=2 で試す）</td></tr>
</table></div>

<h2>変域の大切さを確認しよう</h2>
<p>点Pが辺AB（長さ6cm）上を動くとする。AP = x cm（0≤x≤6）。<br>
x=−1 は存在しない（点が辺の外に出てしまう）。<br>
x=7 も存在しない（辺AB は6cmしかない）。<br>
<strong>「変域を意識する」ことが、答えを現実的にする大事なチェックポイント</strong>です。</p>
`},

{id:28,section:'ch4',title:'作図のルーツ',desc:'定規とコンパスだけで世界を描いた古代ギリシャ',tag:'history',tagLabel:'歴史',time:8,
content:`
<h2>なぜ「定規とコンパスだけ」というルール？</h2>
<p>中学の作図では「目盛りのない定規」と「コンパス」しか使いません。分度器も三角定規も禁止。なんだか不便に思えますが、これには2300年前の古代ギリシャに遡る深い理由があります。</p>
<p>古代ギリシャの数学者たちは「<strong>最も純粋な道具だけで、すべての図形を正確に描けるか？</strong>」という問いに挑みました。彼らにとって数学とは「真理の探究」であり、目盛りや角度計に頼るのは「不純」だと考えたのです。ユークリッドの『原論』は、この2つの道具だけで幾何学を組み立てた壮大な体系です。</p>

<h2>3つの基本作図が世界をつくる</h2>
<p>①<strong>垂直二等分線</strong>：線分のちょうど真ん中を通り、垂直に交わる線。友達と自分の家の真ん中の地点を見つけるようなイメージです。②<strong>角の二等分線</strong>：角をぴったり半分に分ける線。ピザを正確に2等分するときの切り方です。③<strong>垂線</strong>：ある点から直線に最短距離で下ろす線。建物の壁に対して棚をまっすぐ取り付けるとき、壁に垂直にしますよね。</p>
<p>驚くべきことに、<strong>たったこの3つの作図を組み合わせるだけで、正三角形、正六角形、正方形、さらには正五角形まで描ける</strong>のです。</p>

<div class="callout"><div class="callout-title">📐 垂直二等分線の隠れた力</div>線分ABの垂直二等分線上にある点は、<strong>AからもBからも同じ距離</strong>にあります。これは「2つのコンビニからちょうど同じ距離にある場所を見つけたい」というときに使える性質です。カーナビの「中間地点検索」も、実はこの考え方を使っています。</div>

<h2>作図は「条件を図形に翻訳する」技術</h2>
<p>「2点から等距離にある場所」と聞いたら → 垂直二等分線。「2つの道路から等距離にある場所」と聞いたら → 角の二等分線。作図問題が解けるようになるコツは、<strong>言葉の条件を図形の性質に翻訳する</strong>ことです。消防署の最適な設置場所を決めるとき、複数の地区から等距離になる場所を探す——これも作図の考え方と同じです。</p>

<div class="tip-box"><div class="tip-title">💡 作図の跡は消さない！</div>コンパスで描いた円弧は「ここで作図しましたよ」という証拠。テストでは作図の跡を残すことが求められます。消しゴムで消さないように注意しましょう。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
作図とは<strong>「目盛りのない定規とコンパスだけ」</strong>で図形を正確に描くこと。<br>
基本の3作図：垂直二等分線・角の二等分線・垂線。<br>
作図の跡（円弧）は消してはいけない——証拠として必ず残す。
</div>

<div class="confirm-box"><div class="confirm-title">📋 基本3作図のまとめ</div>
<table><tr><th>作図</th><th>できること</th><th>使う場面</th></tr>
<tr><td>垂直二等分線</td><td>線分の中点を通り垂直な線</td><td>2点から等距離の場所を探す</td></tr>
<tr><td>角の二等分線</td><td>角をちょうど半分に分ける線</td><td>2辺から等距離の場所を探す</td></tr>
<tr><td>垂線</td><td>点から直線への最短距離の線</td><td>高さを作図する</td></tr>
</table></div>

<h2>「2点から等距離の場所」は垂直二等分線上にある</h2>
<p>病院と学校の「ちょうど中間にある公園を探したい」場合、2点（病院・学校）の垂直二等分線上の点がすべてその条件を満たします。カーナビの「2地点の中間地点検索」も、この原理を使っています。<br>
<strong>作図は「言葉の条件を図形に翻訳する力」</strong>。条件をしっかり読めば、どの作図を使えばいいかがわかります。</p>
`},
{id:29,section:'ch4',title:'図形の移動の不思議',desc:'平行移動・回転移動・対称移動の世界',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>図形を「動かす」3つの方法</h2>
<p>あなたのスマホを思い浮かべてください。画面を指でスライドする——これが<strong>平行移動</strong>。画像を2本指でくるっと回す——これが<strong>回転移動</strong>。写真の「左右反転」ボタンを押す——これが<strong>対称移動</strong>。実は、数学で習う図形の移動は、毎日使っているスマホの操作そのものなのです。</p>

<h2>3つの移動の正体</h2>
<p><strong>平行移動</strong>は、すべての点を同じ方向に同じ距離だけ動かすこと。引っ越しのとき、家具を「まっすぐ3メートル右へ」と動かすイメージです。形も向きも変わりません。</p>
<p><strong>回転移動</strong>は、1つの点（回転の中心）を決めて、その周りをぐるっと回すこと。時計の針が12時の位置から3時の位置に動くのは、中心を軸にした90°の回転移動です。観覧車のゴンドラも回転移動で動いています。</p>
<p><strong>対称移動</strong>は、1本の線（対称の軸）を「鏡」に見立てて、パタンと折り返すこと。あなたが鏡に映った姿を見るとき、右手が左手に、左手が右手に見えますよね。これが対称移動です。</p>

<div class="callout"><div class="callout-title">📐 移動で変わらないもの</div>どの移動でも<strong>「長さ」「角度」「面積」は絶対に変わりません</strong>。つまり移動前と移動後の図形は<strong>合同</strong>（まったく同じ形・同じ大きさ）です。変わるのは「位置」と「向き」だけ。これが移動の大原則です。</div>

<h2>アニメーションも図形の移動</h2>
<p>アニメのキャラクターが歩く動きは、平行移動と回転移動の組み合わせ。ゲームでキャラクターが方向転換するのは回転移動。CGで建物を左右対称にデザインするのは対称移動。<strong>デジタルコンテンツを作るクリエイターは、全員が図形の移動を使って仕事をしている</strong>と言えます。</p>

<div class="tip-box"><div class="tip-title">💡 回転の中心を見つけるコツ</div>対応する2点を結んだ線分の垂直二等分線を2本引くと、その交点が回転の中心です。作図の技術がここでも活きてきます。</div>
<h2>移動の考え方は「変わらないもの」を見つける力</h2>
<p>移動しても長さ・角度・面積は変わらない。逆に言えば、<strong>「何が変わって何が変わらないか」を見極める力</strong>が移動の本質です。友達と喧嘩して関係が変わっても「好きだという気持ち」は変わらないかもしれない。転校しても「自分自身」は変わらない。変化の中で「変わらない本質」を見つける——図形の移動が教えてくれるのは、そんな大切な視点でもあります。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
図形の移動は3種類：<strong>平行移動（スライド）・回転移動（くるっと回す）・対称移動（鏡に映す）</strong>。<br>
どの移動でも「長さ・角度・面積」は変わらない（移動前後の図形は合同）。<br>
スマホの「ピンチアウト・回転・左右反転」がまさに3つの移動と対応している。
</div>

<div class="confirm-box"><div class="confirm-title">📋 3つの移動の比較</div>
<table><tr><th></th><th>平行移動</th><th>回転移動</th><th>対称移動</th></tr>
<tr><td>動き方</td><td>同じ方向に同じ距離</td><td>1点を中心にぐるっと回る</td><td>1本の線を鏡にして反転</td></tr>
<tr><td>向きは変わる？</td><td>変わらない</td><td>変わる</td><td>変わる（左右逆）</td></tr>
<tr><td>日常の例</td><td>画面のスワイプ</td><td>時計の針</td><td>写真の左右反転</td></tr>
</table></div>

<h2>「変わらないもの」を意識しよう</h2>
<p>どの移動でも「長さ・角度・面積」は絶対に変わらない。<br>
つまり移動前と移動後の図形は<strong>合同（まったく同じ形と大きさ）</strong>。<br>
変わるのは「位置」と「向き」だけ。<br>
これを知っていると「移動前の辺の長さ = 移動後の対応する辺の長さ」とすぐ使えます。</p>
`},
{id:30,section:'ch4',title:'円はなぜ特別な図形？',desc:'最も美しい図形の性質を探る',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>「完璧な形」の正体</h2>
<p>マンホールのフタはなぜ丸いか知っていますか？ 四角だと対角線方向に回転させたとき穴に落ちてしまいます。でも円は<strong>どの方向の直径も同じ長さ</strong>だから、絶対に落ちない。円の「完璧な対称性」が安全を守っているのです。</p>
<p>円の定義は「<strong>ある1点（中心）から、等しい距離にあるすべての点の集まり</strong>」。この「どの方向にも平等」という性質が、車のタイヤ、時計、コイン、CDなど、あらゆるところで円が使われている理由です。</p>

<h2>円と接線の不思議な関係</h2>
<p>自転車のタイヤが地面に触れている点——これが「接点」で、地面が「接線」です。接線は円と<strong>たった1点でだけ触れている直線</strong>。そして接線は必ず、接点と中心を結ぶ半径と<strong>90°（垂直）</strong>で交わります。</p>
<p>なぜ垂直になるのか？ もし垂直でなかったら、接線は円の内側に入り込んでしまい、2点で交わってしまいます。1点だけで触れるためには、垂直であるしかないのです。</p>

<div class="callout"><div class="callout-title">📐 円の基本用語を整理</div><strong>弦</strong>：円周上の2点を結ぶ線分（ギターの弦のイメージ）。<strong>弧</strong>：円周の一部分（虹のカーブ）。<strong>接線</strong>：円と1点だけで接する直線。そして大切な性質：<strong>中心から弦に垂線を下ろすと、弦をちょうど半分に分ける</strong>。</div>

<h2>自然界は円でいっぱい</h2>
<p>水面に石を投げたときの波紋は同心円。太陽も月も、遠くから見ればほぼ円。虹はジェット機に乗ると実は完全な円に見えます。木の幹の断面も年輪という同心円。<strong>自然は「中心から等距離」を好む</strong>のです。それは円が最もエネルギー的に安定した形だからです。</p>

<h2>円の性質を知ると「なぜそうなってるか」がわかる</h2>
<p>丸いピザは中心からどこを切っても均等に分けられる。自転車のタイヤが丸いのは、中心（車軸）から縁までの距離が常に同じだからガタガタせず滑らかに回転する。缶ジュースが丸いのは、同じ量を入れるのに最も少ない材料で済む（＝最も効率的な形）から。コインが丸いと自販機の中をスムーズに転がる。<strong>身の回りのものが丸い理由は、すべて円の数学的性質で説明できる</strong>のです。</p>

<div class="tip-box"><div class="tip-title">💡 円は「究極のバランス」</div>正三角形、正方形、正五角形…と辺の数を増やしていくと、だんだん丸に近づいていきます。<strong>円は「辺が無限にある正多角形」</strong>とも言えるのです。だからこそ、あらゆる方向に対して均等で、最もバランスの取れた形なのです。</div>

<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
円は「中心から等距離にある点の集まり」——この定義から<strong>たくさんの性質が生まれる</strong>。<br>
接線は円と1点だけで触れ、接点で半径と垂直になる。<br>
マンホールが丸いのも、タイヤが丸いのも、円の「どの方向も等しい」性質のおかげ。
</div>

<div class="confirm-box"><div class="confirm-title">📋 円の基本用語まとめ</div>
<table><tr><th>用語</th><th>意味</th><th>身近な例</th></tr>
<tr><td>半径</td><td>中心から円周上の点までの距離</td><td>タイヤの中心から縁まで</td></tr>
<tr><td>直径</td><td>中心を通る弦（半径の2倍）</td><td>コインの幅</td></tr>
<tr><td>弦</td><td>円周上の2点を結ぶ線分</td><td>ギターの弦のイメージ</td></tr>
<tr><td>弧</td><td>円周の一部</td><td>虹のカーブ</td></tr>
<tr><td>接線</td><td>円と1点だけで接する直線</td><td>タイヤと地面の接触点</td></tr>
</table></div>

<h2>「接線は半径に垂直」をイメージしよう</h2>
<p>自転車のタイヤ（円）が地面に触れている点を想像してください。<br>
タイヤの中心から接触点への線（半径）と、地面（接線）は<strong>必ず垂直（90°）</strong>になっています。<br>
もし垂直でなかったら、タイヤは地面にめり込んでしまいますよね。<br>
<strong>「接線 ⊥ 半径」——これが接線の最重要性質です</strong>。</p>
`},
{id:31,section:'ch4',title:'面積と周の長さの計算',desc:'なぜ公式にπが現れるのか',tag:'realworld',tagLabel:'実用',time:7,
content:`
<h2>πの正体——「円のDNA」</h2>
<p>どんな大きさの円でも、円周の長さを直径で割ると必ず同じ数になります。それが<strong>π（パイ）≒ 3.14159…</strong>。直径10cmの円の周は約31.4cm、直径100cmなら約314cm。<strong>πはすべての円に共通する「遺伝子」</strong>のような数なのです。</p>
<p>紀元前3世紀、シラクサの天才<strong>アルキメデス</strong>は円に内接する正96角形と外接する正96角形を使って、πが3.1408〜3.1429の間にあることを突き止めました。コンピュータもない時代に、手計算だけでこの精度を出したのは驚異的です。</p>

<h2>円の面積公式はピザで理解できる</h2>
<p>円を薄いピザのスライスのようにたくさん切り分けて、交互に並べると……だんだん<strong>長方形に近い形</strong>になります。この長方形の底辺は円周の半分（πr）、高さは半径（r）。だから面積 = πr × r = <strong>πr²</strong>。公式を丸暗記しなくても、ピザを並べれば「そうなるしかない」と納得できます。</p>

<div class="callout"><div class="callout-title">📐 覚えておきたい面積公式</div><strong>三角形</strong>：底辺×高さ÷2（「なぜ÷2？」→ 長方形の半分だから）<br><strong>平行四辺形</strong>：底辺×高さ（切って並べ替えると長方形になる）<br><strong>台形</strong>：(上底+下底)×高さ÷2（2つ並べると平行四辺形になる）<br><strong>円</strong>：πr²<br><strong>扇形</strong>：πr²×(中心角/360)</div>

<h2>扇形は「円のケーキカット」</h2>
<p>ホールケーキ（円）を中心角90°で切り分けたら、それは円の1/4。面積も弧の長さも円全体の1/4です。<strong>中心角が何度かさえわかれば、「360°のうち何割か」で計算できる</strong>のです。</p>

<div class="tip-box"><div class="tip-title">💡 公式は「導ける」もの</div>すべての面積公式は「長方形の面積＝たて×よこ」から導けます。暗記に頼るのではなく「なぜその形になるか」を理解すると、忘れても自分で作り直せます。これが最強の暗記法です。</div>
<h2>公式を「使える」と世界が広がる</h2>
<p>「このピザ、直径30cmだけど何人分？」——面積 = π×15² ≒ 706cm²。1人分を100cm²とすると約7人分。「体育で走るトラック1周は何m？」——半径50mなら 2π×50 ≒ 314m。「この丸いシール、画用紙に何枚貼れる？」も面積の計算。日常のちょっとした疑問に<strong>パッと答えられると、ちょっとカッコいい</strong>ですよね。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
πは「どんな円でも円周÷直径が常に同じ値になる」——その値が約3.14159…。<br>
円の面積＝πr²（ピザを扇形に切って並べると長方形になることで導ける）。<br>
扇形は「円全体の○/360」として考える。
</div>

<div class="confirm-box"><div class="confirm-title">📋 面積と弧の長さの公式まとめ</div>
<table><tr><th>図形</th><th>面積</th><th>周（弧の長さ）</th></tr>
<tr><td>円（半径r）</td><td>πr²</td><td>2πr</td></tr>
<tr><td>扇形（半径r、中心角a°）</td><td>πr² × a/360</td><td>2πr × a/360</td></tr>
</table></div>

<h2>公式を「導いて」確認しよう</h2>
<p>扇形の面積：中心角90°の扇形は、円全体の90/360 = 1/4。<br>
だから面積 = πr² × 1/4 = πr²/4。<br>
弧の長さ = 2πr × 1/4 = πr/2。<br>
<strong>「360°の何分の何か」を考えれば、どんな扇形の面積と弧も求まります。</strong></p>
`},
{id:32,section:'ch4',title:'いろいろな立体の世界',desc:'角柱・角錐・円柱・円錐・球の正体',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>立体を「底面の形」と「伸び方」で分類する</h2>
<p>世の中の立体は、意外とシンプルに分類できます。底面が多角形で、それをまっすぐ上に伸ばしたら<strong>角柱</strong>（ティッシュ箱、鉛筆、プリズム）。底面が多角形で、1つの点に向かって尖らせたら<strong>角錐</strong>（エジプトのピラミッド）。底面が円ならそれぞれ<strong>円柱</strong>（缶ジュース）と<strong>円錐</strong>（ソフトクリームのコーン）。そして底面を持たない究極の対称体が<strong>球</strong>（サッカーボール、地球）です。</p>

<h2>正多面体は宇宙に5つだけ</h2>
<p>すべての面が同じ正多角形で、各頂点に同じ数の面が集まる立体を<strong>正多面体</strong>と言います。実はこの条件を満たす立体は、<strong>宇宙にたった5種類</strong>しか存在しません。正四面体、正六面体（サイコロ）、正八面体、正十二面体、正二十面体です。6種類目は数学的に不可能——これは2300年前にユークリッドが証明しました。</p>
<p>古代ギリシャの哲学者プラトンは、この5つの正多面体に宇宙の元素（火・土・空気・水・宇宙）を対応させました。だから正多面体は「<strong>プラトンの立体</strong>」とも呼ばれます。</p>

<div class="callout"><div class="callout-title">📐 展開図——立体を「開く」</div>立体をハサミで切り開いて平面に広げたものが展開図。同じ立体でも切り方によって展開図は異なります。サイコロ（正六面体）の展開図は<strong>全部で11種類</strong>あります。「組み立てたときどの辺がくっつくか」をイメージする力が、立体図形問題の基礎になります。</div>

<div class="tip-box"><div class="tip-title">💡 身の回りで立体を見つけよう</div>冷蔵庫は直方体、電池は円柱、アイスのコーンは円錐。日常生活で見かける物体がどの立体に分類されるか考えてみると、立体の感覚が自然に身につきます。</div>
<h2>立体を理解すると「空間を操る」力がつく</h2>
<p>マインクラフトで家を建てるとき、立体の構造がわかる人は美しい建築ができる。テトリスで「このブロックはここに入る」と判断するのも空間把握力。荷物をカバンに詰めるとき「これを先に入れて、隙間にこれを入れると全部入る」とわかるのも立体の感覚。<strong>立体を理解すると「空間を上手に使う力」が育つ</strong>。ゲームでもスポーツでも日常の片づけでも、この力が活きる場面はたくさんあります。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
立体は「底面の形」と「伸び方（上に伸ばすか尖らせるか）」で分類できる。<br>
正多面体は宇宙に5種類しか存在しない（プラトンの立体）。<br>
展開図とは「立体を切り開いて平面に広げたもの」——同じ立体でも複数の展開図がある。
</div>

<div class="confirm-box"><div class="confirm-title">📋 立体の種類まとめ</div>
<table><tr><th>種類</th><th>底面</th><th>特徴</th><th>身近な例</th></tr>
<tr><td>角柱</td><td>多角形</td><td>まっすぐ上に伸びる</td><td>ティッシュ箱、鉛筆</td></tr>
<tr><td>角錐</td><td>多角形</td><td>頂点に向かって尖る</td><td>ピラミッド</td></tr>
<tr><td>円柱</td><td>円</td><td>まっすぐ上に伸びる</td><td>缶ジュース</td></tr>
<tr><td>円錐</td><td>円</td><td>頂点に向かって尖る</td><td>ソフトクリームのコーン</td></tr>
<tr><td>球</td><td>なし</td><td>完全な対称体</td><td>ボール、地球</td></tr>
</table></div>

<h2>サイコロの展開図は11種類ある</h2>
<p>正六面体（サイコロ）の展開図は、切り開く場所によって<strong>全部で11種類</strong>あります。<br>
すべて同じ正六面体に戻せますが、形はバラバラに見える。<br>
「どの展開図が正六面体になるか」を頭でイメージできるようになると、空間把握力が上がります。<br>
<strong>テストでよく出るのは「組み立てると向かい合う面はどれか」の問題</strong>です。</p>
`},
{id:33,section:'ch4',title:'直線や平面の位置関係',desc:'平行・垂直・ねじれの位置',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>平面では起きない「ねじれ」という関係</h2>
<p>2本の直線の関係は、平面上なら「交わる」か「平行」の2つだけ。でも空間に出ると、第3の関係が現れます。交わりもしないし、平行でもない——<strong>ねじれの位置</strong>です。</p>
<p>身近な例で考えましょう。教室のドアの上辺（横の線）と、教室の隅の柱（縦の線）。この2本は交わっていません。かといって平行でもない（向きが違う）。これが「ねじれの位置」です。歩道橋の上の道路と下の道路も、ねじれの位置の関係にあります。</p>

<h2>直方体は「位置関係の教科書」</h2>
<p>直方体（箱の形）の12本の辺には、平行・垂直・ねじれのすべてが含まれています。たとえば底面の前辺と底面の奥辺は<strong>平行</strong>。底面の前辺と左側面の縦辺は<strong>垂直</strong>。底面の前辺と上面の奥辺は<strong>ねじれの位置</strong>。お菓子の箱を手に取って確認してみましょう。</p>

<div class="callout"><div class="callout-title">📐 位置関係のまとめ</div><strong>2直線</strong>：①交わる ②平行 ③ねじれの位置<br><strong>直線と平面</strong>：①交わる（1点で） ②平行 ③直線が平面上にある<br><strong>2平面</strong>：①交わる（交線ができる） ②平行</div>

<h2>建築もゲームも位置関係の塊</h2>
<p>建築では柱と梁（はり）の位置関係を正確に把握しないと、構造が成り立ちません。3Dゲームの世界を作るクリエイターは、壁・床・天井という平面と、キャラクターの移動方向という直線の位置関係を常に計算しています。マインクラフトで建物を作るとき、あなたも無意識に空間の位置関係を使っているのです。</p>

<div class="tip-box"><div class="tip-title">💡 ねじれの見つけ方</div>「同じ平面上にあるか？」を考えましょう。2本の直線が1つの平面に収まるなら、交わるか平行。収まらないなら、ねじれの位置です。</div>
<h2>空間を理解すると見える世界が変わる</h2>
<p>マインクラフトで家を建てるとき、「この柱と梁は平行？ 垂直？ ねじれ？」を無意識に判断しています。バスケでパスを出すとき、味方と敵の「空間的な位置関係」を読んでいます。教室で「あの席とこの席は離れてるけど、間に柱があるから見えない」——これもねじれの位置の感覚。<strong>空間の位置関係がわかると、3次元で物事を考える力が育つ</strong>。ゲームもスポーツも上手くなる土台です。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
空間内の2直線の関係は3種類：<strong>交わる・平行・ねじれの位置</strong>。<br>
ねじれの位置とは「交わりもせず、平行でもない」——空間でしか起きない関係。<br>
直方体（箱）を手に持ちながら確認するのが一番わかりやすい。
</div>

<div class="confirm-box"><div class="confirm-title">📋 直線と平面の位置関係</div>
<table><tr><th>関係</th><th>内容</th><th>例</th></tr>
<tr><td>交わる</td><td>1点で交わる</td><td>地面に刺さる棒</td></tr>
<tr><td>平行</td><td>どこまで延ばしても交わらない</td><td>地面と水平に飛ぶドローン</td></tr>
<tr><td>直線が平面上にある</td><td>直線全体が平面の中にある</td><td>床の上の直線</td></tr>
</table></div>

<h2>ねじれの位置を確認しよう</h2>
<p>教室で確認：「黒板の上辺（横の線）」と「教室の右後ろの柱（縦の線）」。<br>
・交わっている？ → NO（違う場所にある）<br>
・平行？ → NO（向きが違う、黒板は横向き、柱は縦向き）<br>
→ だから<strong>ねじれの位置</strong>！<br>
お菓子の箱や牛乳パックでも試してみましょう。</p>
`},
{id:34,section:'ch4',title:'回転体と投影図',desc:'平面図形を立体に変える魔法',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>平面が回ると立体になる</h2>
<p>陶芸のろくろを回すとき、粘土の断面（平面）が回転することで花瓶（立体）が生まれます。これが<strong>回転体</strong>の考え方です。長方形を1辺を軸にして回すと<strong>円柱</strong>、直角三角形を回すと<strong>円錐</strong>、半円を回すと<strong>球</strong>になります。</p>
<p>傘を開く瞬間も回転体のイメージです。折りたたまれた三角形の布が、軸の周りを回転して円錐型に広がる。<strong>日常のあちこちに回転体は潜んでいます</strong>。</p>

<h2>投影図——立体の「証明写真」</h2>
<p>パスポートの証明写真は正面から撮りますよね。でも正面だけでは横顔はわかりません。立体の形を正確に伝えるには、<strong>正面（立面図）・真上（平面図）・真横（側面図）</strong>の3方向から見た図が必要です。これが<strong>投影図</strong>です。</p>
<p>建築家が設計図を描くとき、必ずこの3方向の投影図を用意します。正面図だけでは奥行きがわからず、上から見た図だけでは高さがわからない。<strong>3つの視点を組み合わせて初めて、立体が完全に特定できる</strong>のです。</p>

<div class="callout"><div class="callout-title">📐 回転体の見つけ方</div>コップ、ワイングラス、ボウル、電球、ボール——これらはすべて回転体です。「何を回したらこの形になるか」を考えてみると、断面の形が見えてきます。ワイングラスは複雑な曲線を回転させた形。</div>

<h2>2次元と3次元を行き来する力</h2>
<p>3Dプリンターは設計データ（2次元の断面情報）を積み重ねて立体を作ります。CTスキャンは体の断面画像を組み合わせて立体的な映像にします。<strong>2次元と3次元を自由に行き来する力</strong>は、テクノロジーの世界で最も求められるスキルのひとつです。</p>

<div class="tip-box"><div class="tip-title">💡 投影図から立体を当てるコツ</div>正面が四角形、真上が円 → 円柱。正面が三角形、真上が円 → 円錐。正面が三角形、真上が三角形 → 三角錐。まず「丸いか四角いか」で分類しましょう。</div>
<h2>「平面から立体を想像する力」はめちゃくちゃ役立つ</h2>
<p>プラモデルの説明書（平面）を見て完成形（立体）を想像する。ゲームのマップ画面（平面）からフィールドの地形（立体）をイメージする。3Dプリンターで何か作りたいとき、断面をデザインして立体にする。お菓子の箱の展開図から「組み立てるとどんな形？」を読み取る。<strong>平面と立体を頭の中で行き来する力</strong>は、ものづくり、ゲーム、絵を描くこと——好きなことを上達させる土台になります。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
回転体とは<strong>「平面図形を1本の軸で回したときにできる立体」</strong>。<br>
長方形を回すと円柱、直角三角形を回すと円錐、半円を回すと球になる。<br>
投影図とは「正面・真上・真横の3方向から見た図」——3つそろって初めて立体が特定できる。
</div>

<div class="confirm-box"><div class="confirm-title">📋 平面図形と回転体の対応</div>
<table><tr><th>回す前の平面図形</th><th>できる立体</th><th>例</th></tr>
<tr><td>長方形</td><td>円柱</td><td>缶ジュース</td></tr>
<tr><td>直角三角形（直角を含む辺を軸）</td><td>円錐</td><td>アイスのコーン</td></tr>
<tr><td>半円（直径を軸）</td><td>球</td><td>ボール</td></tr>
<tr><td>台形</td><td>円錐台（上が切れた円錐）</td><td>バケツ</td></tr>
</table></div>

<h2>投影図から立体を当てよう</h2>
<p>「正面から見ると四角形、真上から見ると円」→ <strong>円柱</strong>！<br>
「正面から見ると三角形、真上から見ると円」→ <strong>円錐</strong>！<br>
「正面から見ると円、真上から見ても円」→ <strong>球</strong>！<br>
<strong>「真上（平面図）が丸なら底面が円（円柱か円錐か球）、四角なら角柱か角錐」</strong>と覚えましょう。</p>
`},
{id:35,section:'ch4',title:'空間図形の計量',desc:'体積と表面積の求め方',tag:'realworld',tagLabel:'実用',time:7,
content:`
<h2>「何リットル入る？」に答える数学</h2>
<p>ペットボトルに水が何mL入るか。水槽に何リットルの水が必要か。引っ越しの段ボール何箱分の荷物があるか。<strong>体積を計算できるということは、「空間をどれだけ使えるか」を数で把握できる</strong>ということです。</p>

<h2>なぜ錐体の体積は柱体の3分の1なのか</h2>
<p>円柱の体積 = 底面積 × 高さ。では円錐は？ 同じ底面・同じ高さの円柱に砂を入れる実験をすると、<strong>円錐ちょうど3杯分で円柱がいっぱいになります</strong>。だから円錐の体積 = 底面積 × 高さ × 1/3。</p>
<p>なぜ「3分の1」なのか。イメージとしては、円柱を「先端に向かって均等に絞っていく」と、使える空間が1/3に縮まるということ。ソフトクリームのコーン（円錐）に入るアイスの量が、同じ大きさの筒（円柱）より少ないのは体感的にもわかりますよね。</p>

<div class="callout"><div class="callout-title">📐 体積公式の整理</div><strong>角柱・円柱</strong>：底面積 × 高さ<br><strong>角錐・円錐</strong>：底面積 × 高さ × 1/3<br><strong>球</strong>：4πr³/3<br>球の公式は「身の上に（4/3）心配（πr³）あーる（r）」と語呂合わせで覚える人もいます。</div>

<h2>表面積は「包装紙の面積」</h2>
<p>プレゼントを包むとき、箱全体を覆うのに必要な包装紙の面積——それが表面積です。立体を展開図に開いて、<strong>すべての面の面積を合計</strong>すれば求まります。円錐の側面は展開すると扇形になるので、扇形の面積公式を使います。</p>

<div class="tip-box"><div class="tip-title">💡 1L = 1000cm³</div>水1リットルは1000cm³。牛乳パック（1L）は底面7cm×7cm×高さ約20.4cmで、7×7×20.4 ≒ 1000cm³。身近なもので体積の感覚をつかみましょう。</div>
<h2>体積がわかると「量」の感覚が身につく</h2>
<p>料理で「大さじ1 = 15mL = 15cm³」。ペットボトル500mL = 500cm³。お風呂の浴槽は約200L = 200,000cm³。<strong>数字と実際の量を結びつけられる感覚</strong>は、料理、買い物、DIY、旅行の荷造りなど日常のあちこちで役立ちます。「この箱にこの荷物は入るかな？」を頭の中で計算できるようになると、ちょっとカッコいいですよね。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
体積は<strong>「その立体がどれだけの空間を占めるか」</strong>を表す数。<br>
柱体（角柱・円柱）：底面積×高さ。錐体（角錐・円錐）：底面積×高さ×1/3。<br>
表面積とは「立体全体の外側の面積の合計」——展開図を広げた面積と同じ。
</div>

<div class="confirm-box"><div class="confirm-title">📋 体積公式まとめ</div>
<table><tr><th>立体</th><th>体積</th><th>メモ</th></tr>
<tr><td>角柱・円柱</td><td>底面積 × 高さ</td><td>まっすぐ積み上げた量</td></tr>
<tr><td>角錐・円錐</td><td>底面積 × 高さ × 1/3</td><td>円柱の3分の1</td></tr>
<tr><td>球</td><td>4πr³/3</td><td>語呂：身の上（4/3）に心配（π）あーる（r³）</td></tr>
</table></div>

<h2>「1/3」の理由をイメージしよう</h2>
<p>同じ底面・同じ高さの円柱と円錐を用意する。<br>
円錐に砂を入れてから円柱に移すと……<strong>ちょうど3回で円柱がいっぱいになる</strong>！<br>
これが体積 = 底面積×高さ×<strong>1/3</strong> の理由。<br>
ソフトクリームのコーン（円錐）より同じサイズの筒（円柱）のほうが3倍入るのは体感でもわかりますね。</p>
`},
{id:36,section:'ch4',title:'角の基本性質',desc:'対頂角・同位角・錯角はなぜ等しい？',tag:'concept',tagLabel:'概念',time:7,
content:`
<h2>角度の世界にもルールがある</h2>
<p>2本の直線が交わると4つの角ができます。向かい合った角（<strong>対頂角</strong>）は必ず等しい。なぜ？ 直線はまっすぐで180°。隣り合う2つの角の和は180°。すると向かい合う角は「180° − 同じ角」だから等しくなるのです。見た目で「なんとなく等しそう」ではなく、<strong>論理的に「等しいしかない」</strong>と言えるのがポイントです。</p>

<h2>平行線が生む不思議な等式</h2>
<p>電車のレール（平行な2本の線）に、踏切の道路（1本の直線）が斜めに交わっている場面を想像してください。レールの左側にできる角と右側にできる角を見比べると、<strong>同じ位置にある角（同位角）</strong>と<strong>互い違いの位置にある角（錯角）</strong>が等しくなっています。</p>
<p>なぜ等しくなるのか？ 平行線は「どこまで行っても同じ間隔」。つまり、同じ角度で交わるしかないのです。もし角度が違ったら、2本の線はいつか交わってしまい、平行ではなくなります。</p>

<div class="callout"><div class="callout-title">📐 角の基本定理</div>① 対頂角は等しい<br>② 平行線の同位角は等しい<br>③ 平行線の錯角は等しい<br>④ 三角形の内角の和 = 180°<br>⑤ 三角形の外角 = 隣り合わない2つの内角の和<br>この5つが角度計算の「五種の神器」です。</div>

<h2>内角の和が180°になる理由</h2>
<p>三角形の1辺を延長して、頂点を通る平行線を引くと、錯角と同位角を使って3つの内角が一直線に並びます。だから合計180°。この証明は美しく、<strong>「平行線の性質」から「三角形の内角の和」が導かれる</strong>という、数学のつながりの良い例です。</p>

<div class="tip-box"><div class="tip-title">💡 図に印を書き込もう</div>角度の問題を解くときは、平行線には矢印の印「→」を、等しい角には同じ印を書き込みましょう。見えなかったものが見えてきます。</div>
<h2>角度がわかると「なぜそうなるか」が説明できる</h2>
<p>サッカーでシュートコースを考えるとき、「このまま蹴ると角度的にポストに当たる」と判断する。ビリヤードで球が壁に当たって跳ね返る角度は入射角と反射角が等しい。カメラの画角が広いと広い範囲が写る。<strong>角度の感覚は、スポーツでもゲームでも写真でも「なぜそうなるか」を論理的に説明する力</strong>になります。角の性質はその基礎なのです。</p>


<div class="summary-box"><div class="summary-title">📝 ざっくり言うとこういうこと</div>
角度計算の基本は5つの法則：<strong>対頂角・平行線の同位角・錯角・三角形の内角の和180°・外角の定理</strong>。<br>
対頂角は等しい。平行線の同位角・錯角は等しい。<br>
「なんとなく等しそう」ではなく「論理的に等しいしかない」と言えることが大事。
</div>

<div class="confirm-box"><div class="confirm-title">📋 角度の5つの法則</div>
<table><tr><th>法則</th><th>内容</th></tr>
<tr><td>① 対頂角</td><td>2直線が交わったとき、向かい合う角は等しい</td></tr>
<tr><td>② 同位角</td><td>平行線と交差する直線で、同じ位置にある角は等しい</td></tr>
<tr><td>③ 錯角</td><td>平行線と交差する直線で、ジグザグの位置にある角は等しい</td></tr>
<tr><td>④ 内角の和</td><td>三角形の3つの内角の和は180°</td></tr>
<tr><td>⑤ 外角の定理</td><td>三角形の外角は、隣り合わない2つの内角の和に等しい</td></tr>
</table></div>

<h2>三角形の内角の和が180°になる理由</h2>
<p>三角形の頂点Aを通り、辺BCに平行な直線を引く。<br>
するとAのまわりに3つの角が並び、合計で一直線（180°）になる。<br>
それぞれが錯角または同位角で三角形の内角と等しい → 内角の和 = 180°。<br>
<strong>「平行線の性質 → 三角形の内角の和」という論理のつながりが美しい</strong>のです。</p>
`},
{id:37,section:'ch4',title:'合同な図形',desc:'「まったく同じ形」を数学的に証明する',tag:'concept',tagLabel:'概念',time:8,
content:`
<h2>「同じに見える」と「同じだと証明できる」の違い</h2>
<p>2つの三角形がまったく同じ形に見えても、数学では「見た目」は証拠になりません。テストで「たぶん合ってると思う」と書いても点はもらえないですよね。<strong>「なぜ同じだと言えるのか」を論理的に示す</strong>必要がある。それが「合同の証明」です。</p>

<h2>なぜ3つの条件でいいの？</h2>
<p>三角形には6つの要素（3つの辺と3つの角）がありますが、6つ全部を確認する必要はありません。<strong>たった3つの情報</strong>で三角形の形は完全に決まるのです。</p>

<div class="callout"><div class="callout-title">📐 三角形の合同条件</div>①<strong>3組の辺</strong>がそれぞれ等しい（辺・辺・辺）<br>②<strong>2組の辺とその間の角</strong>がそれぞれ等しい（辺・角・辺）<br>③<strong>1組の辺とその両端の角</strong>がそれぞれ等しい（角・辺・角）<br>たとえば、竹ひごで3本の長さが決まれば三角形は1つしか作れない（①の根拠）。2本の竹ひごの長さとその間の角度が決まれば、残りの辺と角は自動的に決まる（②の根拠）。</div>

<h2>証明は「論理のリレー」</h2>
